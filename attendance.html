<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
html,body{overflow-x:hidden;max-width:100vw;background:var(--bg);color:var(--text);transition:.3s}
body{padding:6px;padding-bottom:6px;min-height:100dvh}
.en{font-family:'JetBrains Mono',monospace!important;direction:ltr!important;text-align:center}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:9px;padding:8px 9px;width:100%}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin:6px 0}
.stat{border-radius:9px;padding:7px 3px;border:1px solid var(--card-border);text-align:center;background:var(--card)}
.stat small{font-size:7.8px;font-weight:700;opacity:.8;display:block;color:var(--text-soft)}
.stat b,.stat input{font-size:10.7px!important;font-weight:900;color:var(--text)}
.time-box{width:92%;border:1px solid var(--card-border);border-radius:7px;padding:6px 2px;text-align:center;font-size:9.7px;background:var(--bg);color:var(--text);outline:none;font-weight:800;transition:.2s}
.time-box.filled{background:var(--hero)!important;color:#fff!important;border-color:var(--hero)!important}
.time-box.half{background:var(--bg-soft)!important;border-color:var(--hero)!important;color:var(--hero)!important}
.note-box{width:95%;border:1px dashed var(--card-border);border-radius:7px;padding:5px 3px;font-size:8.3px;background:var(--bg);color:var(--text);outline:none;text-align:center}
.table-wrap{background:var(--card);border:1px solid var(--card-border);border-radius:9px;overflow:hidden;width:100%;display:flex;flex-direction:column;flex:1}
.table-head{display:grid;grid-template-columns:1.2fr .8fr .8fr .6fr 1fr .35fr .35fr;background:var(--bg-soft);font-size:7.8px;font-weight:800;padding:7px 3px;text-align:center;color:var(--text-soft);border-bottom:1px solid var(--card-border);position:sticky;top:0;z-index:2}
.row-item{display:grid;grid-template-columns:1.2fr .8fr .8fr .6fr 1fr .35fr .35fr;gap:3px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--bg-soft);background:var(--card)}
.row-item:nth-child(even){background:var(--bg-soft)}
.row-item.done{border-right:3px solid var(--hero)}
.clear-btn{border:none;background:#FFF1F2;color:#ef4444;width:22px;height:22px;border-radius:7px;font-size:11px;cursor:pointer;border:1px solid #FECDD3;display:flex;align-items:center;justify-content:center}
#days{max-height:none!important;overflow:visible!important}
#mainWrap{display:flex;flex-direction:column;min-height:calc(100dvh - 12px)}
#proModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99999;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(6px)}
#proModal.show{display:flex}
.modal-box{background:var(--card);width:100%;max-width:330px;border-radius:16px;overflow:hidden;border:1px solid var(--card-border)}
</style><script src="drive-sync.js?v=9"></script><style>html,body{max-width:430px;margin:0 auto !important;background:var(--bg);} body{border-left:1px solid var(--card-border);border-right:1px solid var(--card-border); min-height:100dvh;}</style></head><body>
<div id="mainWrap" style="max-width:600px;margin:0 auto;width:100%">
<div class="card" style="display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20">
<div style="display:flex;gap:5px;align-items:center"><div style="font-size:9.7px;font-weight:900">⏱️ الحضور</div><button onclick="toggleTop()" id="toggleBtn" style="background:var(--bg-soft);border:1px solid var(--card-border);padding:3px 8px;border-radius:999px;font-size:8.3px;font-weight:700;color:var(--text)">▲ إخفاء</button></div>
<div style="display:flex;gap:3px;align-items:center"><div id="monthLabel" class="en" style="font-size:9.7px;background:var(--hero);color:#fff;padding:3px 8px;border-radius:999px;font-weight:900">8 / 2026</div><button onclick="changeMonth(-1)" style="background:var(--card);border:1px solid var(--card-border);width:24px;height:24px;border-radius:7px;font-weight:900">‹</button><button onclick="changeMonth(1)" style="background:var(--card);border:1px solid var(--card-border);width:24px;height:24px;border-radius:7px;font-weight:900">›</button><div id="clock" class="en" style="font-size:8.7px;background:var(--bg-soft);padding:3px 7px;border-radius:999px">00:00:00</div></div>
</div>
<div id="topInfo">
<div class="stats">
<div class="stat"><small>سعر الساعة</small><b id="outPrice" class="en">0</b></div>
<div class="stat"><small>الساعة</small><input id="v1" type="tel" class="en" value="1,200" onfocus="unFmt(this)" onblur="fmtField(this);calcTotals()" oninput="calcTotals()" style="width:100%;border:none;background:transparent;text-align:center;outline:none"></div>
<div class="stat"><small>كم يوم</small><input id="v2" type="tel" class="en" value="26" oninput="calcTotals()" style="width:100%;border:none;background:transparent;text-align:center;outline:none"></div>
<div class="stat"><small>عدد الساعات</small><b id="outTotal" class="en">0</b></div>
<div class="stat"><small>الصافي</small><b id="outSafi" class="en">0</b></div>
<div class="stat"><small>المطلوب</small><input id="v3" type="tel" class="en" value="15,000" onfocus="unFmt(this)" onblur="fmtField(this);calcTotals()" oninput="calcTotals()" style="width:100%;border:none;background:transparent;text-align:center;outline:none"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:6px 0">
<div class="card" style="display:flex;justify-content:space-between;align-items:center;background:var(--hero);color:#fff;border-color:var(--hero);padding:8px 9px"><span style="font-size:8.3px;font-weight:700">المطلوب يومياً</span><span id="outDaily" class="en" style="font-weight:900;font-size:9.7px;background:rgba(255,255,255,.25);padding:3px 7px;border-radius:999px">0</span></div>
<button onclick="openCloseModal()" id="closeBtn" style="background:var(--hero);color:#fff;border:none;border-radius:8px;padding:8px;font-size:9.7px;font-weight:900">🔒 قفل الشهر وقبضت ✅</button>
</div>
<div id="closedList" style="margin:6px 0;display:flex;gap:4px;flex-wrap:wrap"></div>
</div>
<div class="table-wrap"><div class="table-head"><div>اليوم</div><div>حضور</div><div>انصراف</div><div>ساعات</div><div>ملاحظات</div><div>إجازة</div><div>مسح</div></div><div id="days"></div></div>
</div>

<div id="proModal" onclick="if(event.target==this)closeModal()"><div class="modal-box"><div style="padding:16px;text-align:center"><div id="modalIcon" style="width:42px;height:42px;background:#FFF1F2;border-radius:11px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:20px">🗑️</div><div id="modalTitle" style="font-weight:900;font-size:12.5px;color:var(--text)">تمسح حضور اليوم ده؟</div><div id="modalDesc" style="font-size:9.5px;color:var(--text-soft);margin-top:4px">هيتم مسح الحضور والانصراف بس</div></div><div style="display:flex;gap:8px;padding:10px;background:var(--bg-soft);border-top:1px solid var(--card-border)"><button onclick="closeModal()" style="flex:1;background:var(--card);border:1px solid var(--card-border);padding:10px;border-radius:9px;font-weight:800">إلغاء</button><button id="modalOk" onclick="confirmModal()" style="flex:1;background:#ef4444;color:#fff;border:none;padding:10px;border-radius:9px;font-weight:900">مسح ✓</button></div></div></div>

<script>
let modalAction=null, modalKey=null;
function openClearModal(key){ modalAction='clear'; modalKey=key; document.getElementById('proModal').classList.add('show'); }
function openCloseModal(){ modalAction='close'; document.getElementById('modalIcon').innerText='🔒'; document.getElementById('modalTitle').innerText=`هتقفل شهر ${curM+1}/${curY}؟`; document.getElementById('proModal').classList.add('show'); }
function closeModal(){ document.getElementById('proModal').classList.remove('show'); modalAction=null; modalKey=null; }
function confirmModal(){ if(modalAction==='clear'){ doClearDay(modalKey); }else if(modalAction==='close'){ doCloseMonth(); } closeModal(); }
let topHidden=localStorage.getItem('att_top_hidden')==='1';let curDate=new Date();let activeKey=localStorage.getItem('att_active_month');if(!activeKey){ activeKey=`${curDate.getFullYear()}-${curDate.getMonth()+1}`; localStorage.setItem('att_active_month',activeKey); }let [curY,curM]=activeKey.split('-').map(Number); curM=curM-1;let closed=JSON.parse(localStorage.getItem('att_closed')||'{}');
function toggleTop(){topHidden=!topHidden;localStorage.setItem('att_top_hidden',topHidden?'1':'0');applyTop();}
function applyTop(){
  document.getElementById('topInfo').style.display=topHidden?'none':'block';
  document.getElementById('toggleBtn').innerText=topHidden?'▼ إظهار':'▲ إخفاء';
}
function changeMonth(d){curM+=d;if(curM<0){curM=11;curY--;}if(curM>11){curM=0;curY++;}renderAll();}
function doCloseMonth(){let key=`${curY}-${curM+1}`;if(closed[key])return;let totalH=document.getElementById('outTotal').innerText;let totalMoney=document.getElementById('outSafi').innerText;closed[key]={hours:totalH,money:totalMoney};localStorage.setItem('att_closed',JSON.stringify(closed));curM++; if(curM>11){curM=0;curY++;}activeKey=`${curY}-${curM+1}`;localStorage.setItem('att_active_month',activeKey);renderAll();}
function renderClosedList(){let html='';Object.keys(closed).forEach(k=>{html+=`<span style="font-size:7.8px;background:var(--bg-soft);border:1px solid var(--card-border);padding:3px 7px;border-radius:999px">🔒 ${k} - ${closed[k].money}ج</span>`;});document.getElementById('closedList').innerHTML=html;}
let data=JSON.parse(localStorage.getItem('att_fixed_final')||'{}');let hols=JSON.parse(localStorage.getItem('att_hols_fixed')||'{}');let notes=JSON.parse(localStorage.getItem('att_notes')||'{}');
function fmtNum(n){ if(n===''||n==null) return '-'; let x=typeof n==='string'?parseFloat(n.toString().replace(/,/g,'')):n; if(isNaN(x)) return n; return x.toLocaleString('en-US'); }
function fmtInt(n){ return Math.round(n||0).toLocaleString('en-US'); }
function fmtField(el){ let raw=el.value.replace(/,/g,'').trim(); if(!raw) return; let num=parseFloat(raw); if(!isNaN(num)) el.value=num.toLocaleString('en-US'); }
function unFmt(el){ el.value=el.value.replace(/,/g,''); el.select(); }
function toEn(s){return String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g,'').replace(/[^0-9.:]/g,'');}
function parseHour(v){if(!v) return 0;v=toEn(v);if(v.includes(':')){let p=v.split(':');return (parseFloat(p[0])||0)+(parseFloat(p[1])||0)/60;}return parseFloat(v)||0;}
function calcDiff(a,b){if(!a||!b) return 0;let s=parseHour(a), e=parseHour(b);let d=e-s;if(d<0)d+=24;return d>0?d:0;}
function renderAll(){const list=document.getElementById('days');document.getElementById('monthLabel').innerText=`${curM+1} / ${curY}`;const y=curY,m=curM;const dim=new Date(y,m+1,0).getDate();let html='';for(let i=1;i<=dim;i++){const key=`${y}-${m+1}-${i}`;const rec=data[key]||{in:'',out:''};const isHol=hols[key];const hours=calcDiff(rec.in,rec.out);const dayAr=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'][new Date(y,m,i).getDay()];const noteVal=notes[key]||'';const isDone=rec.in&&rec.out&&!isHol;const inClass=rec.in?(isDone?'filled':'half'):'';const outClass=rec.out?(isDone?'filled':'half'):'';html+=`<div class="row-item ${isDone?'done':''}"><div style="font-size:8.7px;font-weight:700">${dayAr} <span class="en" style="font-size:7.8px;color:var(--text-soft)">(${i}/${m+1})</span></div><input id="in-${key}" type="tel" class="time-box en ${inClass}" value="${rec.in}" placeholder="7" ${isHol?'disabled':''} oninput="saveD('${key}','in',this.value)"><input id="out-${key}" type="tel" class="time-box en ${outClass}" value="${rec.out}" placeholder="19" ${isHol?'disabled':''} oninput="saveD('${key}','out',this.value)"><div id="h-${key}" class="en" style="font-size:9.7px;font-weight:900;color:${isDone?'var(--hero)':''}">${isHol?'-':hours?hours.toFixed(2):'-'}</div><input id="note-${key}" type="text" class="note-box" placeholder="ملاحظة..." value="${noteVal}" oninput="saveNote('${key}',this.value)"><button onclick="toggleHol('${key}')" style="border:none;background:${isHol?'var(--hero)':'var(--bg-soft)'};width:19px;height:19px;border-radius:5px;font-size:8.7px;color:${isHol?'#fff':'var(--text-soft)'};border:1px solid var(--card-border)">${isHol?'✓':'○'}</button><button class="clear-btn" onclick="openClearModal('${key}')">✕</button></div>`;}list.innerHTML=html;calcTotals();renderClosedList();}
function doClearDay(k){ data[k]={in:'',out:''}; localStorage.setItem('att_fixed_final',JSON.stringify(data)); renderAll(); }
function saveD(k,t,v){let clean=toEn(v);if(!data[k]) data[k]={in:'',out:''};data[k][t]=clean;localStorage.setItem('att_fixed_final',JSON.stringify(data));const h=calcDiff(data[k].in,data[k].out);const hEl=document.getElementById('h-'+k);if(hEl){ hEl.innerText=h?h.toFixed(2):'-'; hEl.style.color=h?'var(--hero)':''; }const inEl=document.getElementById('in-'+k);const outEl=document.getElementById('out-'+k);const row=inEl?.closest('.row-item');const isDone=data[k].in&&data[k].out;if(row) row.classList.toggle('done',!!isDone);if(inEl){ inEl.classList.remove('filled','half'); if(data[k].in) inEl.classList.add(isDone?'filled':'half'); }if(outEl){ outEl.classList.remove('filled','half'); if(data[k].out) outEl.classList.add(isDone?'filled':'half'); }calcTotals();}
function saveNote(k,v){notes[k]=v;localStorage.setItem('att_notes',JSON.stringify(notes));}
function toggleHol(k){if(hols[k]) delete hols[k]; else hols[k]=true;localStorage.setItem('att_hols_fixed',JSON.stringify(hols));renderAll();}
function calcTotals(){let v1=parseFloat(toEn(document.getElementById('v1').value))||0;let v2=parseFloat(toEn(document.getElementById('v2').value))||1;let total=0;Object.entries(data).forEach(([k,r])=>{let [yy,mm]=k.split('-').map(Number);if(yy===curY&&mm===curM+1&&!hols[k]) total+=calcDiff(r.in,r.out);});const price=v2?v1/v2:0;const v3=parseFloat(toEn(document.getElementById('v3').value))||0;document.getElementById('outPrice').innerText=price?price.toFixed(2):'0';document.getElementById('outTotal').innerText=total.toFixed(2);document.getElementById('outSafi').innerText=Math.round(total*price).toLocaleString('en-US');document.getElementById('outDaily').innerText=price&&v2?(v3/price/v2).toFixed(2):'0.00';}
setInterval(()=>{const el=document.getElementById('clock');if(el) el.innerText=new Date().toLocaleTimeString('en-GB',{hour12:false});},1000);applyTop();renderAll();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
