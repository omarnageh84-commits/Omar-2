<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<script src="themes.js"></script>
<title>مساحة العمل</title>
<style>
:root{--hero:#D97706;--bg:#FDF6E3;--bg-soft:#FFF7ED;--card:#FFFFFF;--card-border:#F5E6C8;--text:#1C1917;--text-soft:#A16207;--primary:#D97706}
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',sans-serif}
body{background:var(--bg);height:100dvh;overflow:hidden;display:flex;flex-direction:column;transition:.3s}
#app{flex:1;display:flex;flex-direction:column;background:var(--card);overflow:hidden;max-width:600px;margin:0 auto;width:100%;border-left:1px solid var(--card-border);border-right:1px solid var(--card-border)}
.nu-scroll::-webkit-scrollbar{width:0}
.color-dot{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--card);box-shadow:0 0 0 1px var(--card-border);cursor:pointer;flex-shrink:0}
.color-dot.active{box-shadow:0 0 0 2px var(--text)}
.excel-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.excel-cell{width:100%;aspect-ratio:1;border-radius:4px;border:1px solid var(--card-border);cursor:pointer}
.tab{flex:1;padding:7px 2px;border:none;border-radius:8px;background:transparent;font-size:9.8px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--text-soft)}
.tab.active{background:var(--hero);color:#fff;font-weight:800;box-shadow:0 2px 8px color-mix(in srgb, var(--hero) 35%, transparent)}
#cameraVideo{width:100%;border-radius:10px;background:#000;aspect-ratio:3/4;object-fit:cover}
.hidden-note{background:var(--hero);color:#fff;border-radius:10px;padding:9px;margin-bottom:7px;border:1px solid var(--card-border);line-height:1.6;font-size:11.5px}
.filter-chip{padding:6px 9px;border-radius:99px;border:1px solid var(--card-border);background:var(--card);font-size:9.8px;font-weight:800;cursor:pointer;white-space:nowrap;color:var(--text-soft)}
.filter-chip.active{background:var(--hero);color:#fff;border-color:var(--hero)}
#deleteWarningModal,#secretCodeModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:11000;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(8px)}
#deleteWarningModal.show,#secretCodeModal.show{display:flex}
.rich-toolbar{display:flex;gap:5px;padding:7px;background:var(--bg-soft);border-radius:9px;margin-bottom:7px;overflow:auto;align-items:center;flex-shrink:0;direction:rtl}
.rich-toolbar button{border:1px solid var(--card-border);background:var(--card);padding:6px 10px;border-radius:7px;font-weight:800;flex-shrink:0;cursor:pointer;color:var(--text);font-size:11.5px;min-width:32px}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--card);box-shadow:0 0 0 1px #ccc;cursor:pointer;flex-shrink:0}
.rich-editor{flex:1;min-height:30vh;border:1px solid var(--card-border);border-radius:9px;padding:11px;outline:none;background:var(--card);line-height:1.8;overflow:auto;direction:rtl;text-align:right;white-space:pre-wrap;word-break:break-word;color:var(--text);font-size:12.6px}
.rich-editor ul,.rich-editor ol{list-style-position:inside;padding:0;padding-right:20px;margin:9px 0;direction:rtl;text-align:right}
#board{flex:1;overflow:auto;padding:7px;display:flex;flex-direction:column;gap:7px;background:var(--bg)}
</style>
<script src="drive-sync.js"></script><style>html,body{max-width:430px;margin:0 auto !important;background:var(--bg);} body{border-left:1px solid var(--card-border);border-right:1px solid var(--card-border); min-height:100dvh;}</style></head>
<body>
<div id="app">
<div style="padding:9px 11px;border-bottom:1px solid var(--card-border);display:flex;justify-content:space-between;align-items:center;background:var(--card);position:sticky;top:0;z-index:5">
<div style="display:flex;gap:9px;align-items:center;"><div id="vaultTrigger" style="width:36px;height:36px;background:var(--hero);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;font-size:16px">✦</div><div><div style="font-weight:800;font-size:12.6px;color:var(--text)">مساحة العمل</div><div id="stats" style="font-size:9.2px;color:var(--text-soft);"></div></div></div>
<div style="display:flex;gap:5px;"><button onclick="openManager()" style="background:var(--bg-soft);border:1px solid var(--card-border);padding:7px 9px;border-radius:8px;cursor:pointer;font-weight:700;color:var(--text);font-size:9.2px">⚙ إدارة</button><button onclick="addQuick()" style="background:var(--hero);color:#fff;border:none;padding:7px 11px;border-radius:8px;font-weight:800;cursor:pointer;font-size:9.2px">+ جديد</button></div>
</div>
<div style="padding:7px;background:var(--bg-soft);border-bottom:1px solid var(--card-border);">
<input id="mainInput" placeholder="ابحث أو أضف مهمة..." style="width:100%;background:var(--card);border:1px solid var(--card-border);padding:8px 9px;border-radius:9px;outline:none;font-weight:700;color:var(--text);font-size:11.5px">
<div style="display:flex;gap:5px;margin-top:7px;align-items:center;"><select id="cat" style="flex:1;background:var(--card);border:1px solid var(--card-border);border-radius:8px;padding:7px;font-weight:700;color:var(--text);font-size:10.3px"></select><div id="quickColors" style="display:flex;gap:5px;flex:1;overflow:auto" class="nu-scroll"></div><button onclick="doAdd()" style="background:var(--hero);color:#fff;border:none;border-radius:8px;padding:7px 11px;font-weight:900;cursor:pointer;font-size:10.3px">إضافة</button></div>
</div>
<div style="background:var(--card);border-bottom:1px solid var(--card-border);padding:7px 9px;"><div id="taskTabsFilter" style="display:flex;gap:5px;overflow:auto" class="nu-scroll">
<button onclick="filterTasksTab('all')" id="tt_all" class="filter-chip active">الكل</button>
<button onclick="filterTasksTab('صيدلية')" id="tt_صيدلية" class="filter-chip">💊 صيدلية</button>
<button onclick="filterTasksTab('شغل')" id="tt_شغل" class="filter-chip">💻 شغل</button>
<button onclick="filterTasksTab('شخصي')" id="tt_شخصي" class="filter-chip">🏠 شخصي</button>
<button onclick="filterTasksTab('done')" id="tt_done" class="filter-chip">✓ منجز</button>
</div></div>
<div id="board" class="nu-scroll"></div>
</div>
<div id="secretCodeModal" onclick="if(event.target==this)closeSecretModal()"><div style="background:var(--card);color:var(--text);width:100%;max-width:345px;border-radius:18px;padding:16px;border:1px solid var(--card-border)"><div style="text-align:center"><div style="width:40px;height:40px;background:var(--bg-soft);border-radius:11px;display:flex;align-items:center;justify-content:center;margin:0 auto 7px;font-size:18px">✦</div><div style="font-weight:800;font-size:12.6px">الرقم التعريفي السري</div></div><input id="secretInput" type="tel" inputmode="numeric" placeholder="279" style="width:100%;background:var(--bg-soft);border:1px solid var(--card-border);padding:9px;border-radius:9px;color:var(--text);text-align:center;margin-top:11px;font-size:16px;font-weight:800"><div style="display:flex;gap:7px;margin-top:11px"><button onclick="closeSecretModal()" style="flex:1;background:var(--bg-soft);border:1px solid var(--card-border);padding:9px;border-radius:9px;font-size:10.3px">إلغاء</button><button onclick="saveSecretCode()" style="flex:1;background:var(--hero);color:#fff;border:none;padding:9px;border-radius:9px;font-size:10.3px">حفظ</button></div><div id="currentCodeHint" style="font-size:9.2px;color:var(--text-soft);text-align:center;margin-top:9px"></div></div></div>
<div id="deleteWarningModal" onclick="if(event.target==this)closeDeleteWarning()"><div style="background:var(--card);width:100%;max-width:345px;border-radius:18px;overflow:hidden;border:1px solid var(--card-border)"><div style="background:#FEF2F2;padding:14px;text-align:center"><div style="font-size:28px">⚠️</div><div style="font-weight:900;color:#991B1B;font-size:12.6px">هتحذف؟</div></div><div style="padding:11px"><div id="delTaskPreview" style="background:var(--bg-soft);border:1px solid var(--card-border);border-radius:9px;padding:9px;margin-bottom:9px;font-size:11.5px"></div><label style="display:flex;gap:7px;align-items:center;background:var(--bg-soft);border:1px solid var(--card-border);border-radius:9px;padding:8px"><input type="checkbox" id="delConfirmCheck" onchange="toggleDelBtn()"><span style="font-size:10.3px;font-weight:700">أنا متأكد</span></label><div style="display:flex;gap:9px;margin-top:9px"><button onclick="closeDeleteWarning()" style="flex:1;background:var(--bg-soft);border:1px solid var(--card-border);padding:9px;border-radius:9px;font-size:10.3px">إلغاء</button><button id="finalDelBtn" onclick="confirmDelete()" disabled style="flex:1;background:#E5E7EB;color:#9CA3AF;border:none;padding:9px;border-radius:9px;font-weight:800;font-size:10.3px">حذف</button></div></div></div></div>
<div id="managerModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;align-items:center;justify-content:center;padding:11px"><div style="background:var(--card);width:100%;max-width:437px;border-radius:16px;overflow:hidden;max-height:85vh;display:flex;flex-direction:column;border:1px solid var(--card-border)"><div style="display:flex;gap:4px;background:var(--bg-soft);margin:9px;padding:4px;border-radius:9px"><button onclick="mTab('cats')" id="mTabCats" style="flex:1;padding:7px;border:none;border-radius:7px;background:var(--card);font-weight:700;color:var(--text);font-size:10.3px">📁 التصنيفات</button><button onclick="mTab('colors')" id="mTabColors" style="flex:1;padding:7px;border:none;border-radius:7px;background:transparent;color:var(--text-soft);font-size:10.3px">🎨 الألوان</button></div><div style="flex:1;overflow:auto;padding:0 11px 11px" class="nu-scroll"><div id="mCats"><div style="display:flex;gap:5px;margin-bottom:11px"><input id="newCatEmoji" placeholder="💊" style="width:41px;text-align:center;border:1px solid var(--card-border);border-radius:8px;padding:7px;background:var(--card);color:var(--text);font-size:11.5px"><input id="newCatName" placeholder="اسم التصنيف" style="flex:1;border:1px solid var(--card-border);border-radius:8px;padding:7px;background:var(--card);color:var(--text);font-size:11.5px"><button onclick="addCategory()" style="background:var(--hero);color:#fff;border:none;padding:7px 11px;border-radius:8px;font-size:11.5px">+</button></div><div id="catList"></div></div><div id="mColors" style="display:none"><div id="excelTheme" class="excel-grid"></div><div id="excelStandard" class="excel-grid" style="margin-top:9px"></div></div></div><div style="padding:9px 11px;border-top:1px solid var(--card-border)"><button onclick="closeManager()" style="width:100%;background:var(--bg-soft);border:1px solid var(--card-border);padding:8px;border-radius:9px;color:var(--text);font-size:10.3px">إغلاق</button></div></div></div>
<div id="modal" style="display:none;position:fixed;inset:0;background:var(--card);z-index:9999;flex-direction:column;max-width:600px;margin:0 auto">
<div id="modalCover" style="height:69px;position:relative;flex-shrink:0;background:var(--bg-soft);border-bottom:1px solid var(--card-border)"><button onclick="closeModal()" style="position:absolute;top:9px;left:9px;background:rgba(0,0,0,.15);border:none;width:32px;height:32px;border-radius:50%;color:#000;font-weight:800;cursor:pointer;font-size:14px">✕</button></div>
<div style="padding:9px;flex:1;overflow:auto;display:flex;flex-direction:column;background:var(--bg)" class="nu-scroll">
<h2 id="modalTitle" contenteditable="true" style="font-size:13.8px;font-weight:800;outline:none;border-bottom:1px dashed var(--card-border);padding-bottom:7px;margin-bottom:9px;color:var(--text)"></h2>
<div style="background:var(--card);border:1px solid var(--card-border);border-radius:11px;padding:8px;margin-bottom:9px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><b style="font-size:10.3px">✔ مهام فرعية</b><span id="subProgress" style="font-size:9.2px;background:var(--bg-soft);padding:3px 7px;border-radius:99px">0/0</span></div><div id="subList" style="display:flex;flex-direction:column;gap:5px;margin-bottom:7px"></div><div style="display:flex;gap:5px"><input id="subInput" placeholder="مهمة فرعية + Enter" style="flex:1;border:1px solid var(--card-border);border-radius:7px;padding:7px;background:var(--card);color:var(--text);font-size:10.3px"><button onclick="addSub()" style="background:var(--hero);color:#fff;border:none;padding:7px 11px;border-radius:7px;font-weight:800;font-size:10.3px">+</button></div><div style="height:5px;background:var(--bg-soft);border-radius:10px;margin-top:7px;overflow:hidden"><div id="subBar" style="height:100%;width:0%;background:var(--hero)"></div></div></div>
<div style="display:flex;gap:4px;background:var(--bg-soft);padding:4px;border-radius:9px;margin-bottom:9px;overflow:auto" class="nu-scroll">
<button onclick="tab('colors')" id="tColors" class="tab">🎨 ألوان</button><button onclick="tab('camera')" id="tCamera" class="tab">📷 كاميرا</button><button onclick="tab('draw')" id="tDraw" class="tab">✏ رسم</button><button onclick="tab('voice')" id="tVoice" class="tab">🎙 فويس</button><button onclick="tab('note')" id="tNote" class="tab active">📝 نوت</button><button onclick="tab('rem')" id="tRem" class="tab">⏰ منبه</button><button onclick="tab('hidden')" id="tHidden" class="tab" style="display:none;background:var(--hero);color:#fff">🔒 الخاص</button>
</div>
<div id="pColors" style="display:none"><div style="display:flex;gap:7px;align-items:center;background:var(--bg-soft);padding:8px;border-radius:9px;margin-bottom:7px"><div style="font-size:10.3px;font-weight:700">اللون الحالي:</div><div id="currentColorPreview" style="width:23px;height:23px;border-radius:7px;border:1px solid var(--card-border);background:var(--card)"></div><button onclick="toggleAllColors()" style="margin-right:auto;background:var(--card);border:1px solid var(--card-border);padding:5px 9px;border-radius:7px;font-size:9.2px">عرض كل الألوان ▼</button></div><div id="allColorsBox" style="display:none;max-height:230px;overflow:auto;background:var(--bg-soft);padding:7px;border-radius:9px;border:1px solid var(--card-border)" class="nu-scroll"><div id="modalColorsTheme" class="excel-grid"></div><div id="modalColorsStandard" class="excel-grid" style="margin-top:7px"></div></div></div>
<div id="pCamera" style="display:none"><div style="display:flex;gap:5px;margin-bottom:7px"><button onclick="openCamera()" style="flex:1;background:var(--hero);color:#fff;border:none;padding:8px;border-radius:8px;font-weight:700;font-size:10.3px">📷 كاميرا</button><button onclick="document.getElementById('task-photo-file').click()" style="flex:1;background:var(--bg-soft);border:1px solid var(--card-border);padding:8px;border-radius:8px;font-weight:700;font-size:10.3px">🖼 معرض</button><input type="file" id="task-photo-file" accept="image/*" style="display:none" onchange="handleFile(this)"></div><div id="cameraBox" style="display:none"><video id="cameraVideo" autoplay playsinline></video><canvas id="cameraCanvas" style="display:none"></canvas><div style="display:flex;gap:5px;margin-top:7px"><button onclick="closeCamera()" style="flex:1;background:var(--bg-soft);border:1px solid var(--card-border);padding:7px;border-radius:7px;font-size:10.3px">إلغاء</button><button onclick="takePhoto()" style="flex:1;background:var(--hero);color:#fff;border:none;padding:7px;border-radius:7px;font-size:10.3px">التقاط</button></div></div><div id="photoGallery" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:7px"></div></div>
<div id="pDraw" style="display:none"><canvas id="canvas" style="width:100%;height:184px;border:1.5px dashed var(--card-border);border-radius:9px;background:var(--card)"></canvas><div style="display:flex;gap:5px;margin-top:7px;align-items:center"><input type="color" id="penColor" value="#111111" style="width:36px;height:32px;border:none"><input type="range" id="penSize" min="1" max="15" value="4" style="flex:1"><button onclick="clearCanvas()" style="background:#FEE2E2;border:none;padding:6px 9px;border-radius:7px;color:#ef4444;font-size:9.2px">مسح</button></div><button onclick="saveDraw()" style="width:100%;margin-top:7px;background:var(--hero);color:#fff;border:none;padding:8px;border-radius:8px;font-size:10.3px">💾 حفظ الرسم</button><div id="drawGallery" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:7px"></div></div>
<div id="pVoice" style="display:none"><div style="background:var(--bg-soft);border-radius:11px;padding:11px;text-align:center;border:1px solid var(--card-border)"><div id="timer" style="font-size:18px;font-weight:800">00:00</div><button id="recBtn" onclick="toggleRec()" style="width:58px;height:58px;border-radius:50%;background:#ef4444;border:none;color:#fff;font-size:20px;margin-top:7px">●</button><div style="font-size:9.2px;color:var(--text-soft);margin-top:5px">دوس للتسجيل</div></div><div id="voiceList" style="margin-top:7px;display:flex;flex-direction:column;gap:5px"></div></div>
<div id="pNote" style="display:flex;flex:1;flex-direction:column">
<div class="rich-toolbar">
<button onmousedown="event.preventDefault()" onclick="formatNote('bold')"><b>B</b></button>
<button onmousedown="event.preventDefault()" onclick="changeFontSize(2)">A+</button>
<button onmousedown="event.preventDefault()" onclick="changeFontSize(-2)">A-</button>
<button onmousedown="event.preventDefault()" onclick="formatNote('insertUnorderedList')">• نقط</button>
<button onmousedown="event.preventDefault()" onclick="formatNote('insertOrderedList')">1. ترقيم</button>
<div class="dot" style="background:#ef4444" onmousedown="event.preventDefault();applyNoteColor('#ef4444')"></div>
<div class="dot" style="background:#22c55e" onmousedown="event.preventDefault();applyNoteColor('#22c55e')"></div>
<div class="dot" style="background:#3b82f6" onmousedown="event.preventDefault();applyNoteColor('#3b82f6')"></div>
<div class="dot" style="background:#f59e0b" onmousedown="event.preventDefault();applyNoteColor('#f59e0b')"></div>
<div class="dot" style="background:#8b5cf6" onmousedown="event.preventDefault();applyNoteColor('#8b5cf6')"></div>
<div class="dot" style="background:var(--text)" onmousedown="event.preventDefault();applyNoteColor('#111111')"></div>
</div>
<div id="noteEditor" class="rich-editor" contenteditable="true"></div>
<button onclick="saveNote()" style="width:100%;margin-top:7px;background:var(--hero);color:#fff;border:none;padding:8px;border-radius:9px;font-weight:800;font-size:10.3px">حفظ النوت</button>
</div>
<div id="pRem" style="display:none">
  <div style="background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:11px">
    <label style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;margin-bottom:11px"><span>🔔 تفعيل المنبه الاحترافي</span><input type="checkbox" id="remEnabled" onchange="toggleRem()" style="width:20px;height:20px"></label>
    <div id="remBox" style="display:none">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px"><div><div style="font-size:9.2px;color:var(--text-soft);margin-bottom:2px">التاريخ</div><input type="date" id="remDate" style="width:100%;border:1px solid var(--card-border);border-radius:8px;padding:8px;background:var(--bg-soft);font-size:11.5px"></div><div><div style="font-size:9.2px;color:var(--text-soft);margin-bottom:2px">الوقت</div><input type="time" id="remTime" style="width:100%;border:1px solid var(--card-border);border-radius:8px;padding:8px;background:var(--bg-soft);font-size:11.5px"></div></div>
      <div style="margin-bottom:9px"><div style="font-size:9.2px;color:var(--text-soft);margin-bottom:2px">التكرار</div><select id="remRepeat" onchange="updateRepeatUI()" style="width:100%;border:1px solid var(--card-border);border-radius:8px;padding:8px;background:var(--bg-soft);font-size:11.5px"><option value="none">🔕 مرة واحدة</option><option value="daily">🔁 يومياً</option><option value="weekly">📅 أسبوعياً</option><option value="monthly">🗓️ شهرياً</option><option value="yearly">🎂 سنوياً</option><option value="custom_days">⏱️ كل X أيام</option><option value="custom_hours">⏰ كل X ساعات</option><option value="weekdays">📌 أيام محددة</option></select></div>
      <div id="customRepeatBox" style="display:none;background:var(--bg-soft);border:1px dashed var(--card-border);border-radius:9px;padding:9px;margin-bottom:9px"><div id="customDaysUI" style="display:none"><label style="font-size:10.3px">كل كام يوم؟</label><input type="number" id="remEveryDays" value="2" min="1" style="width:100%;padding:7px;border-radius:7px;border:1px solid var(--card-border);margin-top:5px"></div><div id="customHoursUI" style="display:none"><label style="font-size:10.3px">كل كام ساعة؟</label><input type="number" id="remEveryHours" value="3" min="1" style="width:100%;padding:7px;border-radius:7px;border:1px solid var(--card-border);margin-top:5px"></div><div id="weekdaysUI" style="display:none"><label style="font-size:10.3px">اختار الأيام:</label><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px"><label style="font-size:10.3px"><input type="checkbox" value="6" class="wd"> سبت</label><label style="font-size:10.3px"><input type="checkbox" value="0" class="wd"> أحد</label><label style="font-size:10.3px"><input type="checkbox" value="1" class="wd"> اثنين</label><label style="font-size:10.3px"><input type="checkbox" value="2" class="wd"> ثلاثاء</label><label style="font-size:10.3px"><input type="checkbox" value="3" class="wd"> أربعاء</label><label style="font-size:10.3px"><input type="checkbox" value="4" class="wd"> خميس</label><label style="font-size:10.3px"><input type="checkbox" value="5" class="wd"> جمعة</label></div></div></div>

event.preventDefault();applyHiddenColor('#ffffff')"></div></div><input id="hiddenTitle" placeholder="عنوان..." style="width:100%;background:var(--card);border:1px solid var(--card-border);padding:7px;border-radius:7px;color:var(--text);margin-bottom:7px;font-size:10.3px"><div id="hiddenBody" class="rich-editor" contenteditable="true" style="background:var(--card);color:var(--text);min-height:17vh;font-size:11.5px"></div><div style="display:flex;gap:5px;margin-top:7px"><button onclick="saveHiddenRich()" style="flex:1;background:var(--hero);color:#fff;border:none;padding:7px;border-radius:7px;font-weight:800;font-size:10.3px">حفظ</button><button onclick="closeHiddenEditor()" style="flex:1;background:var(--bg-soft);border:1px solid var(--card-border);padding:7px;border-radius:7px;font-size:10.3px">إلغاء</button></div></div><input id="hSearch" placeholder="بحث..." oninput="renderHidden()" style="width:100%;background:var(--bg-soft);border:1px solid var(--card-border);padding:7px 9px;border-radius:7px;font-size:10.3px;margin-bottom:7px"><div id="hList"></div></div></div>

<script>
// تابع للرئيسية فقط - نفس فكرة الحضور
(function(){ const s=localStorage.getItem('theme')||'paper'; if(typeof applyTheme==='function') applyTheme(s); })();
window.addEventListener('storage',()=>{ const s=localStorage.getItem('theme')||'paper'; if(typeof applyTheme==='function') applyTheme(s); });

/* نفس كل كودك القديم + المنبه الاحترافي + حفظ المؤشر - مختصر للقراءة */
function loadOldTasks(){let old=JSON.parse(localStorage.getItem('tasks_v6')||'null');if(!old||old.length===0){old=JSON.parse(localStorage.getItem('tasks_v5')||localStorage.getItem('tasks')||'[]');}return old;}
function fmt(n){if(n===''||n==null)return'';let x=typeof n==='string'?parseFloat(n.toString().replace(/,/g,'')):n;if(isNaN(x))return n;return x.toLocaleString('en-US')}
function formatTextNumbers(t){return (t||'').replace(/\b\d{4,}\b/g,m=>fmt(m))}
const themeColors=[["#70AD47","#5B9BD5","#FFC000","#A5A5A5","#ED7D31","#4472C4","#2F5597","#D9D9D9","#000000","#FFFFFF"],["#E2EFDA","#D6EAF8","#FFF2CC","#F2F2F2","#FCE4D6","#D9E2F3","#D6DCE4","#EDEDED","#808080","#F2F2F2"],["#C6E0B4","#BDD7EE","#FFE699","#D9D9D9","#F8CBAD","#B4C6E7","#ACB9CA","#BFBFBF","#595959","#D9D9D9"],["#A9D08E","#9BC2E6","#FFD966","#BFBFBF","#F4B084","#8EA9DB","#7F8EA6","#808080","#262626","#BFBFBF"],["#548235","#2E75B6","#BF8F00","#7F7F7F","#C55A11","#305496","#203764","#404040","#0D0D0D","#7F7F7F"],["#375623","#1F4E79","#7F6003","#595959","#833C0B","#203764","#152238","#000000","#404040"]];
const standardColors=["#7030A0","#002060","#0070C0","#00B0F0","#00B050","#92D050","#FFFF00","#FFC000","#FF0000","#C00000"];
let defaultCats=[{id:1,emoji:'💊',name:'صيدلية'},{id:2,emoji:'💻',name:'شغل'},{id:3,emoji:'🏠',name:'شخصي'}];
let defaultColorsList=[{id:1,name:'أبيض',hex:'#ffffff'}];
let cats=JSON.parse(localStorage.getItem('cats_v5')||JSON.stringify(defaultCats));
let colors=JSON.parse(localStorage.getItem('colors_v5')||JSON.stringify(defaultColorsList));
let tasks=loadOldTasks();
if(tasks.length===0){tasks=[{id:Date.now(),text:'طلبية صيدلية',cat:'صيدلية',color:'#E2EFDA',done:false,drawings:[],photos:[],voices:[],note:'',subtasks:[],reminder:null}];}
let cur=null,rec=null,chunks=[],timerInt=null,sec=0,stream=null,cameraStream=null;
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let drawing=false,lx=0,ly=0,selectedHex='#ffffff',activeTaskTab='all',boardSearch='',currentNoteColor='#111111',currentHiddenColor='#ffffff',currentFontSize=12,currentHiddenFontSize=12;
let lastNoteRange=null,lastHiddenRange=null;
function save(){localStorage.setItem('tasks_v6',JSON.stringify(tasks));localStorage.setItem('cats_v5',JSON.stringify(cats));localStorage.setItem('colors_v5',JSON.stringify(colors));render()}
function renderExcelTheme(){const c1=document.getElementById('excelTheme');if(c1){c1.innerHTML='';themeColors.flat().forEach(hex=>{const d=document.createElement('div');d.className='excel-cell';d.style.background=hex;d.onclick=()=>selectColor(hex);c1.appendChild(d);});}const c2=document.getElementById('excelStandard');if(c2){c2.innerHTML='';standardColors.forEach(hex=>{const d=document.createElement('div');d.className='excel-cell';d.style.background=hex;d.onclick=()=>selectColor(hex);c2.appendChild(d);});}const m1=document.getElementById('modalColorsTheme');if(m1){m1.innerHTML='';themeColors.flat().forEach(hex=>{const d=document.createElement('div');d.className='excel-cell';d.style.background=hex;d.style.height='20px';if(cur&&cur.color===hex)d.style.outline='2px solid var(--hero)';d.onclick=()=>selectModalColor(hex);m1.appendChild(d);});}const m2=document.getElementById('modalColorsStandard');if(m2){m2.innerHTML='';standardColors.forEach(hex=>{const d=document.createElement('div');d.className='excel-cell';d.style.background=hex;d.style.height='20px';if(cur&&cur.color===hex)d.style.outline='2px solid var(--hero)';d.onclick=()=>selectModalColor(hex);m2.appendChild(d);});}}
function renderManagerLists(){document.getElementById('cat').innerHTML=cats.map(c=>`<option value="${c.name}">${c.emoji} ${c.name}</option>`).join('');document.getElementById('catList').innerHTML=cats.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg-soft);padding:7px 9px;border-radius:8px;margin-bottom:5px;border:1px solid var(--card-border)"><div style="color:var(--text);font-size:10.3px">${c.emoji} <b>${c.name}</b></div><button onclick="delCat(${c.id})" style="border:none;background:#FEE2E2;width:25px;height:25px;border-radius:6px;color:#ef4444">✕</button></div>`).join('');renderQuickColors();renderExcelTheme()}
function renderQuickColors(){const row=document.getElementById('quickColors');const all=[...standardColors,...themeColors[0]];row.innerHTML=all.slice(0,8).map(c=>`<div onclick="selectColor('${c}')" class="color-dot ${selectedHex===c?'active':''}" style="background:${c}"></div>`).join('')}
function selectColor(hex){selectedHex=hex;renderQuickColors()}
function selectModalColor(hex){if(!cur)return;cur.color=hex;document.getElementById('modalCover').style.background=hex;document.getElementById('currentColorPreview').style.background=hex;renderExcelTheme();save()}
function toggleAllColors(){const box=document.getElementById('allColorsBox');box.style.display=box.style.display==='none'?'block':'none'}
function openManager(){document.getElementById('managerModal').style.display='flex';mTab('cats')}
function closeManager(){document.getElementById('managerModal').style.display='none'}
function mTab(t){document.getElementById('mCats').style.display=t==='cats'?'block':'none';document.getElementById('mColors').style.display=t==='colors'?'block':'none';}
function addCategory(){const n=document.getElementById('newCatName').value.trim(),e=document.getElementById('newCatEmoji').value.trim()||'📌';if(!n)return;cats.push({id:Date.now(),emoji:e,name:n});document.getElementById('newCatName').value='';renderManagerLists();save();}
function delCat(id){cats=cats.filter(c=>c.id!==id);renderManagerLists();save();}
function addQuick(){document.getElementById('mainInput').focus()}
function filterTasksTab(cat){activeTaskTab=cat;document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));document.getElementById('tt_'+cat)?.classList.add('active');render();}
function getSecretCode(){try{const v=localStorage.getItem('__my_secret_num__');if(!v) return '279';return atob(v);}catch{return '279'}}
function doAdd(){const inp=document.getElementById('mainInput');const val=inp.value.trim();if(!val) return;const secret=getSecretCode();if(val===secret){inp.value='';boardSearch='';revealHiddenTab();return;}tasks.unshift({id:Date.now(),text:val,cat:document.getElementById('cat').value||cats[0].name,color:selectedHex||'#ffffff',done:false,drawings:[],photos:[],voices:[],note:'',subtasks:[],reminder:null});inp.value='';boardSearch='';save();}
document.getElementById('mainInput').addEventListener('input',e=>{const v=e.target.value.trim();const secret=getSecretCode();if(v===secret){revealHiddenTab();return;}boardSearch=v.toLowerCase();render();});
document.getElementById('mainInput').addEventListener('keydown',e=>{if(e.key==='Enter')doAdd()});
document.getElementById('subInput').addEventListener('keydown',e=>{if(e.key==='Enter')addSub()});
function render(){renderManagerLists();let filtered=tasks;if(activeTaskTab!=='all'){if(activeTaskTab==='done')filtered=filtered.filter(t=>t.done);else filtered=filtered.filter(t=>t.cat===activeTaskTab);}if(boardSearch)filtered=filtered.filter(t=>t.text.toLowerCase().includes(boardSearch));document.getElementById('stats').innerText=`${fmt(filtered.length)}/${fmt(tasks.length)} • ${activeTaskTab}`;const board=document.getElementById('board');if(!filtered.length){board.innerHTML=`<div style="text-align:center;padding:23px 11px;color:var(--text-soft)"><div style="font-size:28px">📭</div><div style="margin-top:7px;font-size:10.3px">مفيش مهام</div></div>`;return}board.innerHTML=filtered.map(t=>{const catObj=cats.find(c=>c.name===t.cat)||{emoji:'📌'};const total=t.subtasks?.length||0,done=t.subtasks?.filter(s=>s.done).length||0;const hasRem=t.reminder&&t.reminder.enabled? '⏰':'';return `<div onclick="openCard(${t.id})" style="background:${t.color==='white'||t.color==='#ffffff'? 'var(--card)' : t.color};border:1px solid var(--card-border);border-radius:11px;padding:8px 9px;cursor:pointer"><div style="display:flex;justify-content:space-between;gap:7px"><div style="font-size:11.5px;font-weight:700;flex:1;color:var(--text)">${hasRem} ${formatTextNumbers(t.text)}</div><div style="width:9px;height:9px;border-radius:50%;background:${t.done?'#22c55e':'var(--hero)'};flex-shrink:0;margin-top:4px"></div></div><div style="display:flex;gap:5px;margin-top:7px;flex-wrap:wrap"><span style="font-size:9.2px;background:var(--card);padding:4px 7px;border-radius:99px;font-weight:700;border:1px solid var(--card-border);color:var(--text-soft)">${catObj.emoji} ${t.cat}</span>${total?`<span style="font-size:9.2px;background:var(--card);padding:4px 7px;border-radius:99px;font-weight:700;border:1px solid var(--card-border);color:var(--text-soft)">✔ ${fmt(done)}/${fmt(total)}</span>`:''}${hasRem?`<span style="font-size:9.2px;background:#DBEAFE;padding:4px 7px;border-radius:99px;font-weight:700;color:#2563EB">${t.reminder.repeat}</span>`:''}</div></div>`;}).join('');}
async function openCamera(){const box=document.getElementById('cameraBox');box.style.display='block';try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});document.getElementById('cameraVideo').srcObject=cameraStream;}catch(e){alert('الكاميرا غير مسموحة');}}
function closeCamera(){document.getElementById('cameraBox').style.display='none';if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}}
function takePhoto(){const v=document.getElementById('cameraVideo');const c=document.getElementById('cameraCanvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const d=c.toDataURL('image/jpeg',0.8);if(!cur.photos)cur.photos=[];cur.photos.unshift(d);refreshPhotos();closeCamera();save();}
function handleFile(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{if(!cur.photos)cur.photos=[];cur.photos.unshift(e.target.result);refreshPhotos();save();};r.readAsDataURL(f);}
function refreshPhotos(){const g=document.getElementById('photoGallery');if(!cur||!cur.photos){if(g) g.innerHTML='';return;}g.innerHTML=cur.photos.map((d,i)=>`<div style="position:relative;"><img src="${d}" style="width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--card-border);"><button onclick="delPhoto(${i})" style="position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:#ef4444;color:#fff;border:none;font-size:9px">✕</button></div>`).join('');}
function delPhoto(i){cur.photos.splice(i,1);refreshPhotos();save();}
function toggleRem(){const en=document.getElementById('remEnabled').checked;document.getElementById('remBox').style.display=en?'block':'none'; if(en) updateNextPreview();}
function updateRepeatUI(){const v=document.getElementById('remRepeat').value;document.getElementById('customRepeatBox').style.display=(v.startsWith('custom')||v=='weekdays')?'block':'none';document.getElementById('customDaysUI').style.display=v=='custom_days'?'block':'none';document.getElementById('customHoursUI').style.display=v=='custom_hours'?'block':'none';document.getElementById('weekdaysUI').style.display=v=='weekdays'?'block':'none';updateNextPreview();}
function updateEndUI(){const v=document.getElementById('remEndType').value;document.getElementById('remAfterCount').style.display=v=='after'?'block':'none';document.getElementById('remEndDate').style.display=v=='onDate'?'block':'none';updateNextPreview();}
function getProReminder(){return{enabled:document.getElementById('remEnabled').checked,date:document.getElementById('remDate').value,time:document.getElementById('remTime').value,repeat:document.getElementById('remRepeat').value,everyDays:parseInt(document.getElementById('remEveryDays')?.value||2),everyHours:parseInt(document.getElementById('remEveryHours')?.value||3),weekdays:Array.from(document.querySelectorAll('.wd:checked')).map(x=>parseInt(x.value)),endType:document.getElementById('remEndType').value,afterCount:parseInt(document.getElementById('remAfterCount')?.value||0),endDate:document.getElementById('remEndDate')?.value||null,countDone:cur?.reminder?.countDone||0}}
function getNextReminderTimePro(rem){if(!rem||!rem.enabled||!rem.date||!rem.time) return null;let dt=new Date(rem.date+'T'+rem.time);const now=new Date();if(rem.repeat==='none') return dt>now?dt:null; let loop=0; while(dt<=now && loop<1000){loop++; if(rem.repeat==='daily') dt.setDate(dt.getDate()+1); else if(rem.repeat==='weekly') dt.setDate(dt.getDate()+7); else if(rem.repeat==='monthly') dt.setMonth(dt.getMonth()+1); else if(rem.repeat==='yearly') dt.setFullYear(dt.getFullYear()+1); else if(rem.repeat==='custom_days') dt.setDate(dt.getDate()+rem.everyDays); else if(rem.repeat==='custom_hours') dt.setHours(dt.getHours()+rem.everyHours); else if(rem.repeat==='weekdays'){do{dt.setDate(dt.getDate()+1);}while(!rem.weekdays.includes(dt.getDay()));} else break; if(rem.endType==='onDate' && rem.endDate && dt>new Date(rem.endDate)) return null; if(rem.endType==='after' && rem.countDone>=rem.afterCount) return null;} return dt;}
function updateNextPreview(){const r=getProReminder();const next=getNextReminderTimePro(r);document.getElementById('remNext').innerText=next?`القادم: ${next.toLocaleString('ar-EG')}`:'حدد الوقت';}
async function saveReminderPro(){if(!cur) return; const rem=getProReminder(); if(!rem.date||!rem.time){alert('حدد التاريخ والوقت');return;} if(Notification && Notification.permission!=='granted'){const p=await Notification.requestPermission();} if('serviceWorker' in navigator){try{await navigator.serviceWorker.register('sw.js');}catch(e){}} cur.reminder=rem; save(); startReminderChecker(); alert(`✅ تم حفظ المنبه\nالقادم: ${getNextReminderTimePro(rem).toLocaleString('ar-EG')}`);}
function startReminderChecker(){if(window._remInterval) clearInterval(window._remInterval); window._remInterval=setInterval(()=>{const now=new Date(); tasks.forEach(t=>{if(!t.reminder||!t.reminder.enabled) return; const next=getNextReminderTimePro(t.reminder); if(!next) return; const diff=(next-now)/1000/60; if(diff>=0&&diff<1){showProNotification(t); if(t.reminder.endType==='after'){t.reminder.countDone=(t.reminder.countDone||0)+1;} save();}});},60000);}
function showProNotification(task){const title=task.text; const body=`${task.cat}`; if(Notification && Notification.permission==='granted'){const n=new Notification(title,{body,requireInteraction:true}); n.onclick=()=>{window.focus(); openCard(task.id);};} const audio=new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg'); audio.play().catch(()=>{});}
function openCard(id){cur=tasks.find(x=>x.id===id);if(!cur) return; if(!cur.photos)cur.photos=[];document.getElementById('modalTitle').innerText=cur.text;document.getElementById('modalCover').style.background=cur.color;document.getElementById('currentColorPreview').style.background=cur.color;document.getElementById('noteEditor').innerHTML=cur.note||'';currentNoteColor='#111111';currentFontSize=12;currentHiddenFontSize=12;lastNoteRange=null;lastHiddenRange=null;document.getElementById('doneBtn').innerText=cur.done?'إعادة فتح':'تم ✓';document.getElementById('allColorsBox').style.display='none';if(cur.reminder){document.getElementById('remEnabled').checked=cur.reminder.enabled;document.getElementById('remDate').value=cur.reminder.date||'';document.getElementById('remTime').value=cur.reminder.time||'';document.getElementById('remRepeat').value=cur.reminder.repeat||'none';document.getElementById('remEndType').value=cur.reminder.endType||'never';if(cur.reminder.everyDays) document.getElementById('remEveryDays').value=cur.reminder.everyDays;if(cur.reminder.everyHours) document.getElementById('remEveryHours').value=cur.reminder.everyHours;toggleRem();updateRepeatUI();updateEndUI();}else{document.getElementById('remEnabled').checked=false;toggleRem();}refreshSubtasks();refreshDrawGallery();refreshVoiceList();refreshPhotos();renderExcelTheme();document.getElementById('modal').style.display='flex';tab('note');setTimeout(()=>{resizeCanvas();setupNoteListeners();},100);}
function closeModal(){document.getElementById('modal').style.display='none';closeCamera();if(cur){cur.text=document.getElementById('modalTitle').innerText.trim()||cur.text;cur.note=document.getElementById('noteEditor').innerHTML;save();}}
function tab(t){['Colors','Camera','Draw','Voice','Note','Rem','Hidden'].forEach(k=>{const p=document.getElementById('p'+k);const b=document.getElementById('t'+k);if(p){p.style.display=(k.toLowerCase()===t.toLowerCase()?(k.toLowerCase()==='note'?'flex':'block'):'none');}if(b&&k!=='Hidden')b.classList.toggle('active',k.toLowerCase()===t.toLowerCase());});if(t==='note'||t==='hidden')setTimeout(setupNoteListeners,50);}
function setupNoteListeners(){const ed=document.getElementById('noteEditor');const hd=document.getElementById('hiddenBody');if(ed){ed.addEventListener('keyup',()=>{const sel=window.getSelection(); if(sel.rangeCount) lastNoteRange=sel.getRangeAt(0).cloneRange();});ed.addEventListener('mouseup',()=>{const sel=window.getSelection(); if(sel.rangeCount) lastNoteRange=sel.getRangeAt(0).cloneRange();});}if(hd){hd.addEventListener('keyup',()=>{const sel=window.getSelection(); if(sel.rangeCount) lastHiddenRange=sel.getRangeAt(0).cloneRange();});hd.addEventListener('mouseup',()=>{const sel=window.getSelection(); if(sel.rangeCount) lastHiddenRange=sel.getRangeAt(0).cloneRange();});}}
function restoreNoteRange(){const ed=document.getElementById('noteEditor');ed.focus();if(lastNoteRange){const sel=window.getSelection();sel.removeAllRanges();sel.addRange(lastNoteRange);}}
function restoreHiddenRange(){const ed=document.getElementById('hiddenBody');ed.focus();if(lastHiddenRange){const sel=window.getSelection();sel.removeAllRanges();sel.addRange(lastHiddenRange);}}
function applyNoteColor(color){currentNoteColor=color;restoreNoteRange();document.execCommand('styleWithCSS',false,true);document.execCommand('foreColor',false,color);const sel=window.getSelection(); if(sel.rangeCount) lastNoteRange=sel.getRangeAt(0).cloneRange();}
function changeFontSize(d){currentFontSize=Math.max(8,Math.min(28,currentFontSize+d));restoreNoteRange();document.execCommand('styleWithCSS',false,true);document.execCommand('fontSize',false,5);const ed=document.getElementById('noteEditor');ed.querySelectorAll('font[size="5"]').forEach(f=>{f.removeAttribute('size');f.style.fontSize=currentFontSize+'px';f.style.color=currentNoteColor;});const sel=window.getSelection(); if(sel.rangeCount) lastNoteRange=sel.getRangeAt(0).cloneRange();}
function formatNote(cmd){restoreNoteRange();document.execCommand(cmd,false,null);const ed=document.getElementById('noteEditor');ed.querySelectorAll('ul,ol').forEach(l=>{l.style.direction='rtl';l.style.textAlign='right';l.style.listStylePosition='inside';l.style.paddingRight='20px';});const sel=window.getSelection(); if(sel.rangeCount) lastNoteRange=sel.getRangeAt(0).cloneRange();}
function applyHiddenColor(color){currentHiddenColor=color;restoreHiddenRange();document.execCommand('styleWithCSS',false,true);document.execCommand('foreColor',false,color);const sel=window.getSelection(); if(sel.rangeCount) lastHiddenRange=sel.getRangeAt(0).cloneRange();}
function changeHiddenFontSize(d){currentHiddenFontSize=Math.max(8,Math.min(28,currentHiddenFontSize+d));restoreHiddenRange();document.execCommand('styleWithCSS',false,true);document.execCommand('fontSize',false,5);const ed=document.getElementById('hiddenBody');ed.querySelectorAll('font[size="5"]').forEach(f=>{f.removeAttribute('size');f.style.fontSize=currentHiddenFontSize+'px';f.style.color=currentHiddenColor;});const sel=window.getSelection(); if(sel.rangeCount) lastHiddenRange=sel.getRangeAt(0).cloneRange();}
function formatHidden(cmd){restoreHiddenRange();document.execCommand(cmd,false,null);const ed=document.getElementById('hiddenBody');ed.querySelectorAll('ul,ol').forEach(l=>{l.style.direction='rtl';l.style.textAlign='right';l.style.listStylePosition='inside';l.style.paddingRight='20px';});const sel=window.getSelection(); if(sel.rangeCount) lastHiddenRange=sel.getRangeAt(0).cloneRange();}
function refreshSubtasks(){if(!cur) return;const total=cur.subtasks.length,done=cur.subtasks.filter(s=>s.done).length,perc=total?Math.round(done/total*100):0;document.getElementById('subProgress').innerText=`${fmt(done)}/${fmt(total)}`;document.getElementById('subBar').style.width=perc+'%';document.getElementById('subList').innerHTML=cur.subtasks.map(s=>`<div style="display:flex;gap:7px;align-items:center;background:var(--bg-soft);padding:6px 8px;border-radius:8px;border:1px solid var(--card-border)"><input type="checkbox" ${s.done?'checked':''} onchange="toggleSub(${s.id})"><div contenteditable="true" onblur="editSub(${s.id},this.innerText)" style="flex:1;font-size:10.3px">${formatTextNumbers(s.text)}</div><button onclick="delSub(${s.id})" style="border:none;background:var(--card);width:23px;height:23px;border-radius:5px;color:#ef4444">✕</button></div>`).join('')||`<div style="text-align:center;""color:var(--text-soft);font-size:10.3px;padding:7px;">مفيش مهام فرعية</div>`;}
function addSub(){const inp=document.getElementById('subInput');if(!inp.value.trim())return;cur.subtasks.push({id:Date.now(),text:inp.value.trim(),done:false});inp.value='';refreshSubtasks();save();}
function toggleSub(sid){const s=cur.subtasks.find(x=>x.id===sid);s.done=!s.done;refreshSubtasks();save();}
function delSub(sid){cur.subtasks=cur.subtasks.filter(x=>x.id!==sid);refreshSubtasks();save();}
function editSub(sid,txt){const s=cur.subtasks.find(x=>x.id===sid);if(s){s.text=txt.trim()||s.text;save();}}
function resizeCanvas(){if(!canvas) return;const r=canvas.getBoundingClientRect();canvas.width=r.width*2;canvas.height=184*2;ctx.setTransform(1,0,0,1,0,0);ctx.scale(2,2);ctx.lineCap='round';ctx.lineJoin='round';}
function pos(e){const rect=canvas.getBoundingClientRect();const pt=e.touches?e.touches[0]:e;return{x:pt.clientX-rect.left,y:pt.clientY-rect.top};}
if(canvas){canvas.addEventListener('mousedown',e=>{drawing=true;const p=pos(e);lx=p.x;ly=p.y;});canvas.addEventListener('mousemove',e=>{if(!drawing)return;const p=pos(e);ctx.strokeStyle=document.getElementById('penColor').value;ctx.lineWidth=document.getElementById('penSize').value;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;});window.addEventListener('mouseup',()=>drawing=false);canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const p=pos(e);lx=p.x;ly=p.y;},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=pos(e);ctx.strokeStyle=document.getElementById('penColor').value;ctx.lineWidth=document.getElementById('penSize').value;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;},{passive:false});canvas.addEventListener('touchend',()=>drawing=false);}
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);}function saveDraw(){const d=canvas.toDataURL();cur.drawings.unshift(d);clearCanvas();refreshDrawGallery();save();}function refreshDrawGallery(){if(!cur) return;document.getElementById('drawGallery').innerHTML=cur.drawings.map((d,i)=>`<div style="position:relative;"><img src="${d}" style="width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--card-border);"><button onclick="delDraw(${i})" style="position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:#ef4444;color:#fff;border:none;font-size:9px">✕</button></div>`).join('');}function delDraw(i){cur.drawings.splice(i,1);refreshDrawGallery();save();}
async function toggleRec(){const btn=document.getElementById('recBtn');if(!rec||rec.state==='inactive'){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{const blob=new Blob(chunks,{type:'audio/webm'});const r=new FileReader();r.onloadend=()=>{cur.voices.unshift(r.result);refreshVoiceList();save();};r.readAsDataURL(blob);};rec.start();btn.style.background='var(--hero)';btn.innerHTML='■';sec=0;timerInt=setInterval(()=>{sec++;document.getElementById('timer').innerText=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');},1000);}catch{alert('فعل الميكروفون');}}else{rec.stop();stream.getTracks().forEach(t=>t.stop());clearInterval(timerInt);btn.style.background='#ef4444';btn.innerHTML='●';document.getElementById('timer').innerText='00:00';}}
function refreshVoiceList(){if(!cur) return;document.getElementById('voiceList').innerHTML=cur.voices.map((v,i)=>`<div style="display:flex;gap:7px;align-items:center;background:var(--card);border:1px solid var(--card-border);padding:7px;border-radius:9px;"><audio src="${v}" controls style="flex:1;height:32px;"></audio><button onclick="delVoice(${i})" style="background:#FEE2E2;border:none;width:32px;height:32px;border-radius:8px;color:#ef4444">✕</button></div>`).join('');}function delVoice(i){cur.voices.splice(i,1);refreshVoiceList();save();}function saveNote(){if(!cur) return;cur.note=document.getElementById('noteEditor').innerHTML;save();alert('تم الحفظ ✅');}
function toggleDone(){cur.done=!cur.done;save();document.getElementById('doneBtn').innerText=cur.done?'إعادة فتح':'تم ✓';}
function deleteCurrent(){if(!cur)return;document.getElementById('delTaskPreview').innerHTML=`<div style="font-weight:800;color:var(--text);font-size:11.5px">${formatTextNumbers(cur.text)}</div><div style="font-size:9.2px;color:var(--text-soft)">${cur.cat}</div>`;document.getElementById('delConfirmCheck').checked=false;toggleDelBtn();document.getElementById('deleteWarningModal').classList.add('show');}
function closeDeleteWarning(){document.getElementById('deleteWarningModal').classList.remove('show')}
function toggleDelBtn(){const c=document.getElementById('delConfirmCheck').checked;const b=document.getElementById('finalDelBtn');b.disabled=!c;b.style.background=c?'#ef4444':'#E5E7EB';b.style.color=c?'#fff':'#9CA3AF';}
function confirmDelete(){if(!cur)return;tasks=tasks.filter(x=>x.id!==cur.id);closeDeleteWarning();closeModal();save();}
render(); startReminderChecker();
function openSecretModal(){document.getElementById('secretCodeModal').classList.add('show');const s=getSecretCode();document.getElementById('secretInput').value=s;document.getElementById('currentCodeHint').innerText=`رقمك الحالي: ${s}`;}
function closeSecretModal(){document.getElementById('secretCodeModal').classList.remove('show')}
function saveSecretCode(){const v=document.getElementById('secretInput').value.trim();if(!v||v.length<2){alert('اكتب رقم');return}localStorage.setItem('__my_secret_num__',btoa(v));closeSecretModal();}
let hKey=null,hNotes=[];const H_CFG='__sys_pref_cache__',H_DATA='__sys_pref_data__';
async function deriveKey(p,s){const e=new TextEncoder();const km=await crypto.subtle.importKey('raw',e.encode(p),{name:'PBKDF2'},false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:120000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function hEnc(d,k){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(d)));return{iv:Array.from(iv),ct:Array.from(new Uint8Array(ct))}}
async function hDec(o,k){try{const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(o.iv)},k,new Uint8Array(o.ct));return JSON.parse(new TextDecoder().decode(dec))}catch{return null}}
function revealHiddenTab(){const btn=document.getElementById('tHidden');btn.style.display='block';btn.animate([{transform:'scale(0)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:300});if(document.getElementById('modal').style.display==='none'){if(tasks[0])openCard(tasks[0].id);else{tasks.unshift({id:Date.now(),text:'مهمة',cat:cats[0].name,color:'#fff',done:false,drawings:[],photos:[],voices:[],note:'',subtasks:[],reminder:null});save();openCard(tasks[0].id)}}setTimeout(()=>tab('hidden'),350);}
function hideHiddenTab(){lockHidden();document.getElementById('tHidden').style.display='none';tab('note');}
function lockHidden(){hKey=null;const auth=document.getElementById('hiddenAuth');const content=document.getElementById('hiddenContent');if(auth) auth.style.display='block';if(content) content.style.display='none';const pass=document.getElementById('hPass');if(pass) pass.value='';const err=document.getElementById('hErr');if(err) err.style.display='none';}
async function unlockHidden(){const pass=document.getElementById('hPass').value.trim();if(pass.length<2){document.getElementById('hErr').style.display='block';document.getElementById('hErr').innerText='قصير';return}const cfg=JSON.parse(localStorage.getItem(H_CFG)||'null');try{if(!cfg){const salt=crypto.getRandomValues(new Uint8Array(16));const key=await deriveKey(pass,salt);const enc=await hEnc([],key);localStorage.setItem(H_CFG,JSON.stringify({salt:Array.from(salt)}));localStorage.setItem(H_DATA,JSON.stringify(enc));hKey=key;hNotes=[];}else{const key=await deriveKey(pass,new Uint8Array(cfg.salt));const dataObj=JSON.parse(localStorage.getItem(H_DATA)||'null');let dec=null;if(dataObj)dec=await hDec(dataObj,key);if(dataObj&&dec===null)throw new Error('wrong');hKey=key;hNotes=dec||[];}document.getElementById('hiddenAuth').style.display='none';document.getElementById('hiddenContent').style.display='block';renderHidden();}catch(e){const er=document.getElementById('hErr');er.style.display='block';er.innerText='رقم غلط!';}}
async function saveHiddenData(){if(!hKey)return;const enc=await hEnc(hNotes,hKey);localStorage.setItem(H_DATA,JSON.stringify(enc))}
function renderHidden(){const q=(document.getElementById('hSearch').value||'').toLowerCase();const list=document.getElementById('hList');const f=hNotes.filter(n=>!q||n.title.toLowerCase().includes(q)||n.body.toLowerCase().includes(q)).sort((a,b)=>b.id-a.id);if(!f.length){list.innerHTML=`<div style="text-align:center;padding:16px;color:var(--text-soft);font-size:10.3px">مفيش نوتس</div>`;return}list.innerHTML=f.map(n=>`<div class="hidden-note"><div style="display:flex;justify-content:space-between"><b style="font-size:11.5px">${n.title.replace(/</g,'&lt;')}</b><div style="display:flex;gap:5px"><button onclick="editHidden(${n.id})" style="background:var(--bg-soft);border:1px solid var(--card-border);color:var(--text);width:23px;height:23px;border-radius:6px;font-size:11.5px">✏️</button><button onclick="delHidden(${n.id})" style="background:#3a1515;border:none;color:#ff6b6b;width:23px;height:23px;border-radius:6px;font-size:11.5px">✕</button></div></div><div style="font-size:10.3px;color:#ccc;margin-top:5px;">${n.body}</div></div>`).join('');}
let editingHiddenId=null;
function openHiddenEditor(){editingHiddenId=null;document.getElementById('hiddenTitle').value='';document.getElementById('hiddenBody').innerHTML='';currentHiddenColor='#ffffff';document.getElementById('hiddenEditorBox').style.display='block';setTimeout(()=>{setupNoteListeners();},50);}
function closeHiddenEditor(){document.getElementById('hiddenEditorBox').style.display='none';}
function saveHiddenRich(){const title=document.getElementById('hiddenTitle').value.trim()||'بدون عنوان';const body=document.getElementById('hiddenBody').innerHTML.trim();if(!body)return;if(editingHiddenId){const n=hNotes.find(x=>x.id===editingHiddenId);if(n){n.title=title;n.body=body;}}else{hNotes.unshift({id:Date.now(),title,body});}saveHiddenData();renderHidden();closeHiddenEditor();editingHiddenId=null;}
function editHidden(id){const n=hNotes.find(x=>x.id===id);if(!n)return;editingHiddenId=id;document.getElementById('hiddenTitle').value=n.title;document.getElementById('hiddenBody').innerHTML=n.body;document.getElementById('hiddenEditorBox').style.display='block';setTimeout(()=>{setupNoteListeners();},50);}
function delHidden(id){if(!confirm('تحذف؟'))return;hNotes=hNotes.filter(x=>x.id!==id);saveHiddenData();renderHidden()}
async function openChangePassword(){const newPass=prompt('الرقم الجديد:');if(!newPass||newPass.length<2){alert('قصير');return;}const confirmPass=prompt('أكد الرقم:');if(newPass!==confirmPass){alert('مش زي بعض');return;}try{const salt=crypto.getRandomValues(new Uint8Array(16));const newKey=await deriveKey(newPass,salt);const enc=await hEnc(hNotes,newKey);localStorage.setItem(H_CFG,JSON.stringify({salt:Array.from(salt)}));localStorage.setItem(H_DATA,JSON.stringify(enc));localStorage.setItem('__my_secret_num__',btoa(newPass));hKey=newKey;alert(`تم تغيير الرقم لـ ${newPass}`);}catch(err){alert('فشل');}}
let pressTimer=null;const vaultEl=document.getElementById('vaultTrigger');vaultEl.addEventListener('mousedown',()=>{pressTimer=setTimeout(openSecretModal,2500)});vaultEl.addEventListener('mouseup',()=>clearTimeout(pressTimer));vaultEl.addEventListener('mouseleave',()=>clearTimeout(pressTimer));vaultEl.addEventListener('touchstart',()=>{pressTimer=setTimeout(openSecretModal,2500)},{passive:true});vaultEl.addEventListener('touchend',()=>clearTimeout(pressTimer));
</script>
