<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الرئيسية - Omar-Pop</title>
<script src="themes.js?v=13"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
html,body{background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;min-height:100dvh}
body{padding:8px;padding-bottom:80px;border-left:1px solid var(--card-border);border-right:1px solid var(--card-border)}
.card{background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.card.green{background:#16a34a;color:#fff;border-color:#16a34a}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.top h2{font-size:14px;font-weight:900}
.badge{background:var(--bg-soft);border:1px solid var(--card-border);padding:3px 8px;border-radius:20px;font-size:8px;font-weight:900}
.att-card{background:#16a34a;color:#fff;border-radius:16px;padding:12px;position:relative;overflow:hidden}
.att-card .off{position:absolute;top:8px;left:10px;background:rgba(0,0,0,.2);padding:2px 6px;border-radius:20px;font-size:7px;font-weight:900}
.att-card h3{font-size:11px;opacity:.9}
.att-card .status{font-size:16px;font-weight:900;margin:6px 0}
.att-btns{display:flex;gap:8px;align-items:center;margin-top:8px}
.btn-att{flex:1;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);color:#fff;padding:10px;border-radius:12px;font-weight:900;font-size:11px;cursor:pointer;backdrop-filter:blur(4px)}
.btn-att.primary{background:#fff;color:#16a34a;border-color:#fff}
.btn-att:disabled{opacity:.5}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.kpi{background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;padding:8px;text-align:center}
.kpi small{font-size:7px;color:var(--text-soft);font-weight:800;display:block}
.kpi b{font-size:12px;font-weight:900;display:block;margin-top:2px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:var(--card);border-top:1.5px solid var(--card-border);display:flex;justify-content:space-around;padding:6px 0;z-index:50}
.bottom-nav button{flex:1;border:none;background:transparent;padding:6px;font-size:8px;font-weight:800;color:var(--text-soft);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.bottom-nav button.active{color:var(--hero)}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.q{background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;padding:10px 4px;text-align:center;font-size:8px;font-weight:800;cursor:pointer}
</style>
<script src="drive-sync.js?v=9"></script>
</head><body>

<div class="top">
  <div style="display:flex;align-items:center;gap:6px"><div style="width:28px;height:28px;background:var(--hero);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900">ع</div><div><div style="font-size:11px;font-weight:900">أهلاً يا عمر 🎉</div><div style="font-size:7px;color:var(--text-soft)">٢٠٢٦/٠٨/٢٠</div></div></div>
  <div class="badge">green ● التيم</div>
</div>

<!-- كارت الحضور الأخضر اللي في الصورة -->
<div class="att-card" id="attCard">
  <span class="off" id="offLabel">OFF</span>
  <h3>وردية اليوم - الحضور</h3>
  <div class="status" id="attStatus">لم يبدأ بعد</div>
  <div class="att-btns">
    <button class="btn-att" id="btnOut" onclick="doAttendance('out')">انصراف ✓</button>
    <button class="btn-att primary" id="btnIn" onclick="doAttendance('in')">حضور ⏱</button>
  </div>
</div>

<div class="kpi-grid">
  <div class="kpi"><small>الرصيد الكلي 💰</small><b id="kpi-balance">51,000-</b></div>
  <div class="kpi"><small>دخل اليوم 📥</small><b id="kpi-income">10,000</b></div>
  <div class="kpi"><small>المصروف اليومي 💸</small><b>1,000</b></div>
  <div class="kpi"><small>الديون 💳</small><b>0</b></div>
  <div class="kpi"><small>المهام ✅</small><b>2 مهمة</b></div>
  <div class="kpi"><small>الحضور 📅</small><b id="kpi-days">0 يوم</b></div>
</div>

<div class="card"><div style="font-size:10px;font-weight:900;margin-bottom:6px">دخول سريع</div><div class="quick-grid">
  <div class="q" onclick="location.href='daily.html'">📝<br>اليومية</div>
  <div class="q" onclick="location.href='attendance.html'">⏱<br>الحضور والانصراف</div>
  <div class="q" onclick="location.href='tasks.html'">✅<br>المهام</div>
  <div class="q">⭐<br>المهم</div>
</div></div>

<div class="bottom-nav">
  <button onclick="location.href='home.html'" class="active">🏠<br>الرئيسية</button>
  <button onclick="location.href='daily.html'">📊<br>اليومية</button>
  <button onclick="location.href='attendance.html'">⏱<br>الحضور</button>
  <button onclick="location.href='tasks.html'">✅<br>المهام</button>
</div>

<script>
// === نفس مفاتيح الحضور بالحرف ===
function getTodayKey(){
  const n=new Date();
  return `${n.getFullYear()}-${n.getMonth()+1}-${n.getDate()}`;
}
function nowTimeStr(){
  const n=new Date();
  return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
}
function loadAttData(){
  return JSON.parse(localStorage.getItem('att_fixed_final')||'{}');
}
function saveAttData(d){
  localStorage.setItem('att_fixed_final', JSON.stringify(d));
  try{ if(window.syncToABOmar) syncToABOmar(); }catch(e){}
  try{ window.dispatchEvent(new Event('omar_data_updated')); }catch(e){}
}

function updateAttendanceUI(){
  const data=loadAttData();
  const key=getTodayKey();
  const rec=data[key]||{in:'',out:''};
  const statusEl=document.getElementById('attStatus');
  const offEl=document.getElementById('offLabel');
  const btnIn=document.getElementById('btnIn');
  const btnOut=document.getElementById('btnOut');
  const card=document.getElementById('attCard');
  const kpiDays=document.getElementById('kpi-days');
  
  // حساب أيام الحضور هذا الشهر
  const cur = new Date();
  let count=0;
  Object.keys(data).forEach(k=>{
    const [y,m]=k.split('-').map(Number);
    if(y===cur.getFullYear() && m===cur.getMonth()+1 && data[k].in) count++;
  });
  if(kpiDays) kpiDays.textContent=count+' يوم';

  if(!rec.in && !rec.out){
    statusEl.textContent='لم يبدأ بعد';
    offEl.textContent='OFF';
    offEl.style.background='rgba(0,0,0,.2)';
    btnIn.disabled=false; btnOut.disabled=true;
    btnIn.style.opacity='1'; btnOut.style.opacity='.5';
    card.style.background='#16a34a';
  } else if(rec.in && !rec.out){
    statusEl.textContent='يعمل الآن - بدأ '+rec.in;
    offEl.textContent='ON';
    offEl.style.background='rgba(255,255,255,.3)';
    btnIn.disabled=true; btnOut.disabled=false;
    btnIn.style.opacity='.5'; btnOut.style.opacity='1';
    card.style.background='#16a34a';
  } else if(rec.in && rec.out){
    statusEl.textContent='انتهى اليوم '+rec.in+' - '+rec.out;
    offEl.textContent='DONE';
    offEl.style.background='rgba(255,255,255,.3)';
    btnIn.disabled=true; btnOut.disabled=true;
    btnIn.style.opacity='.5'; btnOut.style.opacity='.5';
    card.style.background='#15803d';
  }
}

function doAttendance(type){
  const data=loadAttData();
  const key=getTodayKey();
  if(!data[key]) data[key]={in:'',out:''};
  const t=nowTimeStr();
  
  if(type==='in'){
    if(data[key].in){ alert('سجلت حضور اليوم بالفعل: '+data[key].in); return; }
    data[key].in=t;
  } else {
    if(!data[key].in){ alert('لازم تسجل حضور الأول'); return; }
    if(data[key].out){ alert('سجلت انصراف بالفعل: '+data[key].out); return; }
    data[key].out=t;
  }
  
  saveAttData(data);
  updateAttendanceUI();
  
  // ابعت لصفحة الحضور لو مفتوحة في iframe أو تاب تاني
  try{
    const frames=document.querySelectorAll('iframe');
    frames.forEach(f=>{ try{ f.contentWindow.postMessage({type: type==='in'?'attendance-in':'attendance-out'}, '*'); }catch(e){} });
  }catch(e){}
  
  // لو attendance.html مفتوح في نفس المتصفح هيتحدث لما يفتحه لأنه بيقرا نفس localStorage
  alert(type==='in' ? '✅ تم تسجيل الحضور: '+t : '✅ تم تسجيل الانصراف: '+t);
}

// أول ما تفتح الصفحة حدث الحالة
updateAttendanceUI();
setInterval(updateAttendanceUI, 30000); // حدث كل 30 ثانية

// اسمع لو صفحة الحضور بعتت تحديث
window.addEventListener('message', function(e){
  if(e.data && e.data.type==='attendance-done'){
    updateAttendanceUI();
  }
});
</script>
</body></html>
