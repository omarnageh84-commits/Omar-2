<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="themes.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:16px;transition:.3s}
.top{padding:14px 14px 8px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:15px;font-weight:800}.top h1 span{color:var(--primary)}
.time{font-size:9px;color:var(--text-soft);background:var(--card);border:1px solid var(--card-border);padding:4px 8px;border-radius:99px}
.avatar{width:34px;height:34px;background:var(--hero);color:#fff;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.theme-wrap{margin:0 12px 10px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center}
.theme-dots{display:flex;gap:7px}
.hero{margin:0 12px 10px;background:var(--hero);color:#fff;border-radius:16px;padding:14px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-20px;left:-20px;width:80px;height:80px;background:var(--primary);opacity:.2;border-radius:50%;filter:blur(20px)}
.hero-top{display:flex;justify-content:space-between;position:relative;z-index:2}
.badge{font-size:7px;background:var(--primary);color:#fff;padding:4px 8px;border-radius:99px;font-weight:800}
.hero-val{font-size:18px;font-weight:800;margin-top:8px;position:relative;z-index:2}
.hero-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;position:relative;z-index:2}
.btn{padding:10px;border-radius:10px;border:none;font-size:10px;font-weight:800;cursor:pointer}.btn-w{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2)}.btn-g{background:var(--primary);color:#fff}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 12px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:10px;transition:.2s}
.card:active{transform:scale(.97)}
.lb{font-size:7px;color:var(--text-soft);font-weight:700}.v{font-size:13px;font-weight:800;margin-top:3px}
.v.sm{font-size:11px}
.quick{margin:0 12px 10px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:10px}
.quick-title{font-size:10px;font-weight:800;margin-bottom:8px}
.quick-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.qb{background:var(--bg-soft);border:1px solid var(--card-border);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;transition:.2s}
.qb:active{transform:scale(.95);background:var(--card)}
.qb span:first-child{font-size:16px;display:block}.qb span:last-child{font-size:7.5px;font-weight:700;margin-top:3px;display:block;color:var(--text-soft)}
.recent{margin:0 12px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--bg-soft)}
.row:first-child{border:none}
</style><script src="drive-sync.js"></script><style>html,body{max-width:430px;margin:0 auto !important;background:var(--bg);} body{border-left:1px solid var(--card-border);border-right:1px solid var(--card-border); min-height:100dvh;}</style></head><body>
<div class="top"><div><h1>أهلاً يا <span>عمر</span> ✨</h1><div id="clk" class="time" style="display:inline-block;margin-top:4px">--:--</div></div><div style="display:flex;gap:8px;align-items:center"><div id="date" style="font-size:8px;color:var(--text-soft)"></div><div class="avatar">ع</div></div></div>

<div class="theme-wrap"><span style="font-size:9px;font-weight:800;color:var(--text-soft)">الثيم</span><div id="themeDots" class="theme-dots"></div></div>

<div class="hero"><div class="hero-top"><span style="font-size:8px;opacity:.7">وردية اليوم • الحضور</span><span class="badge" id="wh">OFF</span></div><div id="att" class="hero-val">لم يبدأ بعد</div><div class="hero-btns"><button class="btn btn-w" onclick="inAtt()">⏱️ حضور</button><button class="btn btn-g" onclick="outAtt()">انصراف ✓</button></div></div>

<div class="grid4">
  <div class="card" onclick="go('daily.html',1)"><div class="lb">💰 الرصيد الكلي</div><div id="cash" class="v">0</div><div style="font-size:7px;color:var(--primary);margin-top:4px">اضغط للتفاصيل →</div></div>
  <div class="card" onclick="go('daily.html',1)"><div class="lb">📈 دخل الشهر</div><div id="mI" class="v" style="color:var(--primary)">0</div><div id="mI2" style="font-size:7px;color:var(--text-soft)">0 عملية</div></div>
  <div class="card" onclick="go('daily.html',1)"><div class="lb">📉 مصروف الشهر</div><div id="mE" class="v">0</div><div id="net" style="font-size:7px;color:var(--text-soft)">الصافي 0</div></div>
  <div class="card" onclick="go('daily.html',2)"><div class="lb">📋 الديون</div><div id="db" class="v">0</div><div id="dbC" style="font-size:7px;color:var(--text-soft)">0 شخص</div></div>
  <div class="card" onclick="go('tasks.html',3)"><div class="lb">✅ المهام</div><div id="tc" class="v sm">0 مهمة</div><div style="height:4px;background:var(--bg-soft);border-radius:99px;margin-top:6px"><div id="tprog" style="height:100%;width:0%;background:var(--primary);border-radius:99px"></div></div></div>
  <div class="card" onclick="go('important.html',4)"><div class="lb">⭐ المهم</div><div id="impC" class="v sm">0</div><div style="font-size:7px;color:var(--text-soft)">عناصر محفوظة</div></div>
</div>

<div class="quick"><div class="quick-title">دخول سريع</div><div class="quick-grid">
  <div class="qb" onclick="go('daily.html',1)"><span>💸</span><span>مصروف</span></div>
  <div class="qb" onclick="go('daily.html',1)"><span>💵</span><span>دخل</span></div>
  <div class="qb" onclick="go('tasks.html',3)"><span>✓</span><span>مهمة</span></div>
  <div class="qb" onclick="go('important.html',4)"><span>⭐</span><span>مهم</span></div>
</div></div>

<div class="recent"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:11px">آخر الحركات</b><span style="font-size:8px;background:var(--bg-soft);border:1px solid var(--card-border);padding:4px 8px;border-radius:99px;cursor:pointer" onclick="go('daily.html',1)">عرض الكل →</span></div><div id="recent" style="margin-top:6px"></div></div>

<script>
let $=id=>document.getElementById(id),fmt=n=>Math.round(n||0).toLocaleString('en-US');
const GD=()=>({tr:JSON.parse(localStorage.getItem('omar_tx_v3')||'[]'),db:JSON.parse(localStorage.getItem('debts_pro_v2')||'[]'),ta:JSON.parse(localStorage.getItem('tasks_v6')||'[]'),lg:JSON.parse(localStorage.getItem('attendance_log')||'[]'),imp:JSON.parse(localStorage.getItem('omar_important')||'[]')});
function go(page, idx){ try{ parent.switchPage(page, parent.document.querySelectorAll('.nav button')[idx]); }catch(e){ location.href=page; } }
function R(){
  let {tr,db,ta,imp}=GD();
  $('cash').innerText=fmt(tr.reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0));
  let y=new Date().getFullYear(),m=new Date().getMonth()+1;
  let mTr=tr.filter(t=>{try{let d=new Date(t.date);return d.getMonth()+1===m&&d.getFullYear()===y}catch{return false}});
  let mInc=mTr.filter(t=>t.type==='income'); let mExp=mTr.filter(t=>t.type==='expense');
  $('mI').innerText=fmt(mInc.reduce((a,b)=>a+(b.amount||0),0)); $('mI2').innerText=mInc.length+' عملية';
  $('mE').innerText=fmt(mExp.reduce((a,b)=>a+(b.amount||0),0));
  let incVal=mInc.reduce((a,b)=>a+(b.amount||0),0), expVal=mExp.reduce((a,b)=>a+(b.amount||0),0);
  $('net').innerText='الصافي '+fmt(incVal-expVal);
  $('db').innerText=fmt(db.reduce((a,b)=>a+(b.remaining||0),0)); $('dbC').innerText=db.length+' شخص';
  $('tc').innerText=ta.length+' مهمة'; $('tprog').style.width=(ta.length?ta.filter(t=>t.done).length/ta.length*100:0)+'%';
  $('impC').innerText=imp.length+' عنصر';
  $('recent').innerHTML=tr.slice(0,5).map(t=>`<div class="row"><div><b style="font-size:10px">${t.item||t.person||'حركة'}</b><div style="font-size:7px;color:var(--text-soft)">${t.date} • ${t.wallet||''}</div></div><b style="font-size:11px;color:${t.type==='income'?'var(--primary)':'var(--text)'}">${t.type==='income'?'+':''}${fmt(t.amount)}</b></div>`).join('')||'<div style="text-align:center;color:var(--text-soft);font-size:9px;padding:12px">لا يوجد حركات بعد</div>';
  let log=GD().lg,rec=log.find(r=>r.date===new Date().toISOString().split('T')[0]); if(rec){$('att').innerText=rec.out?rec.in+' → '+rec.out:rec.in+' • يعمل الآن'; $('wh').innerText=rec.out?'DONE':'LIVE';}
}
function inAtt(){
  let now=new Date(); let t=now.toISOString().split('T')[0]; let tm=now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); let hourNum=now.getHours();
  let lg=GD().lg; let r=lg.find(x=>x.date===t); if(!r){r={date:t,in:tm,out:null};lg.push(r)}else r.in=tm;
  localStorage.setItem('attendance_log',JSON.stringify(lg));
  let key=`${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`; let data=JSON.parse(localStorage.getItem('att_fixed_final')||'{}'); if(!data[key]) data[key]={in:'',out:''}; data[key].in=String(hourNum);
  localStorage.setItem('att_fixed_final',JSON.stringify(data));
  try{ if(window.syncToABOmar) syncToABOmar(); if(window.parent && window.parent.syncToABOmar) window.parent.syncToABOmar(); }catch(e){}
  R();
}
function outAtt(){
  let now=new Date(); let t=now.toISOString().split('T')[0]; let tm=now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); let hourNum=now.getHours();
  let lg=GD().lg;let r=lg.find(x=>x.date===t); if(!r)return; r.out=tm; localStorage.setItem('attendance_log',JSON.stringify(lg));
  let key=`${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`; let data=JSON.parse(localStorage.getItem('att_fixed_final')||'{}'); if(!data[key]) data[key]={in:'',out:''}; data[key].out=String(hourNum);
  localStorage.setItem('att_fixed_final',JSON.stringify(data));
  try{ if(window.syncToABOmar) syncToABOmar(); if(window.parent && window.parent.syncToABOmar) window.parent.syncToABOmar(); }catch(e){}
  R();
}
setInterval(()=>{let now=new Date();$('clk').innerText=now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});$('date').innerText=now.toLocaleDateString('ar-EG',{weekday:'short',day:'numeric',month:'short'});},1000);
R(); setInterval(R,2000);
window.addEventListener('message',e=>{ if(e.data?.type==='omar_data_updated' || e.data?.type==='theme') R(); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) R(); });
window.addEventListener('storage',()=>{ R(); });
</script>
</body></html>
