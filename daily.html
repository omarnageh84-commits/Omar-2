<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");

}

<style>
@font-face { font-family: "Optimistic"; font-style: normal; font-weight: 400 600; font-display: swap; src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2"); }
@font-face { font-family: "Optimistic Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2"); }

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>اليومية - Pro</title>
<script src="themes.js?v=11"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
html,body{overflow-x:hidden;max-width:100vw;background:var(--bg);color:var(--text);transition:.25s}
body{padding-bottom:96px}
.app{max-width:780px;margin:0 auto;padding:8px}
/* نفس توب باقي المشروع */
.top{position:sticky;top:0;z-index:20;background:var(--card);border:1.5px solid var(--card-border);border-radius:13px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.main-tabs{display:flex;gap:4px;background:var(--card);padding:5px;border-radius:12px;border:1.5px solid var(--card-border);margin:8px 0;overflow:auto;scrollbar-width:none}
.mtab{flex:1;white-space:nowrap;border:none;padding:9px 5px;border-radius:9px;font-weight:900;font-size:11px;cursor:pointer;background:transparent;color:var(--text-soft);min-width:60px;transition:.2s}
.mtab.active{background:var(--hero);color:#fff;box-shadow:0 4px 10px color-mix(in srgb, var(--hero) 30%, transparent)}

/* شريط الشهر زي الحضور بالظبط بس احترافي اكتر */
.month-bar{background:var(--card);border:1.5px solid var(--card-border);border-radius:13px;padding:7px 8px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px}
.month-bar .nav{display:flex;gap:6px;align-items:center}
.month-bar button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--card-border);background:var(--bg-soft);color:var(--text);font-weight:900;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.month-bar button:active{transform:scale(.9)}
.month-bar button.primary{background:var(--hero);color:#fff;border-color:var(--hero)}
.month-center{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.month-center strong{font-size:12.5px;font-weight:900}
.month-center span{font-size:8px;color:var(--text-soft);font-weight:800;background:var(--bg-soft);padding:2px 6px;border-radius:20px;margin-top:2px}

/* 4 خانات في صف واحد - نفس ستايل المشروع */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.kpi{background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;padding:8px 6px;text-align:center;position:relative;overflow:hidden;transition:.2s}
.kpi:hover{transform:translateY(-1px);border-color:var(--hero)}
.kpi .ico{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;margin:0 auto 4px auto;font-size:11px;font-weight:900}
.kpi.in .ico{background:#ecfdf5;color:#16a34a}
.kpi.out .ico{background:#fef2f2;color:#ef4444}
.kpi.bal .ico{background:color-mix(in srgb, var(--hero) 15%, var(--card));color:var(--hero)}
.kpi.debt .ico{background:#fef9c3;color:#ca8a04}
.kpi small{display:block;font-size:6.7px;font-weight:800;color:var(--text-soft);white-space:nowrap;letter-spacing:0}
.kpi b{display:block;font-size:11.5px;font-weight:900;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.in b{color:#16a34a}.kpi.out b{color:#ef4444}

.fbar{background:var(--card);border:1.5px solid var(--card-border);border-radius:11px;padding:7px;margin-bottom:7px;display:flex;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:5px;align-items:center}
.fbar input,.fbar select{flex:0 0 auto;width:87px;min-width:72px;padding:6px 6px;border:1px solid var(--card-border);border-radius:8px;font-weight:700;font-size:8.5px;background:var(--bg-soft);color:var(--text)}
.tsec{background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;overflow:hidden;margin-bottom:8px}
.thead{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;background:var(--bg-soft);border-bottom:1.5px solid var(--card-border)}
.twrap{overflow:auto;max-width:100%}
table{width:100%;border-collapse:collapse;min-width:320px}
th{background:var(--bg-soft);padding:7px 3px;border-bottom:1px solid var(--card-border);font-size:8.5px;color:var(--text-soft);position:sticky;top:0;white-space:nowrap;text-align:center;font-weight:900}
td{padding:7px 3px;border-bottom:1px solid var(--bg-soft);text-align:center;font-weight:800;font-size:9.3px;white-space:nowrap;color:var(--text)}
/* الإجمالي بروفيشنال */
.total-card{background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.total-header{background:var(--card);color:var(--text);padding:10px 12px;border-bottom:1.5px solid var(--card-border);display:flex;justify-content:space-between;align-items:center;font-weight:900;flex-wrap:wrap;gap:6px;font-size:11px;position:relative}
.total-header::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--hero)}
.total-header b{display:flex;align-items:center;gap:6px}
.total-header b i{width:26px;height:26px;border-radius:8px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:12px;font-style:normal}
.total-header .meta{display:flex;gap:5px;align-items:center}
.total-header .chip{background:var(--bg-soft);border:1px solid var(--card-border);padding:3px 8px;border-radius:20px;font-size:9px;font-weight:900;color:var(--text)}
.total-header .chip.hero{background:var(--hero);color:#fff;border-color:var(--hero)}
.add-row-btn{background:var(--hero);color:#fff;border:none;padding:6px 10px;border-radius:8px;font-size:9px;font-weight:900;cursor:pointer;transition:.15s}
.add-row-btn:active{transform:scale(.92)}
.total-body{padding:0}
.total-body .twrap{border:none}
.total-body th{background:var(--bg-soft);font-size:8px;padding:8px 4px}
.total-body td{padding:8px 4px;font-size:9.5px}
.total-body tr:nth-child(even) td{background:color-mix(in srgb, var(--bg-soft) 60%, transparent)}
.total-footer{background:var(--bg-soft);padding:7px 10px;display:flex;justify-content:space-between;align-items:center;font-size:8.5px;font-weight:800;color:var(--text-soft);border-top:1px solid var(--card-border)}
.fab{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:var(--hero);color:#fff;border:none;font-size:28px;z-index:50;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px color-mix(in srgb, var(--hero) 35%, transparent)}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;backdrop-filter:blur(6px);align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.card{background:var(--card);width:100%;margin:0;border-radius:17px 17px 0 0;padding:8px 8px 12px 8px;max-height:78vh;overflow-y:auto}
.card-top-tabs{display:flex;gap:3px;background:var(--bg-soft);padding:4px;border-radius:10px;margin-bottom:7px;overflow-x:auto}
.card-ttab{flex:1;white-space:nowrap;border:none;padding:8px 5px;border-radius:8px;font-weight:900;font-size:9.3px;cursor:pointer;background:transparent;color:var(--text-soft);min-width:50px}
.card-ttab.active{background:var(--hero);color:#fff}
.group{background:var(--bg-soft);border:1px solid var(--card-border);border-radius:9px;padding:6px 8px;margin:4px 0;display:flex;gap:4px;align-items:center}
.group label{font-size:7.5px;font-weight:800;color:var(--text-soft);white-space:nowrap;min-width:28px}
.group input,.group select{flex:1;padding:7px 6px;border:1px solid var(--card-border);border-radius:7px;font-weight:700;font-size:11px;background:var(--card);width:100%;color:var(--text)}
.group input[type="number"]{font-size:15px;font-weight:900;text-align:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%}
.qbtn{flex:0 0 auto;min-width:36px;padding:5px 7px;border:1px solid var(--card-border);border-radius:13px;background:var(--card);font-size:8px;font-weight:800;cursor:pointer;color:var(--text)}
.qbtn.active{background:var(--hero);color:#fff;border-color:var(--hero)}
.custom-dialog{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:200;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(8px)}
.custom-dialog.open{display:flex}
.dialog-box{background:var(--card);border-radius:13px;padding:12px;width:100%;max-width:272px;border:1px solid var(--card-border)}
.dialog-box h4{font-size:11px;font-weight:900;margin-bottom:7px;color:var(--text)}
.dialog-box input{width:100%;padding:8px;border:1px solid var(--card-border);border-radius:8px;font-weight:800;font-size:11px;margin-bottom:5px;background:var(--bg-soft);color:var(--text)}
.dialog-actions{display:flex;gap:5px;margin-top:7px}
.dialog-actions button{flex:1;padding:8px;border:none;border-radius:8px;font-weight:900;font-size:10.2px;cursor:pointer}
.btn-cancel{background:var(--bg-soft);color:var(--text-soft)}
.btn-confirm{background:var(--hero);color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.band-menu{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:150;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.band-menu.open{display:flex}
.band-menu-box{background:var(--card);width:100%;max-width:306px;border-radius:13px 13px 0 0;padding:7px 8px 12px 8px;border-top:1px solid var(--card-border)}
.band-menu-item{width:100%;padding:10px 8px;border:none;background:var(--bg-soft);border-radius:8px;margin:3px 0;font-weight:800;font-size:10.2px;display:flex;align-items:center;gap:7px;cursor:pointer;text-align:right;color:var(--text)}
.band-menu-item.danger{background:#fef2f2;color:#ef4444}
.band-menu-item.primary{background:var(--hero);color:#fff}
</style>
<script src="drive-sync.js?v=9"></script>
<style>html,body{max-width:430px;margin:0 auto !important;background:var(--bg);} body{border-left:1px solid var(--card-border);border-right:1px solid var(--card-border); min-height:100dvh;}</style>
</head>
<body>
<div class="app">
<div class="top"><h3 style="font-weight:900;font-size:11px">اليومية</h3><div id="today" style="font-size:8.5px;background:var(--hero);color:#fff;padding:3px 7px;border-radius:20px"></div></div>

<div class="main-tabs">
<button class="mtab active" data-t="expense" onclick="switchTab('expense')">مصروف</button>
<button class="mtab" data-t="income" onclick="switchTab('income')">دخل</button>
<button class="mtab" data-t="debt" onclick="switchTab('debt')">ديون</button>
<button class="mtab" data-t="amanat" onclick="switchTab('amanat')">أمانات</button>
<button class="mtab" data-t="total" onclick="switchTab('total')">الإجمالي</button>
</div>

<!-- قالب موحد لشريط الشهر -->
<div id="p-expense">
<div class="month-bar">
<div class="nav"><button onclick="shiftMonth(-1)">‹</button><button onclick="shiftMonth(1)">›</button></div>
<div class="month-center"><strong id="ml-expense">—</strong><span id="ml-expense-sub"></span></div>
<div class="nav"><button class="primary" onclick="goToday()">اليوم</button></div>
</div>
<div class="kpi-row" id="stats-expense"></div>
<div class="fbar"><input id="f-exp-q" placeholder="بند" oninput="renderSimple('expense')"><select id="f-exp-w" onchange="renderSimple('expense')"><option value="">محفظة</option></select><input id="f-exp-from" type="date" onchange="renderSimple('expense')"><input id="f-exp-to" type="date" onchange="renderSimple('expense')"><button class="qbtn active" onclick="setDayFilter('expense','month')">شهر</button><button class="qbtn" onclick="setDayFilter('expense','all')">كل</button></div>
<div id="t-expense"></div>
</div>

<div id="p-income" style="display:none">
<div class="month-bar"><div class="nav"><button onclick="shiftMonth(-1)">‹</button><button onclick="shiftMonth(1)">›</button></div><div class="month-center"><strong id="ml-income">—</strong><span id="ml-income-sub"></span></div><div class="nav"><button class="primary" onclick="goToday()">اليوم</button></div></div>
<div class="kpi-row" id="stats-income"></div>
<div class="fbar"><input id="f-inc-q" placeholder="بند" oninput="renderSimple('income')"><input id="f-inc-from" type="date" onchange="renderSimple('income')"><input id="f-inc-to" type="date" onchange="renderSimple('income')"><button class="qbtn active" onclick="setDayFilter('income','month')">شهر</button><button class="qbtn" onclick="setDayFilter('income','all')">كل</button></div>
<div id="t-income"></div>
</div>

<div id="p-debt" style="display:none">
<div class="month-bar"><div class="nav"><button onclick="shiftMonth(-1)">‹</button><button onclick="shiftMonth(1)">›</button></div><div class="month-center"><strong id="ml-debt">—</strong><span id="ml-debt-sub"></span></div><div class="nav"><button class="primary" onclick="goToday()">اليوم</button></div></div>
<div class="kpi-row" id="stats-debt"></div>
<div class="fbar"><input id="f-debt-q" placeholder="شخص" oninput="renderDebt()"><input id="f-debt-from" type="date" onchange="renderDebt()"><input id="f-debt-to" type="date" onchange="renderDebt()"><button class="qbtn active" onclick="setDayFilter('debt','month')">شهر</button><button class="qbtn" onclick="setDayFilter('debt','all')">كل</button></div>
<div style="display:flex;gap:3px;background:var(--bg-soft);padding:3px;border-radius:8px;margin:4px 0"><button style="flex:1;border:none;padding:6px;border-radius:6px;font-weight:900;font-size:9.3px;cursor:pointer;background:var(--card);border:1px solid var(--card-border)" id="sdue" onclick="setDebtSub('due')">مستحق</button><button style="flex:1;border:none;padding:6px;border-radius:6px;font-weight:900;font-size:9.3px;cursor:pointer;background:transparent" id="sdef" onclick="setDebtSub('def')">مؤجل</button></div>
<div id="debt-due"></div><div id="debt-def" style="display:none"></div>
</div>

<div id="p-amanat" style="display:none">
<div class="month-bar"><div class="nav"><button onclick="shiftMonth(-1)">‹</button><button onclick="shiftMonth(1)">›</button></div><div class="month-center"><strong id="ml-amanat">—</strong><span id="ml-amanat-sub"></span></div><div class="nav"><button class="primary" onclick="goToday()">اليوم</button></div></div>
<div class="kpi-row" id="stats-amanat"></div>
<div class="fbar"><input id="f-ama-q" placeholder="شخص" oninput="renderSimple('amanat')"><input id="f-ama-from" type="date" onchange="renderSimple('amanat')"><input id="f-ama-to" type="date" onchange="renderSimple('amanat')"><button class="qbtn active" onclick="setDayFilter('amanat','month')">شهر</button><button class="qbtn" onclick="setDayFilter('amanat','all')">كل</button></div>
<div id="t-amanat"></div>
</div>

<div id="p-total" style="display:none">
<div class="month-bar"><div class="nav"><button onclick="shiftMonth(-1)">‹</button><button onclick="shiftMonth(1)">›</button></div><div class="month-center"><strong id="ml-total">—</strong><span id="ml-total-sub"></span></div><div class="nav"><button class="primary" onclick="goToday()">اليوم</button></div></div>
<div class="kpi-row" id="stats-total"></div>
<div class="fbar"><input id="f-total-q" placeholder="فلتر" oninput="renderTotal()" style="flex:1;min-width:150px;width:100%"></div>
<div id="t-total"></div>
</div>

</div>
<button class="fab" onclick="openAdd()">+</button>

<div class="modal" id="addModal" onclick="if(event.target==this)closeAdd()"><div class="card">
<div class="card-top-tabs">
<button class="card-ttab active" id="ct-expense" onclick="switchCardTab('expense')">مصروف</button>
<button class="card-ttab" id="ct-income" onclick="switchCardTab('income')">دخل</button>
<button class="card-ttab" id="ct-debt" onclick="switchCardTab('debt')">ديون</button>
<button class="card-ttab" id="ct-amanat" onclick="switchCardTab('amanat')">أمانات</button>
</div>
<div id="form-expense">
<div class="group" style="background:var(--hero);border-color:var(--hero)"><label style="color:#fff">قيمة</label><input id="a-amount" type="number" placeholder="0"></div>
<div class="row"><div class="group"><label>محفظة</label><select id="a-wallet"></select></div><div class="group"><label>بند</label><select id="a-item"></select></div></div>
<div class="row"><div class="group"><label>تاريخ</label><input id="a-date" type="date"></div><div class="group"><label>ملاحظة</label><input id="a-note"></div></div>
</div>
<div id="form-debt" style="display:none">
<div class="group" style="background:var(--hero);border-color:var(--hero)"><label style="color:#fff">قيمة</label><input id="a-amount-debt" type="number" placeholder="0"></div>
<div class="row"><div class="group"><label>محفظة</label><select id="a-wallet-debt"></select></div><div class="group"><label>نوع</label><select id="a-status"><option value="due">مستحق</option><option value="def">مؤجل</option></select></div></div>
<div class="row"><div class="group"><label>عليا/ليا</label><select id="a-direction"><option value="عليا">عليا</option><option value="ليا">ليا</option></select></div><div class="group"><label>شخص</label><select id="a-person-debt"></select></div></div>
<div class="row"><div class="group"><label>سحب</label><input id="a-date" type="date"></div><div class="group"><label>سداد</label><input id="a-date-repay" type="date"></div></div>
<div class="group"><label>ملاحظة</label><input id="a-note-debt"></div>
</div>
<div id="form-amanat" style="display:none">
<div class="group" style="background:var(--hero);border-color:var(--hero)"><label style="color:#fff">قيمة</label><input id="a-amount-ama" type="number" placeholder="0"></div>
<div class="row"><div class="group"><label>محفظة</label><select id="a-wallet-ama"><option>الأمانات</option></select></div><div class="group"><label>شخص</label><select id="a-person-ama"></select></div></div>
<div class="row"><div class="group"><label>تاريخ</label><input id="a-date-ama" type="date"></div><div class="group"><label>ملاحظة</label><input id="a-note-ama"></div></div>
</div>
<div style="display:flex;gap:5px;margin-top:7px">
<button onclick="closeAdd()" style="flex:1;padding:8px;background:var(--bg-soft);border:1px solid var(--card-border);border-radius:8px;font-weight:800;font-size:9.3px;color:var(--text)">إلغاء</button>
<button id="btnDelete" onclick="deleteTx()" style="display:none;flex:1;padding:8px;background:#fef2f2;color:#ef4444;border:1px solid #fecaca;border-radius:8px;font-weight:900;font-size:9.3px">مسح</button>
<button onclick="saveTx()" style="flex:1;padding:8px;background:var(--hero);color:#fff;border:none;border-radius:8px;font-weight:900;font-size:9.3px">حفظ</button>
</div>
</div></div>

<div class="custom-dialog" id="customPrompt"><div class="dialog-box" id="dialogInner"><h4 id="promptTitle"></h4><input id="promptInput" type="text"><div class="dialog-actions"><button class="btn-cancel" onclick="closePrompt()">إلغاء</button><button class="btn-confirm" id="promptConfirmBtn" onclick="confirmPrompt()">حسناً</button></div></div></div>
<div class="band-menu" id="bandMenu" onclick="if(event.target==this)closeBandMenu()"><div class="band-menu-box"><div style="width:27px;height:3px;background:var(--card-border);border-radius:20px;margin:0 auto 7px auto"></div><h4 id="bandMenuTitle" style="font-weight:900;font-size:10.2px;margin-bottom:5px;color:var(--text)"></h4><button class="band-menu-item primary" onclick="handleBandAction('edit')">تعديل</button><button class="band-menu-item danger" onclick="handleBandAction('delete')">مسح</button><button class="band-menu-item" onclick="closeBandMenu()" style="background:var(--bg-soft);justify-content:center">إلغاء</button></div></div>

<script>
// نفس التخزين القديم 100%
let transactions=JSON.parse(localStorage.getItem('omar_tx_v3')||'[]');
let masterBands=JSON.parse(localStorage.getItem('omar_master_bands')||'[]');
let wallets=JSON.parse(localStorage.getItem('omar_wallets_v3')||'["كاش","محفظة بنكية","فودافون كاش","الخزنة","الأمانات"]');
let curTab='expense',curDebtSub='due',editingId=null,cardTab='expense';
let currentBand=null,currentSection=null,promptCallback=null;
let curYM = new Date().toISOString().slice(0,7);

function persist(){
  try{ if(window.syncToABOmar) syncToABOmar(); if(window.parent && window.parent.syncToABOmar) window.parent.syncToABOmar(); }catch(e){}
  localStorage.setItem('omar_tx_v3',JSON.stringify(transactions)); localStorage.setItem('omar_master_bands',JSON.stringify(masterBands));
  try{ window.dispatchEvent(new Event('omar_data_updated')); if(window.parent) window.parent.postMessage({type:'omar_data_updated'}, '*'); }catch(e){}
}

function getMonthRange(ym){ const [y,m]=ym.split('-').map(Number); const first=`${ym}-01`; const lastDay=new Date(y,m,0).getDate(); const last=`${ym}-${String(lastDay).padStart(2,'0')}`; return {first,last,y,m}; }
function shiftMonth(d){ let [y,m]=curYM.split('-').map(Number); m+=d; if(m>12){m=1;y++;} if(m<1){m=12;y--;} curYM=`${y}-${String(m).padStart(2,'0')}`; updateMonthLabels(); applyMonthToInputs(); refreshCurrent(); }

function setDayFilter(type,mode){ const prefix = type==='expense'?'exp':type==='income'?'inc':type==='amanat'?'ama':'debt'; const fromEl=document.getElementById(`f-${prefix}-from`); const toEl=document.getElementById(`f-${prefix}-to`); const today=new Date().toISOString().slice(0,10); if(mode==='today'){ fromEl.value=today; toEl.value=today; } else if(mode==='month'){ const {first,last}=getMonthRange(curYM); fromEl.value=first; toEl.value=last; } else if(mode==='all'){ fromEl.value=''; toEl.value=''; } if(type==='debt') renderDebt(); else if(type==='total') renderTotal(); else renderSimple(type); }

function renderStats(type){
  const monthList = transactions.filter(t=> t.date && t.date.startsWith(curYM));
  const incomeMonth = monthList.filter(t=>t.type==='income').reduce((a,b)=>a+Number(b.amount),0);
  const expenseMonth = monthList.filter(t=>t.type==='expense').reduce((a,b)=>a+Number(b.amount),0);
  const balanceMonth = incomeMonth - expenseMonth;
  const debtAllNet = (function(){ let o=0,l=0; transactions.filter(t=>t.type==='debt').forEach(t=>{ if(t.direction==='عليا') o+=Number(t.amount); else l+=Number(t.amount); }); return l-o; })();
  const commonHTML = `
      <div class="kpi in"><div class="ico">↑</div><small>إجمالي الدخل</small><b>${incomeMonth.toLocaleString()}</b></div>
      <div class="kpi out"><div class="ico">↓</div><small>إجمالي المصروف</small><b>${expenseMonth.toLocaleString()}</b></div>
      <div class="kpi bal"><div class="ico">₪</div><small>المتبقي معاك</small><b>${balanceMonth.toLocaleString()}</b></div>
      <div class="kpi debt"><div class="ico">≡</div><small>إجمالي الديون</small><b>${debtAllNet.toLocaleString()}</b></div>`;
  ['expense','income','amanat','total'].forEach(k=>{ const el=document.getElementById('stats-'+k); if(el) el.innerHTML=commonHTML; });
  // ديون تفصيلي
  const debtMonth = monthList.filter(t=>t.type==='debt'); let o=0,l=0; debtMonth.forEach(t=>{ if(t.direction==='عليا') o+=Number(t.amount); else l+=Number(t.amount); });
  const dEl=document.getElementById('stats-debt'); if(dEl) dEl.innerHTML=`
      <div class="kpi out"><div class="ico">↓</div><small>عليا</small><b>${o.toLocaleString()}</b></div>
      <div class="kpi in"><div class="ico">↑</div><small>ليا</small><b>${l.toLocaleString()}</b></div>
      <div class="kpi bal"><div class="ico">₪</div><small>صافي الشهر</small><b>${(l-o).toLocaleString()}</b></div>
      <div class="kpi debt"><div class="ico">≡</div><small>كلي</small><b>${debtAllNet.toLocaleString()}</b></div>`;
}

function renderSimple(type){
  renderStats(type);

  const from=document.getElementById(type==='expense'?'f-exp-from':type==='income'?'f-inc-from':'f-ama-from')?.value||'';
  const to=document.getElementById(type==='expense'?'f-exp-to':type==='income'?'f-inc-to':'f-ama-to')?.value||'';
  let list=transactions.filter(t=>t.type===type);
  if(q) list=list.filter(t=>(t.item||'').includes(q));
  if(from) list=list.filter(t=>t.date>=from);
  if(to) list=list.filter(t=>t.date<=to);
  list=list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  let title = type==='expense'?'مصروف':type==='income'?'دخل':'أمانات';
  let html=`<div class="tsec"><div class="thead"><b style="font-size:10.2px">${title}</b><span style="background:var(--hero);color:#fff;padding:3px 7px;border-radius:20px;font-size:7.5px">${list.reduce((a,b)=>a+Number(b.amount),0).toLocaleString()}</span></div><div class="twrap"><table><thead><tr><th>تاريخ</th><th>بند</th><th>محفظة</th><th>قيمة</th></tr></thead><tbody>${list.map(t=>`<tr><td style="background:var(--bg-soft)">${t.date.slice(5)}</td><td>${t.item}</td><td>${t.wallet}</td><td>${Number(t.amount).toLocaleString()} <button onclick="openEdit('${t.id}')" style="border:none;background:var(--bg-soft);padding:2px 4px;border-radius:4px;font-size:7px">✏️</button> <button onclick="confirmDeleteDaily('${t.id}')" style="border:none;background:#fef2f2;padding:2px 4px;border-radius:4px;font-size:7px">🗑️</button></td></tr>`).join('')}</tbody></table></div></div>`;
  document.getElementById(type==='expense'?'t-expense':type==='income'?'t-income':'t-amanat').innerHTML=html;
}
function renderDebt(){
  renderStats('debt');
  const q=document.getElementById('f-debt-q')?.value||''; const from=document.getElementById('f-debt-from')?.value||''; const to=document.getElementById('f-debt-to')?.value||'';
  let due=transactions.filter(t=>t.subType==='debt_due'||(t.type==='debt'&&t.status==='due')); let def=transactions.filter(t=>t.subType==='debt_def'||(t.type==='debt'&&t.status==='def'));
  if(q){ due=due.filter(t=>(t.person||'').includes(q)); def=def.filter(t=>(t.person||'').includes(q)); }
  if(from){ due=due.filter(t=>t.date>=from); def=def.filter(t=>t.date>=from); } if(to){ due=due.filter(t=>t.date<=to); def=def.filter(t=>t.date<=to); }
  function build(list){ const groups={}; list.forEach(t=>{const k=t.person||t.item; if(!groups[k]) groups[k]=[]; groups[k].push(t);}); let h=''; Object.keys(groups).forEach(person=>{ const items=groups[person].sort((a,b)=>new Date(b.date)-new Date(a.date)); let olya=0,leya=0; items.forEach(t=>{ if(t.direction==='عليا') olya+=Number(t.amount); else leya+=Number(t.amount); }); const rem=olya-leya; h+=`<div class="tsec"><div class="thead"><b style="font-size:10.2px">${person}</b><span style="background:var(--hero);color:#fff;padding:2px 5px;border-radius:10px;font-size:7px">${rem.toLocaleString()}</span></div><div class="twrap"><table><thead><tr><th>تاريخ</th><th>شخص</th><th>ع/ل</th><th>قيمة</th></tr></thead><tbody>${items.map(t=>`<tr><td>${t.date.slice(5)}</td><td>${t.person}</td><td>${t.direction==='عليا'?'ع':'ل'}</td><td>${Number(t.amount).toLocaleString()} <button onclick="openEdit('${t.id}')" style="border:none;background:var(--bg-soft);padding:2px 4px;border-radius:4px;font-size:7px">✏️</button> <button onclick="confirmDeleteDaily('${t.id}')" style="border:none;background:#fef2f2;padding:2px 4px;border-radius:4px;font-size:7px">🗑️</button></td></tr>`).join('')}</tbody></table></div></div>`; }); return h||'<div style="padding:8px;text-align:center;color:var(--text-soft);background:var(--card);border-radius:8px">لا يوجد</div>'; }
  document.getElementById('debt-due').innerHTML=build(due); document.getElementById('debt-def').innerHTML=build(def);
}
function renderTotal(){
  renderStats('total');
  const q=document.getElementById('f-total-q')?.value||'';
  const months=['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const sections=[
    {key:'expense',title:'المصروفات',icon:'💸',color:'#ef4444',filter:t=>t.type==='expense'},
    {key:'income',title:'الدخل',icon:'💰',color:'#16a34a',filter:t=>t.type==='income'},
    {key:'debt_due',title:'ديون مستحقة',icon:'📌',color:'#f59e0b',filter:t=>t.subType==='debt_due'||(t.type==='debt'&&t.status==='due')},
    {key:'debt_def',title:'ديون مؤجلة',icon:'⏳',color:'#8b5cf6',filter:t=>t.subType==='debt_def'||(t.type==='debt'&&t.status==='def')},
    {key:'amanat',title:'الأمانات',icon:'🤝',color:'#06b6d4',filter:t=>t.type==='amanat'}
  ];
  let html='';
  sections.forEach(sec=>{
    let bands=masterBands.filter(b=>b.section===sec.key);
    if(q) bands=bands.filter(b=>b.name.includes(q));
    let list=transactions.filter(sec.filter);
    const monthFiltered = list.filter(t=> t.date && t.date.startsWith(curYM));
    const monthTotal = monthFiltered.reduce((a,b)=>a+Number(b.amount),0);
    const yearTotal = list.filter(t=> new Date(t.date).getFullYear()===new Date(curYM+'-01').getFullYear()).reduce((a,b)=>a+Number(b.amount),0);
    
    html+=`<div class="total-card" style="--sec-color:${sec.color}">
      <div class="total-header">
        <b><i style="background:${sec.color}15%;color:${sec.color}">${sec.icon}</i> ${sec.title}</b>
        <div class="meta">
          <span class="chip">شهر ${curYM.slice(5)}: ${monthTotal.toLocaleString()}</span>
          <span class="chip hero">سنة: ${yearTotal.toLocaleString()}</span>
          <button class="add-row-btn" onclick="addNewRow('${sec.key}')">+ بند</button>
        </div>
      </div>
      <div class="total-body">`;
    
    if(!bands.length){
      html+=`<div style="padding:20px;text-align:center;color:var(--text-soft)"><div style="font-size:22px;margin-bottom:6px">📭</div><div style="font-weight:800;font-size:10px">لا يوجد بنود في ${sec.title}</div><div style="font-size:8px;margin-top:3px">دوس + بند عشان تضيف</div></div>`;
    } else {
      html+=`<div class="twrap"><table><thead><tr><th style="min-width:70px;position:sticky;right:0;z-index:2">البند</th>${Array.from({length:12},(_,i)=>`<th>${months[i+1].slice(0,3)}</th>`).join('')}<th style="background:var(--hero);color:#fff">الإجمالي</th></tr></thead><tbody>`;
      bands.forEach(b=>{
        const band=b.name;
        const items=list.filter(t=>(t.item===band||t.person===band));
        const perMonth=Array(12).fill(0);
        let total=0;
        if(sec.key.startsWith('debt')){
          let olya=0,leya=0;
          items.forEach(t=>{
            if(t.direction==='عليا') olya+=Number(t.amount);
            else leya+=Number(t.amount);
            const d=new Date(t.date);
            if(!isNaN(d)) perMonth[d.getMonth()]+= (t.direction==='عليا'?1:-1)*Number(t.amount);
          });
          total=olya-leya;
        } else {
          items.forEach(t=>{
            const d=new Date(t.date);
            if(!isNaN(d)) perMonth[d.getMonth()]+=Number(t.amount);
          });
          total=perMonth.reduce((a,b)=>a+b,0);
        }
        const isActiveMonth = perMonth[new Date(curYM+'-01').getMonth()]!==0;
        html+=`<tr style="${isActiveMonth?'background:color-mix(in srgb, '+sec.color+' 8%, transparent)':''}">
          <td onclick="openBandMenu('${band}','${sec.key}')" style="position:sticky;right:0;background:var(--card);font-weight:900;cursor:pointer;border-left:2px solid ${sec.color};z-index:1">${band}</td>
          ${perMonth.map((v,i)=>{
            const isCur = (i===new Date(curYM+'-01').getMonth());
            return `<td style="${isCur?'background:color-mix(in srgb, '+sec.color+' 12%, var(--card));font-weight:900;border:1px solid '+sec.color+'30':''}">${v? (v>0?'+':'' )+v.toLocaleString():'<span style="color:var(--text-soft);opacity:.4">-</span>'}</td>`;
          }).join('')}
          <td style="font-weight:900;background:var(--bg-soft);color:${total<0?'#ef4444':sec.color}">${total.toLocaleString()}</td>
        </tr>`;
      });
      html+=`</tbody></table></div>
      <div class="total-footer"><span>عدد البنود: ${bands.length}</span><span>شهر ${curYM}: <b style="color:${sec.color}">${monthTotal.toLocaleString()}</b> • السنة: <b>${yearTotal.toLocaleString()}</b></span></div>`;
    }
    html+=`</div></div>`;
  });
  document.getElementById('t-total').innerHTML=html;
}

function saveTx(){
  let type=cardTab; let item,person,wallet,amount,date,note,direction,status;
  if(type==='expense'||type==='income'){ item=document.getElementById('a-item').value; wallet=document.getElementById('a-wallet').value; amount=document.getElementById('a-amount').value; date=document.getElementById('a-date').value; note=document.getElementById('a-note').value; if(item==='__new__'){ const newName=prompt('اسم البند:'); if(newName){ masterBands.push({id:Date.now(),name:newName,section:type}); item=newName; } } person=item; }
  else if(type==='debt'){ item=document.getElementById('a-person-debt').value; person=item; wallet=document.getElementById('a-wallet-debt').value; amount=document.getElementById('a-amount-debt').value; date=document.getElementById('a-date').value; note=document.getElementById('a-note-debt').value; direction=document.getElementById('a-direction').value; status=document.getElementById('a-status').value; if(item==='__new__'){ const newName=prompt('اسم الشخص:'); if(newName){ const sec=status==='due'?'debt_due':'debt_def'; masterBands.push({id:Date.now(),name:newName,section:sec}); item=newName; person=newName; } } }
