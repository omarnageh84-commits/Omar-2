<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>يومياتي</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tajawal,system-ui}
body{background:#f8fafc}
.hidden{display:none!important}
.active{font-weight:900}
.tab{display:none;padding:14px;padding-bottom:90px}
.tab.active{display:block}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0 14px;border-top:1px solid #e5e7eb;z-index:99}
.nav-btn{border:0;background:0;font-size:11px;color:#9ca3af;text-align:center}
.nav-btn.active{color:#10b981}
.pill{padding:8px 16px;border-radius:99px;border:0;background:#eef2ff;font-size:13px;font-weight:700}
.pill.active{background:#10b981;color:#fff}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.input{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:8px;font-size:14px}
.btn{width:100%;padding:12px;border:0;border-radius:12px;background:#10b981;color:#fff;font-weight:800;font-size:14px}
.btn2{padding:8px 12px;border-radius:10px;border:0;background:#e5e7eb;font-size:12px}
</style>
</head>
<body>

<!-- Header -->
<div style="background:#10b981;color:#fff;padding:16px 18px;border-radius:0 0 22px 22px;display:flex;justify-content:space-between;align-items:center">
  <b id="date">الجمعة، ٧ أغسطس</b>
  <b>💼 يومياتي</b>
</div>

<!-- Tabs -->
<!-- الرئيسية -->
<div id="tab-home" class="tab active">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
    <div class="card"><div style="font-size:12px;color:#6b7280">المصاريف</div><b id="total-exp">0 ج</b></div>
    <div class="card"><div style="font-size:12px;color:#6b7280">الدخل</div><b id="total-income">0 ج</b></div>
    <div class="card"><div style="font-size:12px;color:#6b7280">الديون</div><b id="total-debt">0 ج</b></div>
    <div class="card"><div style="font-size:12px;color:#6b7280">الرصيد</div><b id="balance">0 ج</b></div>
  </div>
</div>

<!-- اليومية - مصاريف -->
<div id="tab-daily" class="tab">
  <div style="display:flex;gap:6px;background:#eef2ff;padding:6px;border-radius:99px;margin:12px 0">
    <button id="p-exp" class="pill active" style="flex:1" onclick="setDaily('exp')">المصاريف</button>
    <button id="p-income" class="pill" style="flex:1" onclick="setDaily('income')">الدخل</button>
    <button id="p-debt" class="pill" style="flex:1" onclick="setDaily('debt')">الديون</button>
  </div>

  <div id="daily-exp">
    <input id="exp-title" class="input" placeholder="اسم المصروف">
    <input id="exp-amount" class="input" type="number" placeholder="المبلغ">
    <input id="exp-cat" class="input" placeholder="الفئة (بيت، شغل...)">
    <button class="btn" onclick="addDaily('exp')">إضافة مصروف</button>
    <div id="exp-list" style="margin-top:14px"></div>
  </div>
  <div id="daily-income" class="hidden">
    <input id="income-title" class="input" placeholder="مصدر الدخل">
    <input id="income-amount" class="input" type="number" placeholder="المبلغ">
    <input id="income-cat" class="input" placeholder="الفئة">
    <button class="btn" onclick="addDaily('income')">إضافة دخل</button>
    <div id="income-list" style="margin-top:14px"></div>
  </div>
  <div id="daily-debt" class="hidden">
    <input id="debt-title" class="input" placeholder="اسم الدين">
    <input id="debt-amount" class="input" type="number" placeholder="المبلغ">
    <input id="debt-cat" class="input" placeholder="لمن؟">
    <button class="btn" onclick="addDaily('debt')">إضافة دين</button>
    <div id="debt-list" style="margin-top:14px"></div>
  </div>
</div>

<!-- الحضور -->
<div id="tab-att" class="tab">
  <div id="att-list" style="margin-top:12px"></div>
  <button class="btn" style="margin-top:12px" onclick="addAtt()">تسجيل حضور الآن</button>
</div>

<!-- ملاحظات - بفئات -->
<div id="tab-notes" class="tab">
  <div id="note-cats"></div>
  <div class="card" style="margin-top:10px">
    <select id="note-cat-select" class="input"></select>
    <textarea id="note-text" class="input" rows="3" placeholder="اكتب الملاحظة..."></textarea>
    <input type="hidden" id="note-img-base"><input type="hidden" id="note-aud-base">
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <label class="btn2">📷 صورة<input type="file" id="note-img-file" accept="image/*" hidden onchange="onNoteImg(this)"></label>
      <button id="note-mic-btn" class="btn2" onclick="toggleNoteMic()">🎤</button>
      <label class="btn2">🎵 صوت<input type="file" id="note-aud-file" accept="audio/*" hidden onchange="onNoteAud(this)"></label>
    </div>
    <div id="note-preview"></div>
    <button id="note-btn" class="btn" style="margin-top:8px" onclick="addNote()">إضافة ملاحظة</button>
  </div>
  <div id="notes-list" style="margin-top:12px"></div>
</div>

<!-- مهام - بفئات -->
<div id="tab-tasks" class="tab">
  <div id="task-cats"></div>
  <div class="card" style="margin-top:10px">
    <select id="task-cat-select" class="input"></select>
    <input id="task-text" class="input" placeholder="اكتب المهمة...">
    <input type="hidden" id="task-img-base"><input type="hidden" id="task-aud-base">
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <label class="btn2">📷<input type="file" accept="image/*" hidden onchange="onTaskImg(this)"></label>
      <button id="task-mic-btn" class="btn2" onclick="toggleTaskMic()">🎤</button>
      <label class="btn2">🎵<input type="file" id="task-aud-file" accept="audio/*" hidden onchange="onTaskAud(this)"></label>
    </div>
    <div id="task-preview"></div>
    <button id="task-btn" class="btn" onclick="addTask()">إضافة مهمة</button>
  </div>
  <div id="tasks-list" style="margin-top:12px"></div>
</div>

<!-- Nav -->
<div class="nav">
  <button class="nav-btn" onclick="openTab(event,'home')">🏠<br>الرئيسية</button>
  <button class="nav-btn active" onclick="openTab(event,'daily')">💰<br>اليومية</button>
  <button class="nav-btn" onclick="openTab(event,'att')">⏰<br>الحضور</button>
  <button class="nav-btn" onclick="openTab(event,'notes')">📝<br>ملاحظات</button>
  <button class="nav-btn" onclick="openTab(event,'tasks')">✅<br>مهام</button>
</div>

<script src="js/app.js"></script>
<script src="js/daily.js"></script>
<script src="js/notes.js"></script>
<script src="js/tasks.js"></script>
<script>
let att=JSON.parse(localStorage.getItem('omar_att')||'[]');
function addAtt(){ att.unshift({id:Date.now(),time:new Date().toLocaleString('ar-EG')}); localStorage.setItem('omar_att',JSON.stringify(att)); renderAtt(); }
function renderAtt(){ const l=document.getElementById('att-list'); if(!l) return; if(att.length==0) l.innerHTML='<div style="text-align:center;color:#9ca3af;padding:20px">مفيش حضور</div>'; else l.innerHTML=att.map(a=>`<div class="card" style="display:flex;justify-content:space-between"><span>${a.time}</span><b onclick="att=att.filter(x=>x.id!==${a.id});localStorage.setItem('omar_att',JSON.stringify(att));renderAtt()" style="color:red">✕</b></div>`).join(''); }
</script>
</body>
</html>
