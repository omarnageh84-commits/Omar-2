<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SystemOmar Pro Max</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0}
html,body{touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none}
body{background:#121212;color:#fff;padding-bottom:90px}
.h{background:#0F7A3D;padding:12px 16px 0;position:sticky;top:0;z-index:10}
.top{display:flex}
.top a{flex:1;text-align:center;padding:10px 2px;color:#ffffff99;border-bottom:3px solid transparent;font-size:13px;cursor:pointer}
.top a.on{border-color:#fff;color:#fff;font-weight:700}
.card{background:#1E1E1E;border:1px solid #2A2A2A;border-radius:16px;padding:12px;margin-bottom:10px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#1E1E1E;border-top:1px solid #2A2A2A;height:72px;display:flex;justify-content:space-around;align-items:center;z-index:9999}
.bottom a{color:#888;font-size:11px;display:flex;flex-direction:column;align-items:center;flex:1;cursor:pointer;text-decoration:none}
.bottom a.on{color:#0F7A3D}
.plus{width:56px;height:56px;border-radius:50%;background:#3F3B6B;margin-top:-28px;display:grid;place-items:center;font-size:26px;color:#fff;cursor:pointer}
.modal{position:fixed;inset:0;background:#0008;backdrop-filter:blur(6px);z-index:99;display:none;place-items:center;padding:16px}
.modal.show{display:grid}
.box{background:#1E1E1E;border:1px solid #333;border-radius:20px;padding:16px;width:100%;max-width:400px}
.inp{width:100%;height:44px;background:#121212;border:1px solid #333;border-radius:12px;padding:0 12px;color:#fff;margin-top:8px;outline:none}
</style>
</head>
<body>
<div class="h">
<div style="display:flex;justify-content:space-between;font-size:14px"><span>🔒</span><span>الجنيه المصري ▼</span></div>
<div class="top" id="topTabs">
<a data-t="expenses" class="on" onclick="setTop('expenses')">مصروفاتي</a>
<a data-t="debts" onclick="setTop('debts')">ديوني</a>
<a data-t="attendance" onclick="setTop('attendance')">الحضور</a>
<a data-t="notes" onclick="setTop('notes')">ملاحظاتي</a>
</div>
</div>
<div style="padding:12px">
<div class="card" id="summaryCard" style="display:flex;gap:12px;align-items:center"><div id="circleTotal" style="width:80px;height:80px;border-radius:50%;border:6px solid #4DD0E1;display:grid;place-items:center;font-weight:700">0ج</div><div style="flex:1;font-size:12px" id="summaryText"><div>المصاريف: 0</div><div>الدخل: 0</div><div>الصافي: 0</div></div></div>
<div style="display:flex;gap:8px;margin:12px 0">
<button onclick="syncSheet()" style="flex:1;height:40px;border-radius:12px;background:#0F7A3D;color:#fff;border:0">☁️ رفع للشيت</button>
<button onclick="exportExcel()" style="flex:1;height:40px;border-radius:12px;background:#2A2A2A;color:#fff;border:1px solid #333">💾 Excel</button>
</div>
<div id="list"></div>
</div>
<div class="bottom" id="bottomNav"></div>
<div id="modal" class="modal"><div class="box"><h3 id="mTitle">إضافة</h3><div id="mFields"></div><div style="display:flex;gap:8px;margin-top:12px"><button onclick="save()" style="flex:1;height:42px;border-radius:12px;background:#0F7A3D;color:#fff;border:0">إضافة الآن</button><button onclick="closeM()" style="flex:1;height:42px;border-radius:12px;background:#222;color:#fff;border:1px solid #333">إلغاء</button></div></div></div>
<script>
const APP={
  get:(k,d)=>{try{let v=localStorage.getItem(k); return v?JSON.parse(v):d}catch{return d}},
  set:(k,v)=>{
    localStorage.setItem(k,JSON.stringify(v));
    if(localStorage.getItem('gs_url') && ['expenses','debts','attendance','notes'].includes(k)){
      clearTimeout(window._syncT);
      window._syncT=setTimeout(()=>{ if(typeof syncSheetSilent==='function') syncSheetSilent(); },1500);
    }
  }
};
const uid=()=>Math.random().toString(36).slice(2,7);
const SUBS={
  expenses:[{id:'outcome',l:'مصروف',i:'💸'},{id:'income',l:'مدخلات',i:'💰'},{id:'net',l:'الصافي',i:'📊'},{id:'all',l:'الكل',i:'📋'}],
  debts:[{id:'lena',l:'لنا',i:'⬆️'},{id:'alayna',l:'علينا',i:'⬇️'},{id:'net',l:'الصافي',i:'⚖️'},{id:'all',l:'الكل',i:'📋'}],
  attendance:[{id:'hader',l:'حاضر',i:'✅'},{id:'ghaeb',l:'غائب',i:'❌'},{id:'mot',l:'متأخر',i:'⏰'},{id:'all',l:'الكل',i:'📅'}],
  notes:[{id:'pinned',l:'مثبتة',i:'📌'},{id:'general',l:'عامة',i:'📝'},{id:'all',l:'الكل',i:'📋'}]
};
let topT=localStorage.getItem('topT')||'expenses', bottomT='all';
function setTop(t){topT=t;bottomT='all';localStorage.setItem('topT',t);render();}
function setBottom(b){bottomT=b;render();}
function render(){
  document.querySelectorAll('.top a').forEach(a=>a.classList.toggle('on',a.dataset.t===topT));
  let subs=SUBS[topT];
  document.getElementById('bottomNav').innerHTML=`<a class="${bottomT===subs[0].id?'on':''}" onclick="setBottom('${subs[0].id}')"><span>${subs[0].i}</span><span>${subs[0].l}</span></a><a class="${bottomT===subs[1].id?'on':''}" onclick="setBottom('${subs[1].id}')"><span>${subs[1].i}</span><span>${subs[1].l}</span></a><div class="plus" onclick="openM()">+</div><a class="${bottomT===subs[2].id?'on':''}" onclick="setBottom('${subs[2].id}')"><span>${subs[2].i}</span><span>${subs[2].l}</span></a><a class="${bottomT===subs[3]?.id?'on':''}" onclick="setBottom('${subs[3]?.id||'all'}')"><span>${subs[3]?.i||'📋'}</span><span>${subs[3]?.l||'الكل'}</span></a>`;
  
  // Summary calculation - ديناميكي مش ثابت
  let expenses=APP.get('expenses',[]);
  let outSum=expenses.filter(x=>x.type==='outcome').reduce((s,x)=>s+(Number(x.amount)||0),0);
  let incSum=expenses.filter(x=>x.type==='income').reduce((s,x)=>s+(Number(x.amount)||0),0);
  let net=incSum-outSum;
  document.getElementById('circleTotal').innerText=net+'ج';
  document.getElementById('summaryText').innerHTML=`<div>المصاريف: ${outSum}ج</div><div>الدخل: ${incSum}ج</div><div>الصافي: ${net}ج</div>`;

  // Attendance summary
  if(topT==='attendance'){
    let att=APP.get('attendance',[]);
    let hader=att.filter(x=>x.status==='حاضر').length;
    let ghaeb=att.filter(x=>x.status==='غائب').length;
    let mot=att.filter(x=>x.status==='متأخر').length;
    document.getElementById('circleTotal').innerText=att.length+' يوم';
    document.getElementById('summaryText').innerHTML=`<div>حاضر: ${hader}</div><div>غائب: ${ghaeb}</div><div>متأخر: ${mot}</div>`;
  }
  if(topT==='debts'){
    let debts=APP.get('debts',[]);
    let lena=debts.filter(x=>x.type==='لنا').reduce((s,x)=>s+(Number(x.amount)||0),0);
    let alayna=debts.filter(x=>x.type==='علينا').reduce((s,x)=>s+(Number(x.amount)||0),0);
    document.getElementById('circleTotal').innerText=(lena-alayna)+'ج';
    document.getElementById('summaryText').innerHTML=`<div>لنا: ${lena}ج</div><div>علينا: ${alayna}ج</div><div>الصافي: ${lena-alayna}ج</div>`;
  }
  if(topT==='notes'){
    let notes=APP.get('notes',[]);
    document.getElementById('circleTotal').innerText=notes.length;
    document.getElementById('summaryText').innerHTML=`<div>إجمالي الملاحظات: ${notes.length}</div>`;
  }

  let html='', data=[];
  if(topT==='expenses'){
    data=APP.get('expenses',[]); 
    if(bottomT==='outcome')data=data.filter(x=>x.type==='outcome'); 
    if(bottomT==='income')data=data.filter(x=>x.type==='income'); 
    html=data.map(e=>`<div class="card" style="display:flex;justify-content:space-between"><div><b>${e.amount}ج - ${e.desc||''}</b><div style="font-size:11px;opacity:.6">${e.type==='outcome'?'مصروف':'دخل'}</div></div><div><span onclick="del('expenses','${e.id}')" style="cursor:pointer">🗑️</span></div></div>`).join('');
  }
  if(topT==='debts'){
    data=APP.get('debts',[]); 
    if(bottomT==='lena')data=data.filter(x=>x.type==='لنا'); 
    if(bottomT==='alayna')data=data.filter(x=>x.type==='علينا'); 
    html=data.map(d=>`<div class="card" style="display:flex;justify-content:space-between"><div><b>${d.person} - ${d.amount}ج</b><div style="color:${d.type==='لنا'?'#4caf50':'#f44336'}">${d.type}</div></div><div><span onclick="del('debts','${d.id}')">🗑️</span></div></div>`).join('');
  }
  if(topT==='attendance'){
    data=APP.get('attendance',[]); 
    if(bottomT==='hader')data=data.filter(x=>x.status==='حاضر'); 
    if(bottomT==='ghaeb')data=data.filter(x=>x.status==='غائب'); 
    if(bottomT==='mot')data=data.filter(x=>x.status==='متأخر'); 
    html=data.map(a=>`<div class="card" style="display:flex;justify-content:space-between"><div><b>${a.date} - ${a.status}</b><div style="font-size:11px;opacity:.6">دخول: ${a.checkIn} - خروج: ${a.checkOut}</div></div><div><span onclick="del('attendance','${a.id}')">🗑️</span></div></div>`).join('');
  }
  if(topT==='notes'){
    data=APP.get('notes',[]); 
    html=data.map(n=>`<div class="card" style="display:flex;justify-content:space-between"><div><b>${n.title}</b><div>${n.content}</div></div><div><span onclick="del('notes','${n.id}')">🗑️</span></div></div>`).join('');
  }
  document.getElementById('list').innerHTML=html||'<div style="text-align:center;padding:40px;opacity:.4">لا يوجد بيانات</div>';
}
function openM(){
  let f=''; 
  if(topT==='expenses')f=`<input id="f_a" class="inp" placeholder="المبلغ" type="number"><input id="f_d" class="inp" placeholder="الوصف"><select id="f_t" class="inp"><option value="outcome">مصروف</option><option value="income">مدخلات</option></select>`; 
  if(topT==='debts'){
    let def=bottomT==='lena'?'لنا':bottomT==='alayna'?'علينا':'لنا'; 
    f=`<input id="f_p" class="inp" placeholder="اسم الشخص"><input id="f_a" class="inp" placeholder="المبلغ" type="number"><select id="f_t" class="inp"><option ${def==='لنا'?'selected':''}>لنا</option><option ${def==='علينا'?'selected':''}>علينا</option></select>`;
  } 
  if(topT==='attendance'){
    let defStatus=bottomT==='hader'?'حاضر':bottomT==='ghaeb'?'غائب':bottomT==='mot'?'متأخر':'حاضر';
    let today=new Date().toISOString().slice(0,10);
    f=`<input id="f_date" class="inp" type="date" value="${today}"><div style="display:flex;gap:8px"><input id="f_in" class="inp" type="time" value="09:00"><input id="f_out" class="inp" type="time" value="17:00"></div><select id="f_s" class="inp"><option ${defStatus==='حاضر'?'selected':''}>حاضر</option><option ${defStatus==='غائب'?'selected':''}>غائب</option><option ${defStatus==='متأخر'?'selected':''}>متأخر</option></select>`;
  }
  if(topT==='notes')f=`<input id="f_ti" class="inp" placeholder="عنوان"><input id="f_c" class="inp" placeholder="محتوى">`; 
  document.getElementById('mFields').innerHTML=f; 
  document.getElementById('modal').classList.add('show');
}
function closeM(){document.getElementById('modal').classList.remove('show');}
function save(){
  let id=uid(); 
  if(topT==='expenses'){
    let a=APP.get('expenses',[]); 
    let am=document.getElementById('f_a').value;
    if(!am){alert('اكتب المبلغ');return;}
    a.push({id,amount:Number(am),desc:document.getElementById('f_d').value,type:document.getElementById('f_t').value, date: new Date().toISOString().slice(0,10)}); 
    APP.set('expenses',a);
  } 
  if(topT==='debts'){
    let a=APP.get('debts',[]); 
    a.push({id,person:document.getElementById('f_p').value,amount:Number(document.getElementById('f_a').value),type:document.getElementById('f_t').value, date: new Date().toISOString().slice(0,10)}); 
    APP.set('debts',a);
  } 
  if(topT==='attendance'){
    let a=APP.get('attendance',[]); 
    a.push({id,date:document.getElementById('f_date').value,checkIn:document.getElementById('f_in').value,checkOut:document.getElementById('f_out').value,status:document.getElementById('f_s').value}); 
    APP.set('attendance',a);
  }
  if(topT==='notes'){
    let a=APP.get('notes',[]); 
    a.push({id,title:document.getElementById('f_ti').value,content:document.getElementById('f_c').value}); 
    APP.set('notes',a);
  } 
  closeM(); render();
}
function del(k,id){if(confirm('مسح؟')){APP.set(k,APP.get(k,[]).filter(x=>x.id!==id)); render();}}
function exportExcel(){
  let wb=XLSX.utils.book_new(); 
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(APP.get('expenses',[])),'مصروفاتي');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(APP.get('debts',[])),'ديوني');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(APP.get('attendance',[])),'الحضور');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(APP.get('notes',[])),'ملاحظاتي');
  XLSX.writeFile(wb,'مشروعي.xlsx');
}
function syncSheet(){
  let url=localStorage.getItem('gs_url')||prompt('لينك Google Apps Script:'); 
  if(!url)return; 
  localStorage.setItem('gs_url',url); 
  let payload={expenses:APP.get('expenses',[]),debts:APP.get('debts',[]),attendance:APP.get('attendance',[]),notes:APP.get('notes',[])};
  fetch(url,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)}); 
  alert('تم الرفع ✅');
}
function syncSheetSilent(){
  let url=localStorage.getItem('gs_url'); if(!url) return;
  let payload={expenses:APP.get('expenses',[]),debts:APP.get('debts',[]),attendance:APP.get('attendance',[]),notes:APP.get('notes',[])};
  fetch(url,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});
}
render();
</script>
</body>
</html>
