<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>نظام عمر الشامل - الإصدار الموحد النهائي 🚀</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* === الثيمات الموحدة (Teal & Dark) === */
:root {
  --bg: #F0FDFA; --bg-soft: #CCFBF1; --card: #FFFFFF; --card-border: #5EEAD4;
  --text: #134E4A; --text-soft: #0D9488; --hero: #0F766E; --accent: #14B8A6; --nav-bg: rgba(255,255,255,0.92);
}
[data-theme="dark"] {
  --bg: #020617; --bg-soft: #1E293B; --card: #0F172A; --card-border: #1E293B;
  --text: #F1F5F9; --text-soft: #94A3B8; --hero: #0F766E; --accent: #14B8A6; --nav-bg: rgba(15,23,42,0.92);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}
body{display:flex;justify-content:center;align-items:center}
.phone-shell{width:100%;max-width:430px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;border-left:1px solid var(--card-border);border-right:1px solid var(--card-border)}
.header{height:52px;background:var(--card);border-bottom:1.5px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;z-index:20}
.content{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;padding:8px;display:none;background:var(--bg)}
.view.active{display:flex}
.nav{height:70px;background:var(--nav-bg);backdrop-filter:blur(20px);border-top:1.5px solid var(--card-border);display:flex;align-items:center;padding:6px;gap:6px;flex-shrink:0;z-index:30}
.nav button{flex:1;height:100%;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;color:var(--text-soft);font-size:10px;font-weight:800;cursor:pointer}
.nav button.active{background:var(--hero);color:#fff}
.card{background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;padding:10px;margin-bottom:7px}
.btn{background:var(--hero);color:#fff;border:none;border-radius:10px;padding:10px;font-weight:900;cursor:pointer;font-size:11px}
.en{font-family:'JetBrains Mono',monospace!important;direction:ltr!important;text-align:center}

/* تنسيقات إضافية خاصة بالتبويبات */
.main-tabs{display:flex;gap:4px;background:var(--card);padding:5px;border-radius:12px;border:1.5px solid var(--card-border);margin:8px 0;overflow:auto;scrollbar-width:none}
.mtab{flex:1;white-space:nowrap;border:none;padding:9px 5px;border-radius:9px;font-weight:900;font-size:11px;cursor:pointer;background:transparent;color:var(--text-soft);min-width:60px}
.mtab.active{background:var(--hero);color:#fff}
.month-nav{background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;padding:6px 8px;display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.month-nav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--card-border);background:var(--bg-soft);color:var(--text);font-weight:900;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.month-label{font-weight:900;font-size:12px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.month-label small{font-size:8px;color:var(--text-soft);font-weight:700}
.stats{display:block;margin-bottom:8px}
.kpi-grid-5{display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:4px!important}
.stat{background:var(--card);border:1.5px solid var(--card-border);border-radius:10px;position:relative;overflow:hidden;min-height:62px!important;aspect-ratio:1/1!important;padding:4px 2px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important}
.stat::after{content:'';position:absolute;top:0;right:0;width:100%;height:3px;background:var(--hero)}
.stat small{display:block;font-size:6px!important;color:var(--text-soft);font-weight:800;margin-bottom:2px!important}
.stat b{display:block;font-size:11.5px!important;font-weight:900;line-height:1.1}
.stat.pos b{color:#16a34a}.stat.neg b{color:#ef4444}.stat.neu b{color:var(--text)}
.stat.def{cursor:pointer;border-width:2px!important}
.stat.def.active{border-color:#16a34a!important;background:#f0fdf4!important}
.stat.def.inactive{border-color:var(--card-border)!important;background:var(--bg-soft)!important;border-style:dashed!important}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.switch{position:relative;display:inline-block;width:38px;height:22px;flex:0 0 38px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#e2e8f0;transition:.25s;border-radius:20px;border:1px solid var(--card-border)}
.slider:before{position:absolute;content:'';height:16px;width:16px;left:2px;bottom:2px;background:#fff;transition:.25s;border-radius:50%}
input:checked +.slider{background:#16a34a;border-color:#16a34a}
input:checked +.slider:before{transform:translateX(16px)}
.switch-label{font-size:8px;font-weight:900;color:var(--text-soft)}
.switch-label.on{color:#16a34a}.switch-label.off{color:#ef4444}
.fixed-box{background:var(--card);border:1.5px solid var(--hero);border-radius:12px;overflow:hidden;margin-bottom:7px}
.fixed-head{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:var(--bg-soft);user-select:none}
.fixed-body{padding:6px;display:flex;flex-direction:column;gap:4px}
.fixed-row-2{display:grid;grid-template-columns:1fr 70px 20px 1fr 70px 20px;gap:4px;align-items:center;background:var(--bg-soft);border:1px solid var(--card-border);border-radius:8px;padding:4px}
.fixed-row-2 input{padding:6px 4px;border:1px solid var(--card-border);border-radius:6px;font-weight:800;font-size:10px;background:var(--card);color:var(--text);width:100%;text-align:center}
.fixed-row-2 input:nth-child(1),.fixed-row-2 input:nth-child(4){text-align:right;font-size:9px}
.fixed-del-sm{width:20px;height:20px;border:none;background:#fef2f2;color:#ef4444;border-radius:5px;cursor:pointer;font-weight:900;font-size:10px;display:flex;align-items:center;justify-content:center}
.fbar{background:var(--card);border:1.5px solid var(--card-border);border-radius:11px;padding:7px;margin-bottom:7px;display:flex;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:5px;align-items:center}
.fbar input,.fbar select{flex:0 0 auto;width:87px;min-width:72px;padding:6px 6px;border:1px solid var(--card-border);border-radius:8px;font-weight:700;font-size:8.5px;background:var(--bg-soft);color:var(--text)}
.tsec{background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;overflow:hidden;margin-bottom:8px}
.thead{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;background:var(--bg-soft);border-bottom:1.5px solid var(--card-border)}
.twrap{overflow:auto;max-width:100%}
table{width:100%;border-collapse:collapse;min-width:320px}
th{background:var(--bg-soft);padding:7px 3px;border-bottom:1px solid var(--card-border);font-size:8.5px;color:var(--text-soft);position:sticky;top:0;white-space:nowrap;text-align:center;font-weight:900}
td{padding:7px 3px;border-bottom:1px solid var(--bg-soft);text-align:center;font-weight:800;font-size:9.3px;white-space:nowrap;color:var(--text)}
.total-header{background:var(--hero)!important;color:#fff!important;padding:10px 12px!important;border-radius:12px!important;margin:12px 0 6px 0!important;display:flex!important;justify-content:space-between!important;align-items:center!important;font-weight:900!important;border:1.5px solid var(--hero)!important}
.total-header b{font-size:11px!important}
.add-row-btn{background:var(--card)!important;color:var(--hero)!important;padding:6px 12px!important;border-radius:8px!important;font-size:9px!important;font-weight:900!important;border:none!important;cursor:pointer}
.tsec.total-sec{background:var(--card)!important;border:1.5px solid var(--card-border)!important;border-radius:12px!important;overflow:hidden!important}
.fab{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:51px;height:51px;border-radius:50%;background:var(--hero);color:#fff;border:none;font-size:27px;z-index:50;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;backdrop-filter:blur(6px);align-items:flex-start;justify-content:center;padding:8px 12px 12px 12px;overflow-y:auto}
.modal.open{display:flex}
.modal .card{background:var(--card);width:100%;max-width:420px;margin:10vh auto auto auto;border-radius:16px;padding:10px 10px 14px 10px;max-height:72vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.card-actions{position:sticky;bottom:0;background:var(--card);padding-top:10px;margin-top:10px;border-top:1.5px solid var(--card-border);display:flex;gap:6px;z-index:5}
.card-top-tabs{display:flex;gap:3px;background:var(--bg-soft);padding:4px;border-radius:10px;margin-bottom:7px;overflow-x:auto}
.card-ttab{flex:1;white-space:nowrap;border:none;padding:8px 5px;border-radius:8px;font-weight:900;font-size:9.3px;cursor:pointer;background:transparent;color:var(--text-soft);min-width:50px}
.card-ttab.active{background:var(--hero);color:#fff}
.group{background:var(--bg-soft);border:1px solid var(--card-border);border-radius:9px;padding:6px 8px;margin:4px 0;display:flex;gap:4px;align-items:center}
.group label{font-size:7.5px;font-weight:800;color:var(--text-soft);white-space:nowrap;min-width:28px}
.group input,.group select{flex:1;padding:7px 6px;border:1px solid var(--card-border);border-radius:7px;font-weight:700;font-size:11px;background:var(--card);width:100%;color:var(--text)}
.group input[type="number"]{font-size:15px;font-weight:900;text-align:center}
.row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;margin:5px 0}
.row-3 .group{margin:0!important}
.qbtn{flex:0 0 auto;min-width:36px;padding:5px 7px;border:1px solid var(--card-border);border-radius:13px;background:var(--card);font-size:8px;font-weight:800;cursor:pointer;color:var(--text)}
.qbtn.active{background:var(--hero);color:#fff;border-color:var(--hero)}
.custom-dialog{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:200;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(8px)}
.custom-dialog.open{display:flex}
.dialog-box{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:300px;border:1px solid var(--card-border);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.dialog-box h4{font-size:13px;font-weight:900;margin-bottom:10px;color:var(--text)}
.dialog-box input{width:100%;padding:10px 12px;border:1.5px solid var(--card-border);border-radius:10px;font-weight:800;font-size:13px;margin-bottom:8px;background:var(--bg-soft);color:var(--text)}
.dialog-actions{display:flex;gap:8px;margin-top:12px}
.dialog-actions button{flex:1;padding:10px;border:none;border-radius:10px;font-weight:900;font-size:11px;cursor:pointer}
.btn-cancel{background:var(--bg-soft);color:var(--text-soft);border:1px solid var(--card-border)}
.btn-confirm{background:var(--hero);color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.band-menu{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:150;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.band-menu.open{display:flex}
.band-menu-box{background:var(--card);width:100%;max-width:306px;border-radius:13px 13px 0 0;padding:7px 8px 12px 8px;border-top:1px solid var(--card-border)}
.band-menu-item{width:100%;padding:10px 8px;border:none;background:var(--bg-soft);border-radius:8px;margin:3px 0;font-weight:800;font-size:10.2px;display:flex;align-items:center;gap:7px;cursor:pointer;text-align:right;color:var(--text)}
.band-menu-item.danger{background:#fef2f2;color:#ef4444}
.band-menu-item.primary{background:var(--hero);color:#fff}

/* تنسيق الحضور داخل الـ View */
.att-stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:3px;margin:4px 0 0 0}
.att-stat{border-radius:8px;padding:6px 2px;border:1px solid var(--card-border);text-align:center;background:var(--card)}
.att-stat small{font-size:7.5px;font-weight:700;opacity:.8;display:block;color:var(--text-soft);line-height:1}
.att-stat b,.att-stat input{font-size:10.4px!important;font-weight:900;color:var(--text);line-height:1.2}
.time-box{width:90%;border:1px solid var(--card-border);border-radius:6px;padding:5px 1px;text-align:center;font-size:9.3px;background:var(--bg);color:var(--text);outline:none;font-weight:800}
.time-box.filled{background:var(--hero)!important;color:#fff!important;border-color:var(--hero)!important}
.time-box.half{background:var(--bg-soft)!important;border-color:var(--hero)!important;color:var(--hero)!important}
.note-box{width:92%;border:1px dashed var(--card-border);border-radius:6px;padding:4px 2px;font-size:8px;background:var(--bg);color:var(--text);outline:none;text-align:center}
.table-wrap{background:var(--card);border:1px solid var(--card-border);border-radius:9px;overflow:hidden;width:100%;margin:4px 0}
.table-head{display:grid;grid-template-columns:0.85fr 0.58fr 0.58fr 0.4fr 0.5fr 0.85fr 0.25fr 0.25fr;gap:0;background:var(--bg-soft);font-size:7.5px;font-weight:800;padding:6px 2px;text-align:center;color:var(--text-soft);border-bottom:1px solid var(--card-border);}
.row-item{display:grid;grid-template-columns:0.85fr 0.58fr 0.58fr 0.4fr 0.5fr 0.85fr 0.25fr 0.25fr;gap:0;align-items:center;padding:4px 1px;border-bottom:1px solid var(--bg-soft);background:var(--card)}
.row-item.done{border-right:2px solid var(--hero)}
.clear-btn{border:none;background:#FFF1F2;color:#ef4444;width:18px;height:18px;border-radius:5px;font-size:9px;cursor:pointer;border:1px solid #FECDD3;display:flex;align-items:center;justify-content:center}

/* تنسيق المهام داخل الـ View */
.nu-scroll::-webkit-scrollbar{width:0;display:none}
.nu-scroll{scrollbar-width:none}
.top-bar{background:var(--card);border-bottom:1.5px solid var(--card-border);padding:10px 12px;display:flex;gap:8px;align-items:center}
.search-input{flex:1;border:1.5px solid var(--card-border);background:var(--bg-soft);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:700;color:var(--text);outline:none;min-width:0}
.btn-add{background:var(--hero);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap}
.btn-icon{border:1.5px solid var(--card-border);background:var(--card);border-radius:10px;padding:8px 12px;font-size:11px;font-weight:800;color:var(--text);cursor:pointer}
.filter-row{display:flex;gap:6px;overflow:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--card-border);scrollbar-width:none}
.filter-chip{padding:7px 13px;border-radius:99px;border:1.5px solid var(--card-border);background:var(--card);font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap;color:var(--text-soft);transition:.2s;flex-shrink:0}
.filter-chip.active{background:var(--hero);color:#fff;border-color:var(--hero)}
.filter-chip.hidden-active{background:#111;color:#fff;border-color:#111}
#board{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.task-outer{display:flex;gap:6px;align-items:stretch}
.task-card{flex:1;background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;padding:0;display:flex;align-items:center;cursor:pointer;position:relative;overflow:hidden;min-height:62px}
.task-progress-bg{position:absolute;top:0;right:0;bottom:0;pointer-events:none;transition:width .4s ease;z-index:0;background:var(--hero);opacity:.32}
.task-card-content{position:relative;z-index:1;display:flex;gap:10px;align-items:center;width:100%;padding:12px}
.task-info{flex:1;min-width:0}
.task-info b{display:block;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-info small{display:block;font-size:9px;color:var(--text-soft);margin-top:2px}
.task-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--card-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--card)}
.task-check.done{background:var(--hero);border-color:var(--hero);color:#fff}
.ext-del{width:40px;border-radius:12px;border:1.5px solid #FECDD3;background:#FFF1F2;color:#ef4444;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

#toastBox{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--card);border:1.5px solid var(--card-border);border-radius:10px;padding:8px 14px;font-size:11px;font-weight:800;box-shadow:0 10px 25px rgba(0,0,0,.15);pointer-events:auto}
</style>
</head>
<body data-theme="teal">
<div class="phone-shell">
  <div class="header">
    <div style="display:flex;gap:6px;align-items:center">
      <b style="font-size:12px">نظام عمر 🚀</b>
      <!-- علامة المزامنة الحية -->
      <div id="syncBadge" onclick="manualSync()" title="اضغط للمزامنة الفورية" style="display:flex;align-items:center;gap:3px;background:var(--bg-soft);padding:3px 7px;border-radius:99px;border:1.5px solid var(--card-border);cursor:pointer;font-size:7.5px;font-weight:900">
        <span id="syncDot">🟢</span>
        <span id="syncText">متزامن</span>
      </div>
    </div>
    <button onclick="toggleTheme()" style="border:1.5px solid var(--card-border);background:var(--bg-soft);border-radius:8px;padding:5px 10px;font-size:10px;cursor:pointer;font-weight:800">🎨 الثيم</button>
  </div>

  <div class="content">
    <!-- 1. تبويب اليومية -->
    <div id="view-daily" class="view active">
      <div class="app" style="max-width:100%;padding:0;width:100%">
        <div class="top"><h3 style="font-weight:900;font-size:11px">اليومية</h3><div id="today" style="font-size:8.5px;background:var(--hero);color:#fff;padding:3px 7px;border-radius:20px"></div></div>
        <div class="main-tabs">
          <button class="mtab active" data-t="expense" onclick="switchTab('expense')">مصروف</button>
          <button class="mtab" data-t="income" onclick="switchTab('income')">دخل</button>
          <button class="mtab" data-t="debt" onclick="switchTab('debt')">ديون</button>
          <button class="mtab" data-t="amanat" onclick="switchTab('amanat')">أمانات</button>
          <button class="mtab" data-t="total" onclick="switchTab('total')">الإجمالي</button>
          <button class="mtab" data-t="general" onclick="switchTab('general')">العام</button>
        </div>
        <div id="p-expense">
          <div class="month-nav"><button onclick="shiftMonth(-1)">‹</button><div class="month-label"><span id="ml-expense">—</span><small id="ml-expense-sub"></small></div><button onclick="shiftMonth(1)">›</button></div>
          <div class="stats" id="stats-expense"></div>
          <div class="fixed-box" id="fixedBox">
            <div class="fixed-head" onclick="toggleFixedBox()">
              <div style="display:flex;align-items:center;gap:6px">
                <b style="font-size:9px;font-weight:900">📌 إجمالي المصروفات الثابتة</b>
                <span id="fixedTotalBadge" style="background:var(--hero);color:#fff;padding:2px 6px;border-radius:20px;font-size:7.5px;font-weight:900">0</span>
              </div>
              <span id="fixedArrow" style="font-size:10px">▼</span>
            </div>
            <div class="fixed-body" id="fixedBody"></div>
          </div>
          <div class="fbar"><input id="f-exp-q" placeholder="بند" oninput="renderSimple('expense')"><select id="f-exp-w" onchange="renderSimple('expense')"><option value="">محفظة</option></select><input id="f-exp-from" type="date" onchange="renderSimple('expense')"><input id="f-exp-to" type="date" onchange="renderSimple('expense')"><button class="qbtn active" onclick="setDayFilter('expense','month')">شهر</button><button class="qbtn" onclick="setDayFilter('expense','all')">كل</button></div>
          <div id="t-expense"></div>

<script>
// --- إعدادات المزامنة الشاملة لجميع الأقسام ---
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz3TyAm_BWEzlgEcqjqYA6SaBMjoLzN3j51Ewb9vp6UZNL8yJespFDUKQxWA5IOvrvW/exec';

function safeParse(k,f){try{let v=localStorage.getItem(k);if(!v||v==='undefined'||v==='null')return f;let p=JSON.parse(v);return p==null?f:p;}catch(e){return f;}}
function toast(m,t='ok'){let b=document.getElementById('toastBox');let el=document.createElement('div');el.className='toast';el.textContent=m;b.appendChild(el);setTimeout(()=>el.remove(),2200);}

function updateSyncStatus(txt, cls){
  let dot = document.getElementById('syncDot');
  let txtEl = document.getElementById('syncText');
  if(!dot || !txtEl) return;
  if(txt.includes('رفع') || txt.includes('تحميل')){ dot.textContent='⏳'; txtEl.textContent=txt; }
  else if(txt.includes('متزامن') || txt.includes('متصل')){ dot.textContent='🟢'; txtEl.textContent='متزامن'; }
  else { dot.textContent='⚠️'; txtEl.textContent='أوفلاين'; }
}

function switchView(name, btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

function toggleTheme(){
  let next = document.body.dataset.theme === 'teal' ? 'dark' : 'teal';
  document.body.dataset.theme = next;
  localStorage.setItem('omar_theme', next);
}
document.body.dataset.theme = localStorage.getItem('omar_theme') || 'teal';

// --- محرك الحفظ والمزامنة الموحد ---
let _syncTimer = null;
function triggerSave(){
  if(_syncTimer) clearTimeout(_syncTimer);
  updateSyncStatus('جاري الحفظ...');
  _syncTimer = setTimeout(async ()=>{
    updateSyncStatus('جاري الرفع...');
    try{
      let allData = {
        daily: safeParse('omar_tx_v3', []),
        tasks: safeParse('omar_tasks_v1', []),
        cats: safeParse('omar_cats_v1', []),
        attendance: safeParse('att_fixed_final', {}),
        hols: safeParse('att_hols_fixed', {}),
        notes: safeParse('att_notes', {}),
        masterBands: safeParse('omar_master_bands', []),
        wallets: safeParse('omar_wallets_v3', []),
        fixedTemplates: safeParse('omar_fixed_templates', []),
        fixedByMonth: safeParse('omar_fixed_by_month', {}),
        fixedSaved: safeParse('omar_fixed_saved', {}),
        timestamp: new Date().toISOString()
      };
      await fetch(SCRIPT_URL, {
        method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify({ fileName: "all_project_data.json", content: allData })
      });
      updateSyncStatus('متزامن');
    }catch(e){
      updateSyncStatus('أوفلاين');
    }
  }, 1000);
}

async function manualSync(){
  toast('🔄 جاري سحب البيانات من الدرايف...');
  updateSyncStatus('تحميل...');
  try{
    let res = await fetch(SCRIPT_URL + '?fileName=all_project_data.json&t=' + Date.now());
    let json = await res.json();
    let data = json.data?.content || json.content || json.data || json;
    if(data && typeof data === 'object'){
      if(data.daily) localStorage.setItem('omar_tx_v3', JSON.stringify(data.daily));
      if(data.tasks) localStorage.setItem('omar_tasks_v1', JSON.stringify(data.tasks));
      if(data.cats) localStorage.setItem('omar_cats_v1', JSON.stringify(data.cats));
      if(data.attendance) localStorage.setItem('att_fixed_final', JSON.stringify(data.attendance));
      if(data.hols) localStorage.setItem('att_hols_fixed', JSON.stringify(data.hols));
      if(data.notes) localStorage.setItem('att_notes', JSON.stringify(data.notes));
      if(data.masterBands) localStorage.setItem('omar_master_bands', JSON.stringify(data.masterBands));
      if(data.wallets) localStorage.setItem('omar_wallets_v3', JSON.stringify(data.wallets));
      
      initAllModules();
      toast('تمت المزامنة بنجاح ✅');

function toggleTaskDone(id){let t=tasks.find(x=>x.id===id);if(t){t.done=!t.done;localStorage.setItem('omar_tasks_v1',JSON.stringify(tasks));triggerSave();renderTasks();}}
function deleteTask(id){tasks=tasks.filter(x=>x.id!==id);localStorage.setItem('omar_tasks_v1',JSON.stringify(tasks));triggerSave();renderTasks();}
function openTaskModal(){document.getElementById('taskModal').style.display='flex';}
function closeTaskModal(){document.getElementById('taskModal').style.display='none';}
function addSub(){let inp=document.getElementById('newSub');if(!inp.value.trim())return;inp.value='';}
function saveTaskPro(){
  let title=document.getElementById('mTitle').value.trim();if(!title)return;
  tasks.unshift({id:Date.now().toString(),text:title,cat:cats[0]?.name||'عام',done:false,subs:[]});
  localStorage.setItem('omar_tasks_v1',JSON.stringify(tasks));triggerSave();closeTaskModal();renderTasks();
}
