<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="screen-orientation" content="portrait">
<title>يومياتي - صيدلية</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;font-family:'Cairo',sans-serif}
  body{margin:0;background:#f1f5f9}
  .app{max-width:420px;margin:auto;background:#fff;min-height:100vh;padding-bottom:90px}
  header{background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:10px 14px;height:52px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 18px 18px;position:sticky;top:0;z-index:50}
  header h1{margin:0;font-size:16px;font-weight:900} header small{font-size:10px;opacity:.9}
  .tab{display:none;padding:10px}.tab.active{display:block}
  .pills{display:flex;background:#f1f5f9;padding:4px;border-radius:99px;margin-bottom:10px;gap:4px}
  .pill{flex:1;border:0;padding:8px;border-radius:99px;cursor:pointer;font-size:12px;color:#64748b;background:transparent}
  .pill.active{background:#fff;font-weight:800;color:#047857;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  input,select{border:1px solid #e2e8f0;border-radius:10px;padding:8px;flex:1;font-size:12px;outline:none;background:#f8fafc;color:#000}
  nav{position:fixed;bottom:0;max-width:420px;width:100%;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:6px 0 8px;z-index:100}
  .nav-btn{border:0;background:none;font-size:10px;cursor:pointer;color:#94a3b8;flex:1}
  .nav-btn.active{color:#10b981;font-weight:800}
  .hidden{display:none!important}
  @media (orientation:landscape){.app{max-width:420px;margin:auto}}
</style>
</head>
<body>
<div class="app">
  <header><h1>💼 يومياتي</h1><small id="date"></small></header>
  <main>
    <section id="tab-home" class="tab active"></section>
    <section id="tab-daily" class="tab">
      <div class="pills">
        <button onclick="setDaily('income')" id="p-income" class="pill active">الدخل</button>
        <button onclick="setDaily('exp')" id="p-exp" class="pill">المصاريف</button>
        <button onclick="setDaily('debt')" id="p-debt" class="pill">الديون</button>
      </div>
      <div id="daily-income"></div><div id="daily-exp" class="hidden"></div><div id="daily-debt" class="hidden"></div>
    </section>
    <section id="tab-att" class="tab"></section>
    <section id="tab-notes" class="tab"></section>
    <section id="tab-tasks" class="tab"></section>
  </main>
  <nav>
    <button onclick="openTab(event,'home')" class="nav-btn active">🏠<br>الرئيسية</button>
    <button onclick="openTab(event,'daily')" class="nav-btn">💰<br>اليومية</button>
    <button onclick="openTab(event,'att')" class="nav-btn">⏰<br>الحضور</button>
    <button onclick="openTab(event,'notes')" class="nav-btn">📝<br>ملاحظات</button>
    <button onclick="openTab(event,'tasks')" class="nav-btn">✅<br>مهام</button>
  </nav>
</div>
<script>
// قفل التدوير نهائي في APK
if(screen.orientation && screen.orientation.lock){ try{screen.orientation.lock('portrait').catch(()=>{})}catch(e){} }

function openTab(e,name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  e.currentTarget.classList.add('active');
  if(name==='home') renderDashboard();
  if(name==='daily') renderDailyAll();
  if(name==='att') renderAtt();
}
function setDaily(type){
  document.getElementById('daily-income').classList.add('hidden');
  document.getElementById('daily-exp').classList.add('hidden');
  document.getElementById('daily-debt').classList.add('hidden');
  document.getElementById('daily-'+type).classList.remove('hidden');
  document.querySelectorAll('.pills .pill').forEach(p=>p.classList.remove('active'));
  document.getElementById('p-'+type).classList.add('active');
  if(type==='income') renderIncome();
  if(type==='exp') renderExp();
  if(type==='debt') renderDebt();
}
document.getElementById('date').innerText = new Date().toLocaleDateString('ar-EG',{weekday:'long', day:'numeric', month:'long'});
</script>
<script src="js/dashboard.js"></script>
<script src="js/daily.js"></script>
<script src="js/attendance.js"></script>
<script src="js/notes.js"></script>
<script src="js/tasks.js"></script>
</body>
</html>
