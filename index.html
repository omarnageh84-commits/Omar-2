<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMAR</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
.h{height:50px;background:#15803D;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.page{display:none;padding:10px}
.page.on{display:block}
.card{background:#1A1A1A;border:1px solid #222;border-radius:12px;padding:10px;margin-bottom:8px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:60px;background:#151515;display:flex;border-top:1px solid #222}
.b{flex:1;text-align:center;padding-top:10px;color:#666;font-size:12px}
.b.on{color:#15803D}
.plus{flex:1;display:flex;justify-content:center}
.plus span{width:56px;height:56px;background:#15803D;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin-top:-20px;border:4px solid #000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;z-index:10}
.modal.on{display:flex;flex-direction:column}
.inp{width:100%;height:40px;background:#111;border:1px solid #333;border-radius:8px;color:#fff;margin-top:8px;padding:0 10px}
.btn{width:100%;height:40px;background:#15803D;border:0;border-radius:8px;color:#fff;margin-top:8px}
.item{padding:12px;border-bottom:1px solid #222}
</style>
</head>
<body>
<div class="h"><div>OMAR - <span id="bal">69050</span></div><div>EGP</div></div>

<div id="p1" class="page"><div id="l1">الدخل</div></div>
<div id="p2" class="page on"><div id="l2">المصروف</div></div>
<div id="p3" class="page"><div id="l3">الديون - الصيدلية مجمعة</div></div>
<div id="p4" class="page">
<table style="width:100%;border-collapse:collapse;font-size:11px"><tr><th style="border:1px solid #222;padding:6px;background:#111">الساعه</th><th style="border:1px solid #222;padding:6px;background:#111">المطلوب</th><th style="border:1px solid #222;padding:6px;background:#111">ديون صيدليه</th></tr><tr><td style="border:1px solid #222;padding:6px"><input id="inH" value="1100" style="width:60px;background:#000;color:#fff;border:1px solid #15803D"></td><td style="border:1px solid #222;padding:6px"><input id="inReq" value="15000" style="width:60px;background:#000;color:#fff;border:1px solid #15803D"></td><td style="border:1px solid #222;padding:6px" id="vPh">0</td></tr></table>
<table style="width:100%;border-collapse:collapse;font-size:11px;margin-top:10px"><tr><th style="border:1px solid #222;padding:6px;background:#111">يوم</th><th style="border:1px solid #222;padding:6px;background:#111">التاريخ</th><th style="border:1px solid #222;padding:6px;background:#111">حضور</th><th style="border:1px solid #222;padding:6px;background:#111">انصراف</th><th style="border:1px solid #222;padding:6px;background:#111">الصافي</th></tr><tbody id="attBody"></tbody></table>
</div>
<div id="p5" class="page"><div id="l5">ملاحظات</div></div>
<div id="p6" class="page"><div id="l6">اليومية</div></div>

<div class="bottom">
<div class="b" id="b1" onclick="go(1)">الدخل</div>
<div class="b on" id="b2" onclick="go(2)">المصروف</div>
<div class="b" id="b3" onclick="go(3)">الديون</div>
<div class="plus"><span onclick="openPlus()">+</span></div>
<div class="b" id="b4" onclick="go(4)">الحضور</div>
<div class="b" id="b5" onclick="go(5)">ملاحظات</div>
<div class="b" id="b6" onclick="go(6)">اليومية</div>
</div>

<div id="catBox" class="modal">
<div style="background:#222;padding:12px;display:flex;justify-content:space-between"><b>اختار بند - غسيل</b><span onclick="hideBox('catBox')">X</span></div>
<div style="padding:10px;background:#111;display:flex;gap:6px"><input id="newCat" class="inp" style="margin:0" placeholder="بند جديد غسيل"><button onclick="addCat()" style="background:#15803D;border:0;color:#fff;border-radius:8px;padding:0 12px">إضافة</button></div>
<div id="catList" style="flex:1;overflow:auto"></div>
</div>

<div id="addBox" class="modal">
<div style="background:#1E1E1E;margin:auto;width:90%;max-width:340px;border-radius:12px;padding:12px">
<div id="addTitle">إضافة</div>
<div id="addFields"></div>
<button class="btn" onclick="doSave()">حفظ</button>
<button class="btn" style="background:#333" onclick="hideBox('addBox')">إلغاء</button>
</div>
</div>

<script>
var cur=2;
var curCat='';
var cats=["غسيل","طعام وشراب","مواصلات","ديون الصيدلية"];
function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function go(n){
cur=n;
for(var i=1;i<=6;i++){
var p=document.getElementById('p'+i);
if(p) p.classList.remove('on');
var b=document.getElementById('b'+i);
if(b) b.classList.remove('on');
}
document.getElementById('p'+n).classList.add('on');
document.getElementById('b'+n).classList.add('on');
render();
}
function hideBox(id){document.getElementById(id).classList.remove('on')}
function openPlus(){
if(cur==1||cur==2){
document.getElementById('catBox').classList.add('on');
showCats();
return;
}
document.getElementById('addBox').classList.add('on');
buildForm();
}
function showCats(){
var h='';
for(var i=0;i<cats.length;i++){
h+='<div class="item" onclick="pickCat('+i+')">'+cats[i]+'</div>';
}
document.getElementById('catList').innerHTML=h;
}
function addCat(){
var v=document.getElementById('newCat').value;
if(!v) return;
cats.push(v);
document.getElementById('newCat').value='';
showCats();
}
function pickCat(i){
curCat=cats[i];
hideBox('catBox');
document.getElementById('addBox').classList.add('on');
buildForm();
}
function buildForm(){
var f='';
if(cur==1||cur==2){
document.getElementById('addTitle').innerText=curCat;
f='<input id="f1" class="inp" type="number" placeholder="المبلغ"><input id="f2" class="inp" placeholder="ملاحظة">';
}
if(cur==3){
document.getElementById('addTitle').innerText='دين الصيدلية';
f='<input id="f1" class="inp" placeholder="الصيدليه"><input id="f2" class="inp" type="number" placeholder="الإجمالي 1000"><input id="f3" class="inp" type="number" placeholder="المدفوع 300">';
}
if(cur==4){
document.getElementById('addTitle').innerText='حضور - اكتب 9 = 9ص 19=7م';
f='<input id="f1" class="inp" type="date"><input id="f2" class="inp" type="number" placeholder="حضور 9"><input id="f3" class="inp" type="number" placeholder="انصراف 17">';
}
document.getElementById('addFields').innerHTML=f;
if(cur==4) document.getElementById('f1').valueAsDate=new Date();
}
function doSave(){
if(cur==1||cur==2){
var arr=load('out');
var a=document.getElementById('f1').value;
arr.push({c:curCat,a:a});
save('out',arr);
}
if(cur==3){
var arr=load('debts');
var p=document.getElementById('f1').value||'الصيدليه';
var tot=document.getElementById('f2').value;
var paid=document.getElementById('f3').value;
arr.push({p:p,a:Number(tot),paid:Number(paid)});
save('debts',arr);
}
if(cur==4){
var arr=load('att');
var d=document.getElementById('f1').value;
var inN=document.getElementById('f2').value;
var outN=document.getElementById('f3').value;
function toT(v){var n=Number(v);if(isNaN(n)) return '-';var h=n;var pm=h>=12;if(h==0) h=12;if(h>12) h-=12;return h+':00 '+(pm?'م':'ص')}
arr.push({d:d,inN:inN,outN:outN,in:toT(inN),out:toT(outN),h:Math.abs(Number(outN)-Number(inN))});
save('att',arr);
}
hideBox('addBox');
render();
}
function render(){
var out=load('out');
var deb=load('debts');
var att=load('att');
var so=0;for(var i=0;i<out.length;i++) so+=Number(out[i].a||0);
document.getElementById('bal').innerText=69050-so;
var h='';for(var i=out.length-1;i>=0;i--) h+='<div class="card">'+out[i].c+' - '+out[i].a+'ج</div>';
document.getElementById('l2').innerHTML=h||'لا يوجد';
var grouped={};for(var i=0;i<deb.length;i++){var k=deb[i].p;if(!grouped[k]) grouped[k]={p:k,a:0,paid:0};grouped[k].a+=deb[i].a;grouped[k].paid+=deb[i].paid;}
var hh='';for(var k in grouped){var d=grouped[k];var rem=d.a-d.paid;hh+='<div class="card" style="border-right:4px solid #f87171"><b>'+d.p+'</b> علينا متبقي '+rem+'ج<div style="display:flex;gap:1px;margin-top:6px;background:#222"><div style="flex:1;background:#111;padding:4px;text-align:center">الإجمالي '+d.a+'ج</div><div style="flex:1;background:#111;padding:4px;text-align:center">المدفوع '+d.paid+'ج</div><div style="flex:1;background:#111;padding:4px;text-align:center">المتبقي '+rem+'ج</div></div></div>';}
document.getElementById('l3').innerHTML=hh||'الصيدليه 1000 - 300 = 700';
var pharm=0;for(var k in grouped) if(k.indexOf('صيد')>-1) pharm+=grouped[k].a-grouped[k].paid;
document.getElementById('vPh').innerText=pharm;
var body='';var now=new Date();var y=now.getFullYear(),m=now.getMonth();var days=new Date(y,m+1,0).getDate();
for(var d=1;d<=days;d++){var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');var f=null;for(var j=0;j<att.length;j++) if(att[j].d==ds) f=att[j];if(f) body+='<tr><td style="border:1px solid #222;padding:4px">'+d+'</td><td style="border:1px solid #222;padding:4px">'+ds+'</td><td style="border:1px solid #222;padding:4px">'+f.in+'</td><td style="border:1px solid #222;padding:4px">'+f.out+'</td><td style="border:1px solid #222;padding:4px">'+f.h+'</td></tr>';else body+='<tr><td style="border:1px solid #222;padding:4px">'+d+'</td><td style="border:1px solid #222;padding:4px">'+ds+'</td><td style="border:1px solid #222;padding:4px">-</td><td style="border:1px solid #222;padding:4px">-</td><td style="border:1px solid #222;padding:4px">-</td></tr>';}
document.getElementById('attBody').innerHTML=body;
}
render();
</script>
</body>
</html>
