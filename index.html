<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F766E">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon_192.png">
<link rel="icon" type="image/png" href="./icon_192.png">
<title>نظام عمر الشامل - المهام والحضور 🚀</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<!-- مكتبات Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<style>
:root{ --bg:#F0FDFA; --bg-soft:#CCFBF1; --card:#FFFFFF; --card-border:#5EEAD4; --text:#134E4A; --text-soft:#0D9488; --hero:#0F766E; --accent:#14B8A6; --nav-bg:rgba(255,255,255,0.92); }
[data-theme="dark"] {
  --bg: #020617; --bg-soft: #1E293B; --card: #0F172A; --card-border: #1E293B;
  --text: #F1F5F9; --text-soft: #94A3B8; --hero: #0F766E; --accent: #14B8A6; --nav-bg: rgba(15,23,42,0.92);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal','IBM Plex Sans Arabic',sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);display:block;position:relative;margin:0;padding:0}
.shell{width:100%;max-width:100%;height:100dvh;max-height:100dvh;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:none;border:none;border-radius:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
@media (min-width: 768px) { .shell { border-radius:0; border:none; max-width:100%; } }
.header{height:52px;background:var(--card);border-bottom:1.5px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;z-index:50}
.content{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;padding:8px;display:none;background:var(--bg);-webkit-overflow-scrolling:touch}
.view.active{display:flex}
.en{font-family:'JetBrains Mono',monospace!important;direction:ltr!important;text-align:center}
.nav{height:calc(65px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--nav-bg);backdrop-filter:blur(20px);border-top:1.5px solid var(--card-border);display:flex;align-items:center;padding-left:6px;padding-right:6px;gap:6px;flex-shrink:0;z-index:50}
.nav button{flex:1;height:100%;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;color:var(--text-soft);font-size:10px;font-weight:800;cursor:pointer}
.nav button.active{background:var(--hero);color:#fff}
#syncDot{font-size:10px} #syncText{font-size:9px;font-weight:900}
.sync-badge{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;border:1.5px solid var(--card-border);background:var(--card)}
.att-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0}
.att-stat{border-radius:10px;padding:6px 2px;border:1.5px solid var(--card-border);text-align:center;background:var(--card)}
.att-stat small{font-size:7px;font-weight:800;display:block;color:var(--text-soft);margin-bottom:2px}
.att-stat b,.att-stat input{font-size:10.5px!important;font-weight:900;color:var(--text)}
.time-box{width:92%;border:1px solid var(--card-border);border-radius:6px;padding:5px 1px;text-align:center;font-size:10px;background:var(--bg);color:var(--text);font-weight:800;outline:none}
.time-box.filled{background:var(--hero)!important;color:#fff!important;border-color:var(--hero)!important}
.time-box.half{background:var(--bg-soft)!important;color:var(--hero)!important}
.note-box{width:94%;border:1px dashed var(--card-border);border-radius:6px;padding:4px 2px;font-size:8.5px;background:var(--bg);color:var(--text);text-align:center;outline:none}
.table-wrap{background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;overflow-y:auto;max-height:calc(100dvh - 260px);width:100%;margin:6px 0;-webkit-overflow-scrolling:touch}
.table-head{display:grid;grid-template-columns:0.85fr 0.6fr 0.6fr 0.4fr 0.5fr 0.85fr 0.25fr 0.25fr;gap:0;background:var(--bg-soft);font-size:8px;font-weight:900;padding:7px 2px;text-align:center;color:var(--text-soft);border-bottom:1.5px solid var(--card-border);position:sticky;top:0;z-index:10}
.row-item{display:grid;grid-template-columns:0.85fr 0.6fr 0.6fr 0.4fr 0.5fr 0.85fr 0.25fr 0.25fr;gap:0;align-items:center;padding:5px 1px;border-bottom:1px solid var(--bg-soft);background:var(--card)}
.row-item.done{border-right:3px solid var(--hero)}
.clear-btn{border:none;background:#FFF1F2;color:#ef4444;width:18px;height:18px;border-radius:5px;font-size:9px;cursor:pointer;border:1px solid #FECDD3;display:flex;align-items:center;justify-content:center}
.filter-chip{padding:7px 13px;border-radius:99px;border:1.5px solid var(--card-border);background:var(--card);font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap;color:var(--text-soft);flex-shrink:0}
.filter-chip.active{background:var(--hero);color:#fff;border-color:var(--hero)}
.filter-chip.hidden-active{background:#111;color:#fff;border-color:#111}
.task-outer{display:flex;gap:6px;align-items:stretch;margin-bottom:6px}
.task-card{flex:1;background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;padding:0;display:flex;align-items:center;cursor:pointer;position:relative;overflow:hidden;min-height:62px}
.task-progress-bg{position:absolute;top:0;right:0;bottom:0;pointer-events:none;z-index:0;background:var(--hero);opacity:.32}
.task-card-content{position:relative;z-index:1;display:flex;gap:10px;align-items:center;width:100%;padding:12px}
.task-info{flex:1;min-width:0}
.task-info b{display:block;font-size:12px;font-weight:800}
.task-info small{display:block;font-size:9px;color:var(--text-soft);margin-top:2px}
.task-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--card-border);display:flex;align-items:center;justify-content:center;background:var(--card);flex-shrink:0}
.task-check.done{background:var(--hero);border-color:var(--hero);color:#fff}
.ext-del{width:40px;border-radius:12px;border:1.5px solid #FECDD3;background:#FFF1F2;color:#ef4444;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#taskModal{display:none;position:fixed;inset:0;background:var(--bg);z-index:9999;flex-direction:column;width:100%;height:100%;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#taskModal.show{display:flex}
.pro-header{padding:12px;background:var(--card);border-bottom:1.5px solid var(--card-border);display:flex;align-items:center;gap:10px}
.pro-title-input{flex:1;border:none;outline:none;background:transparent;font-size:16px;font-weight:900;color:var(--text);width:100%}
.pro-close{width:36px;height:36px;border-radius:10px;background:var(--bg-soft);border:1.5px solid var(--card-border);color:var(--text);font-size:16px;cursor:pointer;flex-shrink:0}
.pro-meta{background:var(--card);padding:10px 12px;display:flex;gap:8px;border-bottom:1px solid var(--card-border);flex-wrap:wrap}
.pro-select{flex:1;min-width:110px;border:1.5px solid var(--card-border);background:var(--bg-soft);border-radius:10px;padding:9px 10px;font-size:11px;font-weight:700;color:var(--text);outline:none}
.pro-segment{display:flex;gap:4px;background:var(--bg-soft);padding:5px;border-radius:12px;margin:10px 12px;border:1.5px solid var(--card-border);overflow:auto}
.pro-seg-btn{flex:1;padding:9px 6px;border:none;border-radius:9px;background:transparent;font-size:9.5px;font-weight:800;color:var(--text-soft);cursor:pointer;white-space:nowrap;min-width:70px}
.pro-seg-btn.active{background:var(--card);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.08);border:1.5px solid var(--card-border)}
.pane{display:none;flex:1;flex-direction:column;padding:12px;overflow:auto;gap:10px;background:var(--bg);-webkit-overflow-scrolling:touch}
.pane.active{display:flex}
.card{background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;padding:12px}
.input-pro{width:100%;border:1.5px solid var(--card-border);border-radius:10px;padding:10px;background:var(--bg-soft);color:var(--text);font-size:12px;font-weight:600;outline:none}
#toastBox{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:11px;font-weight:800;pointer-events:auto}
</style>
</head>
<body data-theme="teal">
<div class="shell">
  <div class="header">
    <div style="display:flex;gap:6px;align-items:center">
      <b style="font-size:12px">نظام عمر 🚀</b>
      <div class="sync-badge">
        <span id="syncDot">🟢</span>
        <span id="syncText">متصل بالسحاب</span>
      </div>
    </div>
    <button onclick="toggleTheme()" style="border:1.5px solid var(--card-border);background:var(--bg-soft);border-radius:8px;padding:5px 10px;font-size:10px;cursor:pointer;font-weight:800">🎨 الثيم</button>
  </div>

  <div class="content">
    <!-- تبويب المهام -->
    <div id="view-tasks" class="view active">
      <div style="background:var(--card);border-bottom:1.5px solid var(--card-border);padding:10px;display:flex;gap:8px;align-items:center">
        <input id="taskSearch" placeholder="اكتب مهمة جديدة أو كود المخفي واضغط Enter..." style="flex:1;border:1.5px solid var(--card-border);background:var(--bg-soft);border-radius:10px;padding:10px;font-size:12px;font-weight:700;color:var(--text);outline:none" oninput="handleTaskSearchInput(this.value)" onkeydown="if(event.key==='Enter') quickAddTask(this.value)">
        <button onclick="quickAddTask(document.getElementById('taskSearch').value)" style="background:var(--hero);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:11px;font-weight:900">+ إضافة</button>
        <button onclick="openManager()" style="border:1.5px solid var(--card-border);background:var(--card);border-radius:10px;padding:8px 12px;font-size:11px;font-weight:800;color:var(--text);cursor:pointer">⚙️</button>
      </div>
      <div id="filterRow" style="display:flex;gap:6px;overflow:auto;padding:8px;background:var(--card);border-bottom:1px solid var(--card-border);scrollbar-width:none"></div>
      <div id="board" style="flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch"></div>
    </div>

    <!-- تبويب الحضور -->
    <div id="view-att" class="view">
      <div id="frozenTop" style="position:sticky;top:0;z-index:30;background:var(--bg);padding:4px 6px">
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;margin-bottom:4px">
          <div style="display:flex;gap:4px;align-items:center">
            <div id="clock" class="en" style="font-size:8px;background:var(--bg-soft);padding:2px 6px;border-radius:999px">00:00:00</div>
          </div>
          <div style="display:flex;gap:3px;align-items:center">
            <button onclick="changeMonth(-1)" style="background:var(--card);border:1px solid var(--card-border);width:22px;height:22px;border-radius:6px;font-weight:900">‹</button>
            <div id="monthLabel" class="en" style="font-size:9px;background:var(--hero);color:#fff;padding:2px 8px;border-radius:999px;font-weight:900">9 / 2026</div>
            <button onclick="changeMonth(1)" style="background:var(--card);border:1px solid var(--card-border);width:22px;height:22px;border-radius:6px;font-weight:900">›</button>
            <div style="font-size:9px;font-weight:900;margin-right:6px">⏱️ الحضور</div>
            <button onclick="toggleAttStats()" id="attStatsArrow" style="background:var(--card);border:1.5px solid var(--card-border);width:22px;height:22px;border-radius:6px;font-weight:900;cursor:pointer">▼</button>
          </div>
        </div>
        <div id="attStatsBody" class="att-stats">
          <div class="att-stat"><small>سعر الساعة</small><b id="outPrice" class="en">0</b></div>
          <div class="att-stat"><small>الساعة</small><input id="v1" type="text" inputmode="decimal" class="en" value="1,200" onfocus="this.select()" oninput="calcTotals()" style="width:100%;border:none;background:transparent;text-align:center;outline:none"></div>
          <div class="att-stat"><small>كم يوم</small><input id="v2" type="text" inputmode="numeric" class="en" value="26" onfocus="this.select()" oninput="calcTotals()" style="width:100%;border:none;background:transparent;text-align:center;outline:none"></div>
          <div class="att-stat"><small>عدد الساعات</small><b id="outTotal" class="en">0</b></div>
          <div class="att-stat"><small>الصافي</small><b id="outSafi" class="en">0</b></div>
          <div class="att-stat"><small>الديون</small><input id="v4" type="text" inputmode="decimal" class="en" value="0" onfocus="this.select()" oninput="calcTotals()" style="width:100%;border:none;background:transparent;text-align:center;outline:none"></div>
          <div class="att-stat"><small>المطلوب</small><input id="v3" type="text" inputmode="decimal" class="en" value="15,000" onfocus="this.select()" oninput="calcTotals()" style="width:100%;border:none;background:transparent;text-align:center;outline:none"></div>
          <div class="att-stat"><small>المطلوب يومياً</small><b id="outDaily" class="en">0</b></div>
        </div>
      </div>
      
      <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:var(--card);border:1.5px solid var(--card-border);border-radius:10px;margin-bottom:4px">
        <b style="font-size:10px">📅 أيام الشهر والدوام</b>
        <button onclick="toggleAttDays()" id="attDaysArrow" style="background:var(--bg-soft);border:1px solid var(--card-border);width:22px;height:22px;border-radius:6px;font-weight:900;cursor:pointer">▼</button>
      </div>

      <div id="attDaysBody" class="table-wrap">
        <div class="table-head"><div>اليوم</div><div>دخول</div><div>خروج</div><div>س</div><div>ج</div><div>ملاحظة</div><div>أ</div><div>✕</div></div>
        <div id="attListRows"></div>
      </div>
    </div>
  </div>

  <nav class="nav">
    <button class="active" onclick="switchView('tasks',this)"><span style="font-size:16px">✓</span><span>المهام</span></button>
    <button onclick="switchView('att',this)"><span style="font-size:16px">⏱️</span><span>الحضور</span></button>
  </nav>
</div>

<!-- مودال تفاصيل المهمة -->
<div id="taskModal">
  <div class="pro-header">
    <input id="mTitle" class="pro-title-input" placeholder="عنوان المهمة...">
    <button class="pro-close" onclick="closeTaskModal()">✕</button>
  </div>
  <div class="pro-meta">
    <select id="mCat" class="pro-select"></select>
    <select id="mPri" class="pro-select"><option value="عادي">⚪ عادي</option><option value="متوسط">🟡 متوسط</option><option value="مهم">🔴 مهم</option></select>
    <input id="mColor" type="color" value="#16A34A" style="width:44px;height:38px;border-radius:10px;border:1.5px solid var(--card-border);padding:2px;background:var(--card)">
    <input id="mDate" type="date" class="pro-select" style="max-width:140px">
  </div>
  <div class="pro-segment">
    <button class="pro-seg-btn active" onclick="switchPane('sub',this)">📋 فرعية</button>
    <button class="pro-seg-btn" onclick="switchPane('notes',this)">📌 ملاحظات</button>
  </div>
  <div id="pane-sub" class="pane active">
    <div id="subList" style="display:flex;flex-direction:column;gap:6px"></div>
    <div style="display:flex;gap:6px"><input id="newSub" class="input-pro" placeholder="مهمة فرعية جديدة... Enter للإضافة" onkeydown="if(event.key==='Enter') addSub()" style="flex:1"><button onclick="addSub()" style="background:var(--hero);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:900">+</button></div>
    <button onclick="saveProTask()" style="margin-top:10px;background:var(--hero);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:900">💾 حفظ</button>
  </div>
  <div id="pane-notes" class="pane">
    <div id="richEditor" class="input-pro" contenteditable="true" style="min-height:220px;outline:none" placeholder="اكتب ملاحظاتك هنا..."></div>
    <button onclick="saveProTask()" style="background:var(--hero);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:900;margin-top:6px">💾 حفظ الملاحظات</button>
  </div>
</div>

<!-- مودال إدارة الفئات -->
<div id="managerModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;align-items:center;justify-content:center;padding:14px">
  <div style="background:var(--card);width:100%;max-width:380px;border-radius:16px;padding:14px;border:1.5px solid var(--card-border)">
    <div style="display:flex;justify-content:space-between;margin-bottom:12px"><b style="font-size:13px">إدارة التبويبات والفئات</b><button onclick="closeManager()" style="border:none;background:var(--bg-soft);width:30px;height:30px;border-radius:8px">✕</button></div>
    <div style="display:flex;gap:6px;margin-bottom:10px">
      <input id="newCatEmoji" placeholder="📌" style="width:50px" class="input-pro">
      <input id="newCatName" placeholder="اسم التبويب الجديد" class="input-pro" style="flex:1">
      <button onclick="addCategory()" style="background:var(--hero);color:#fff;border:none;border-radius:10px;padding:9px 14px">+</button>
    </div>
    <div id="catList" style="max-height:200px;overflow:auto;display:flex;flex-direction:column;gap:6px"></div>
  </div>
</div>

<div id="toastBox"></div>

<script>
// --- إعدادات واتصال Firebase الخاص بك ---
const firebaseConfig = {
  apiKey: "AIzaSyAl2nCMz56r11jbG8E2Rx5na3CvH03ZAmk",
  authDomain: "omarsystem.firebaseapp.com",
  databaseURL: "https://omarsystem-default-rtdb.firebaseio.com",
  projectId: "omarsystem",
  storageBucket: "omarsystem.firebasestorage.app",
  messagingSenderId: "956044499807",
  appId: "1:956044499807:web:90472b0adedc34f096f4ea"
};

firebase.initializeApp(firebaseConfig);
const dbRef = firebase.database().ref('omar_system_data');

let isRemoteUpdating = false;

// الاستماع للتغييرات من السحاب وتحديث الشاشة تلقائياً
dbRef.on('value', (snapshot) => {
  let data = snapshot.val();
  if (data) {
    isRemoteUpdating = true;
    if(data.tasks) localStorage.setItem('omar_tasks_v1', JSON.stringify(data.tasks));
    if(data.cats) localStorage.setItem('omar_cats_v1', JSON.stringify(data.cats));
    if(data.attendance) localStorage.setItem('att_fixed_final', JSON.stringify(data.attendance));
    if(data.hols) localStorage.setItem('att_hols_fixed', JSON.stringify(data.hols));
    if(data.notes) localStorage.setItem('att_notes', JSON.stringify(data.notes));
    if(window.renderAll) window.renderAll();
    isRemoteUpdating = false;
  }
});

// رفع التعديلات للسحاب فوراً
function saveToCloud() {
  if (isRemoteUpdating) return;
  let dataToSave = {
    tasks: safeParse('omar_tasks_v1', []),
    cats: safeParse('omar_cats_v1', []),
    attendance: safeParse('att_fixed_final', {}),
    hols: safeParse('att_hols_fixed', {}),
    notes: safeParse('att_notes', {})
  };
  dbRef.set(dataToSave).then(() => {
    showToast('☁️ تم المزامنة تلقائياً');
  });
}

function switchView(name, btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(name==='att') renderAttendance();
}

function toggleTheme(){
  let next = document.body.dataset.theme === 'teal' ? 'dark' : 'teal';
  document.body.dataset.theme = next;
  localStorage.setItem('omar_theme', next);
}
document.body.dataset.theme = localStorage.getItem('omar_theme') || 'teal';

function safeParse(k,f){try{let v=localStorage.getItem(k);if(!v||v==='undefined'||v==='null')return f;let p=JSON.parse(v);return p==null?f:p;}catch(e){return f;}}
function showToast(m){let b=document.getElementById('toastBox');if(!b)return;let el=document.createElement('div');el.className='toast';el.textContent=m;b.appendChild(el);setTimeout(()=>el.remove(),2000);}

// الحضور
let attY=new Date().getFullYear(), attM=new Date().getMonth();
let attStatsOpen = true, attDaysOpen = true;

function toggleAttStats(){ attStatsOpen = !attStatsOpen; document.getElementById('attStatsBody').style.display = attStatsOpen ? 'grid' : 'none'; document.getElementById('attStatsArrow').textContent = attStatsOpen ? '▼' : '▲'; }
function toggleAttDays(){ attDaysOpen = !attDaysOpen; document.getElementById('attDaysBody').style.display = attDaysOpen ? 'block' : 'none'; document.getElementById('attDaysArrow').textContent = attDaysOpen ? '▼' : '▲'; }

function toEn(s){ return (s+'').replace(/[٠-٩]/g,d=> '0123456789'['٠١٢٣٤٥٦٧٨٩'.indexOf(d)] ).replace(/[^0-9:.,-]/g,''); }
function parseNumber(s){ let cleaned=toEn(s||'').replace(/,/g,'').trim(); if(!cleaned) return 0; let n=parseFloat(cleaned); return isNaN(n)?0:n; }

function calcDiff(a, b) {
  if (!a && a !== 0) return 0;
  let parseTime = t => {
    let s = (t + '').trim();
    if (s === '') return 0;
    if (s.includes('.')) { let parts = s.split('.'); return (parseFloat(parts[0])||0) + (parseFloat('0.'+(parts[1]||'0'))||0)*0.6; }
    let parts = s.split(':'); return (parseFloat(parts[0])||0) + (parseFloat(parts[1])||0)/60;
  };
  let diff = parseTime(b) - parseTime(a);
  if (diff < 0) diff += 24;
  return diff;
}

function changeMonth(d){ attM+=d; if(attM>11){attM=0;attY++;} if(attM<0){attM=11;attY--;} renderAttendance(); }

function renderAttendance(){
  let lbl = document.getElementById('monthLabel');
  if(lbl) lbl.textContent=(attM+1)+' / '+attY;
  let dim=new Date(attY,attM+1,0).getDate();
  let v1tmp=parseNumber(document.getElementById('v1')?.value); 
  let v2tmp=parseNumber(document.getElementById('v2')?.value)||1; 
  let price=v2tmp? v1tmp/v2tmp : 0;
  
  let dbAtt = safeParse('att_fixed_final', {});
  let dbHols = safeParse('att_hols_fixed', {});
  let dbNotes = safeParse('att_notes', {});

  let html=''; let totalH=0; let daysWorked=0;
  for(let i=1;i<=dim;i++){
    let key=`${attY}-${attM+1}-${i}`;
    let rec=dbAtt[key]||{in:'',out:''};
    let isHol=dbHols[key];
    let hours=calcDiff(rec.in,rec.out);
    if(hours>0 && !isHol){ totalH+=hours; daysWorked++; }
    let dayAr=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'][new Date(attY,attM,i).getDay()];
    let noteVal=dbNotes[key]||'';
    let isDone=(rec.in!=='' && rec.out!=='' && !isHol);
    let dailyMoney = hours && price ? Math.round(hours*price) : 0;
    
    html+=`<div class="row-item ${isDone?'done':''}">
      <div style="font-size:8px;font-weight:900;white-space:nowrap">${dayAr} <span class="en" style="font-size:6.5px;color:var(--text-soft)">(${i})</span></div>
      <input type="text" inputmode="decimal" class="time-box en in-box ${rec.in!==''?(isDone?'filled':'half'):''}" value="${rec.in||''}" placeholder="7" ${isHol?'disabled':''} onblur="saveAtt('${key}','in',this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault(); this.parentElement.querySelector('.out-box')?.focus();}">
      <input type="text" inputmode="decimal" class="time-box en out-box ${rec.out!==''?(isDone?'filled':'half'):''}" value="${rec.out||''}" placeholder="19" ${isHol?'disabled':''} onblur="saveAtt('${key}','out',this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault(); this.parentElement.querySelector('.note-box')?.focus();}">
      <div class="en" style="font-size:8px;font-weight:900">${isHol?'-':hours?hours.toFixed(2):'-'}</div>
      <div class="en" style="font-size:7.5px;font-weight:900">${isHol?'-':dailyMoney?dailyMoney.toLocaleString('en-US'):'-'}</div>
      <input type="text" class="note-box" value="${noteVal}" onblur="saveNote('${key}',this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault(); this.parentElement.nextElementSibling?.querySelector('.in-box')?.focus();}">
      <button onclick="toggleHol('${key}')" style="border:none;background:${isHol?'var(--hero)':'var(--bg-soft)'};width:18px;height:18px;border-radius:4px;font-size:8px;color:${isHol?'#fff':'var(--text-soft)'};border:1.5px solid var(--card-border)">${isHol?'✓':'○'}</button>
      <button class="clear-btn" onclick="clearDay('${key}')">✕</button>
    </div>`;
  }
  document.getElementById('attListRows').innerHTML=html;
  document.getElementById('outPrice').innerText=price?price.toFixed(2):'0';
  document.getElementById('outTotal').innerText=totalH.toFixed(2);
  let safi=(totalH*price)-parseNumber(document.getElementById('v4')?.value);
  document.getElementById('outSafi').innerText=Math.round(safi).toLocaleString('en-US');
  let rem = (parseNumber(document.getElementById('v3')?.value)||0) - (totalH*price);
  let remDays = v2tmp - daysWorked;
  document.getElementById('outDaily').innerText = remDays>0 ? Math.round(rem/remDays).toLocaleString('en-US') : '0';
}

function saveAtt(k,t,val){
  let d=safeParse('att_fixed_final',{}); if(!d[k])d[k]={in:'',out:''}; d[k][t]=val;
  localStorage.setItem('att_fixed_final',JSON.stringify(d));
  saveToCloud(); renderAttendance();
}
function saveNote(k,val){
  let n=safeParse('att_notes',{}); n[k]=val;
  localStorage.setItem('att_notes',JSON.stringify(n));
  saveToCloud();
}
function toggleHol(k){
  let h=safeParse('att_hols_fixed',{}); if(h[k]) delete h[k]; else h[k]=true;
  localStorage.setItem('att_hols_fixed',JSON.stringify(h));
  saveToCloud(); renderAttendance();
}
function clearDay(k){
  let d=safeParse('att_fixed_final',{}); if(d[k]) d[k]={in:'',out:''};
  localStorage.setItem('att_fixed_final',JSON.stringify(d));
  saveToCloud(); renderAttendance();
}

// المهام
let tasks=safeParse('omar_tasks_v1',[]);
let cats=safeParse('omar_cats_v1',[{id:1,emoji:'📌',name:'عام'},{id:2,emoji:'🏠',name:'البيت'},{id:3,emoji:'💼',name:'الشغل'}]);
let curFilter='الكل', hiddenVisible=false, editingTaskId=null, curSubs=[];

function renderTasks(){
  let board=document.getElementById('board');
  let q=(document.getElementById('taskSearch')?.value||'').toLowerCase();
  let list=[...tasks];
  
  if(curFilter==='الكل') list=list.filter(t=>(t.cat||'').trim()!=='مخفي');
  else if(curFilter==='مخفي') list=list.filter(t=>(t.cat||'').trim()==='مخفي');
  else list=list.filter(t=>(t.cat||'').trim()===curFilter.trim());
  
  board.innerHTML=list.map(t=>{
    let prog = t.subs?.length ? Math.round(t.subs.filter(s=>s.done).length/t.subs.length*100) : (t.done?100:0);
    return `<div class="task-outer">
      <div class="task-card" onclick="openTaskModal('${t.id}')">
        <div class="task-progress-bg" style="width:${prog}%;background:${t.color||'var(--hero)'}"></div>
        <div class="task-card-content">
          <div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--bg-soft);border:1.5px solid var(--card-border)">📌</div>
          <div class="task-info"><b style="${t.done?'text-decoration:line-through;opacity:.6':''}">${t.text||''}</b><small>${t.cat||'عام'} • ${prog}%</small></div>
          <div class="task-check ${t.done?'done':''}" onclick="event.stopPropagation();toggleTaskDone('${t.id}')">${t.done?'✓':''}</div>
        </div>
      </div>
      <button class="ext-del" onclick="deleteTask('${t.id}')">✕</button>
    </div>`;
  }).join('') || '<div style="text-align:center;color:var(--text-soft);padding:30px">مفيش مهام</div>';
  
  let chips=`<button class="filter-chip ${curFilter==='الكل'?'active':''}" onclick="setTaskFilter('الكل')">🔥 الكل</button>`;
  chips+=cats.map(c=>`<button class="filter-chip ${curFilter===c.name?'active':''}" onclick="setTaskFilter('${c.name}')">${c.emoji} ${c.name}</button>`).join('');
  if(hiddenVisible) chips+=`<button class="filter-chip hidden-active ${curFilter==='مخفي'?'active':''}" onclick="setTaskFilter('مخفي')">🔒 مخفي</button>`;
  document.getElementById('filterRow').innerHTML=chips;
}

function setTaskFilter(n){ curFilter=n; if(n!=='مخفي') hiddenVisible=false; renderTasks(); }
function handleTaskSearchInput(v){
  if(v.trim()==='279'){ hiddenVisible=true; curFilter='مخفي'; renderTasks(); showToast('تم فتح المخفي 🔓'); document.getElementById('taskSearch').value=''; }
}
function quickAddTask(v){
  if(!v.trim())return;
  tasks.unshift({id:Date.now().toString(),text:v.trim(),cat:curFilter==='الكل'?cats[0].name:curFilter,done:false,subs:[]});
  document.getElementById('taskSearch').value='';
  localStorage.setItem('omar_tasks_v1',JSON.stringify(tasks));
  saveToCloud(); renderTasks();
}
function toggleTaskDone(id){
  let t=tasks.find(x=>x.id===id); if(t){ t.done=!t.done; localStorage.setItem('omar_tasks_v1',JSON.stringify(tasks)); saveToCloud(); renderTasks(); }
}
function deleteTask(id){
  tasks=tasks.filter(x=>x.id!==id); localStorage.setItem('omar_tasks_v1',JSON.stringify(tasks));
  saveToCloud(); renderTasks();
}

function openManager(){ document.getElementById('managerModal').style.display='flex'; renderManagerLists(); }
function closeManager(){ document.getElementById('managerModal').style.display='none'; }
function addCategory(){
  let n=document.getElementById('newCatName').value.trim(), e=document.getElementById('newCatEmoji').value.trim()||'📌';
  if(!n)return; cats.push({id:Date.now(),emoji:e,name:n});
  document.getElementById('newCatName').value=''; document.getElementById('newCatEmoji').value='';
  localStorage.setItem('omar_cats_v1',JSON.stringify(cats));
  saveToCloud(); renderManagerLists(); renderTasks();
}
function renderManagerLists(){
  document.getElementById('catList').innerHTML=cats.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg-soft);padding:7px 9px;border-radius:8px"><div style="font-size:10px">${c.emoji} <b>${c.name}</b></div><button onclick="cats=cats.filter(x=>x.id!==${c.id});localStorage.setItem('omar_cats_v1',JSON.stringify(cats));saveToCloud();renderManagerLists();renderTasks()" style="border:none;background:#FEE2E2;width:25px;height:25px;border-radius:6px;color:#ef4444">✕</button></div>`).join('');
}

function openTaskModal(id){
  let t=tasks.find(x=>x.id===id); if(!t)return; editingTaskId=id; curSubs=[...(t.subs||[])];
  document.getElementById('mTitle').value=t.text||'';
  document.getElementById('mCat').innerHTML=cats.map(c=>`<option value="${c.name}">${c.emoji} ${c.name}</option>`).join('');
  document.getElementById('mCat').value=t.cat||cats[0].name;
  renderSubs(); document.getElementById('taskModal').classList.add('show');
}
function closeTaskModal(){
  if(editingTaskId){
    let t=tasks.find(x=>String(x.id)===String(editingTaskId));
    if(t){ t.text=document.getElementById('mTitle').value; t.cat=document.getElementById('mCat').value; t.subs=[...curSubs]; localStorage.setItem('omar_tasks_v1',JSON.stringify(tasks)); saveToCloud(); renderTasks(); }
  }
  document.getElementById('taskModal').classList.remove('show'); editingTaskId=null;
}
function renderSubs(){
  document.getElementById('subList').innerHTML=curSubs.map((s,i)=>`<div style="display:flex;gap:6px;align-items:center;background:var(--bg-soft);padding:8px;border-radius:10px"><input type="checkbox" ${s.done?'checked':''} onchange="curSubs[${i}].done=this.checked"><input value="${s.text}" oninput="curSubs[${i}].text=this.value" class="input-pro" style="flex:1;padding:6px"><button onclick="curSubs.splice(${i},1);renderSubs()" style="border:none;background:#FEE2E2;color:#ef4444;width:25px;height:25px;border-radius:6px">✕</button></div>`).join('');
}
function addSub(){ curSubs.push({text:'',done:false}); renderSubs(); }
function switchPane(n,b){
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('pane-'+n).classList.add('active');
  document.querySelectorAll('.pro-seg-btn').forEach(btn=>btn.classList.remove('active')); b.classList.add('active');
}
function saveProTask(){ closeTaskModal(); showToast('تم الحفظ ✅'); }

renderAttendance();
renderTasks();

setInterval(()=>{ document.getElementById('clock').innerText=new Date().toLocaleTimeString('en-GB',{hour12:false}); },1000);

window.renderAll = function(){
  tasks=safeParse('omar_tasks_v1', []); cats=safeParse('omar_cats_v1', cats);
  renderAttendance(); renderTasks();
};
