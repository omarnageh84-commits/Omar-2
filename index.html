<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMAR PRO</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet"><style>*{font-family:Cairo;box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#fff;display:flex;flex-direction:column;height:100vh}.h{height:56px;background:#15803D;display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-radius:14px 14px 0 0;margin:4px}.page{flex:1;overflow:auto;background:#0A0A0A;padding:12px;display:none}.page.show{display:block}.card{background:#1E1E1E;border:1px solid #222;border-radius:14px;padding:14px;margin-bottom:10px}.subTabs{display:flex;gap:6px;background:#111;padding:6px;border-radius:12px;margin-bottom:12px}.subTabs button{flex:1;height:34px;border:0;background:transparent;color:#777;border-radius:8px}.subTabs button.on{background:#15803D;color:#fff}.bottom{height:78px;background:#151515;border-top:1px solid #222;display:flex;align-items:center}.bItem{flex:1;display:flex;flex-direction:column;align-items:center;color:#666;font-size:10px;cursor:pointer}.bItem.on{color:#15803D}.plusW{flex:1;display:flex;justify-content:center}.plus{width:64px;height:64px;border-radius:50%;background:#15803D;display:grid;place-items:center;font-size:30px;margin-top:-40px;border:4px solid #000;box-shadow:0 0 20px #15803D99}.modal{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;z-index:99}.modal.show{display:flex}.mTop{height:50px;background:#222;display:flex;justify-content:space-between;align-items:center;padding:0 12px}.mTabs{display:flex;background:#222}.mTabs button{flex:1;height:42px;background:transparent;border:0;color:#777;border-bottom:3px solid transparent}.mTabs button.on{color:#fff;border-color:#15803D}.sBar{padding:8px 12px;background:#111;display:flex;gap:6px;border-bottom:1px solid #222}.sBar input{flex:1;background:transparent;border:0;color:#fff;outline:none}.list{flex:1;overflow:auto}.mainC{padding:12px 16px;background:#111;border-bottom:1px solid #222;display:flex;justify-content:space-between;font-weight:700}.subC{padding:11px 24px 11px 40px;display:flex;justify-content:space-between;border-bottom:1px solid #151515}.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{border:1px solid #222;padding:7px;text-align:center}.table th{background:#151515}.inp{width:100%;height:42px;background:#111;border:1px solid #333;border-radius:10px;padding:0 10px;color:#fff;margin-top:8px}.btn{width:100%;height:44px;background:#15803D;border:0;border-radius:10px;color:#fff;font-weight:700;margin-top:10px}</style></head><body>
<div class="h"><div>▼ الجنيه المصري</div><div><b>OMAR 🔒</b> <span id="topTotal">EGP 0</span></div></div>
<div id="p-income" class="page show"><div class="card">الدخل: <b id="sInc">0ج</b> - <span id="cInc">0 عملية</span></div><div id="lInc"></div></div>
<div id="p-outcome" class="page"><div class="card">المصروف: <b id="sOut">0ج</b> - <span id="cOut">0 عملية</span></div><div id="lOut"></div></div>
<div id="p-debts" class="page"><div class="subTabs"><button id="dt-net" class="on" onclick="setD('net')">الصافي</button><button id="dt-lana" onclick="setD('lana')">لنا</button><button id="dt-alayna" onclick="setD('alayna')">علينا</button></div><div class="card" style="text-align:center"><div id="dNet" style="font-size:22px;font-weight:800;color:#4ade80">0ج</div><div style="display:flex;justify-content:space-around;font-size:12px"><span>لنا <b id="dLana">0</b></span><span>علينا <b id="dAl">0</b></span></div></div><div id="lDebt"></div></div>
<div id="p-att" class="page"><div class="card" style="padding:0;overflow:hidden"><table class="table"><thead><tr><th>يوم</th><th>حضور</th><th>انصراف</th><th>الصافي</th><th>ملاحظات</th></tr></thead><tbody id="bAtt"></tbody></table></div></div>
<div id="p-notes" class="page"><div class="subTabs"><button class="on">الكل</button><button>اليوم</button><button>مهم</button></div><div id="lNotes"></div></div>
<div class="bottom"><div class="bItem on" id="bt-income" onclick="go('income')"><span>💰</span><span>الدخل</span></div><div class="bItem" id="bt-outcome" onclick="go('outcome')"><span>💸</span><span>المصروف</span></div><div class="plusW"><div class="plus" onclick="plusAct()">+</div></div><div class="bItem" id="bt-att" onclick="go('att')"><span>⏰</span><span>الحضور</span></div><div class="bItem" id="bt-notes" onclick="go('notes')"><span>📋</span><span>اليومية</span></div></div>
<div id="mCats" class="modal"><div class="mTop"><span onclick="closeC()">←</span><b>الأقسام</b><span>⇄</span></div><div class="mTabs"><button id="ct-debts" onclick="swCat('debts')">الديون</button><button id="ct-out" class="on" onclick="swCat('out')">المصروف</button><button id="ct-in" onclick="swCat('in')">الدخل</button></div><div class="sBar"><span>🔍</span><input id="sCat" placeholder="بحث" oninput="renderCats()"></div><div id="catBox" class="list"></div></div>
<div id="mAdd" class="modal" style="background:#000c;justify-content:center;align-items:center;padding:12px"><div style="background:#1E1E1E;border-radius:16px;width:100%;max-width:360px;padding:14px"><h3 id="aTitle">إضافة</h3><div id="aFields"></div><div style="display:flex;gap:8px;margin-top:10px"><button onclick="saveA()" class="btn" style="flex:1;margin:0">حفظ</button><button onclick="closeA()" style="flex:1;height:44px;background:#222;border:1px solid #333;border-radius:10px;color:#fff">إلغاء</button></div></div></div>
<script>
let S={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
let cur='income',curD='net',curCat='out',sel='',uid=()=>Math.random().toString(36).slice(2,5),fmt=n=>Number(n||0).toLocaleString();
let inCats=[{n:'الراتب',c:'#f9a825',i:'💵'},{n:'مكافأة',c:'#3949ab',i:'🏆'},{n:'هدايا',c:'#43a047',i:'🎁'},{n:'مبيعات',c:'#ff5722',i:'💰'},{n:'امانات',c:'#234e25',i:'●'},{n:'دي دي',c:'#15803D',i:'●'},{n:'جمايل',c:'#1976d2',i:'●'},{n:'فودافون كاش',c:'#c62828',i:'💳'},{n:'البيت',c:'#ef6c00',i:'🏠'},{n:'انستا باي',c:'#00acc1',i:'💸'}];
let outCats=[{m:'الاكل',ic:'🥗',co:'#ff7043',subs:[{n:'اكل صيدليه',i:'🍵',co:'#6d4c41'},{n:'اكل البيت',i:'🍱',co:'#5c6bc0'},{n:'اكل خارجي و ترفيه',i:'🧁',co:'#ab47bc'},{n:'منظفات',i:'🧴',co:'#15803D'},{n:'عزومات',i:'🍖',co:'#333'}]},{m:'المواصلات',ic:'🔧',co:'#66bb6a',subs:[{n:'البنزين',i:'⛽',co:'#fbc02d'},{n:'الصيانة',i:'🔧',co:'#66bb6a'},{n:'الجراج',i:'🅿️',co:'#64b5f6'},{n:'الأجرة',i:'🚕',co:'#ffa726'},{n:'زيت',i:'🛢️',co:'#7c4dff'},{n:'دي دي',i:'🚗',co:'#6a1b9a'}]},{m:'السكن',ic:'🏠',co:'#8d6e63',subs:[{n:'إيجار',i:'🏠'},{n:'كهرباء',i:'💡'},{n:'مياه',i:'💧'}]}];
function go(t){cur=t;document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));document.getElementById('p-'+t).classList.add('show');document.querySelectorAll('.bItem').forEach(b=>b.classList.remove('on'));let b=document.getElementById('bt-'+t);if(b)b.classList.add('on');render()}
function setD(t){curD=t;document.getElementById('dt-net').classList.toggle('on',t=='net');document.getElementById('dt-lana').classList.toggle('on',t=='lana');document.getElementById('dt-alayna').classList.toggle('on',t=='alayna');render()}
function plusAct(){if(cur=='att'||cur=='notes'||cur=='debts'){openF('');document.getElementById('mAdd').classList.add('show');return}document.getElementById('mCats').classList.add('show');swCat(cur=='income'?'in':'out')}
function closeC(){document.getElementById('mCats').classList.remove('show')}function swCat(t){curCat=t;document.getElementById('ct-in').classList.toggle('on',t=='in');document.getElementById('ct-out').classList.toggle('on',t=='out');document.getElementById('ct-debts').classList.toggle('on',t=='debts');renderCats()}
function renderCats(){let q=(document.getElementById('sCat').value||'').toLowerCase(),h='';if(curCat=='in'){inCats.forEach(x=>{if(q&&!x.n.includes(q))return;h+=`<div class="subC" onclick="pick('${x.n}')"><span>${x.n}</span><span class="dot" style="background:${x.c}">${x.i}</span></div>`})}else{outCats.forEach(g=>{h+=`<div class="mainC">${g.m}<span style="background:${g.co};width:32px;height:32px;border-radius:50%;display:grid;place-items:center">${g.ic}</span></div>`;g.subs.forEach(s=>{if(q&&!s.n.includes(q))return;h+=`<div class="subC" onclick="pick('${s.n}')"><span>${s.n}</span><span class="dot" style="background:${s.co||'#333'}">${s.i||'●'}</span></div>`})})}document.getElementById('catBox').innerHTML=h}
function pick(n){sel=n;closeC();openF(n);document.getElementById('mAdd').classList.add('show')}
function openF(n){let f='';if(cur=='income'||curCat=='in'){document.getElementById('aTitle').innerText='إضافة دخل - '+n;f=`<div style="font-size:11px;opacity:.6">${n}</div><input id="x1" class="inp" type="number" placeholder="المبلغ"><input id="x2" class="inp" placeholder="ملاحظة"><input id="x3" class="inp" type="date" value="${new Date().toISOString().slice(0,10)}">`}else if(cur=='outcome'||curCat=='out'){document.getElementById('aTitle').innerText='إضافة مصروف - '+n;f=`<div style="font-size:11px;opacity:.6">${n}</div><input id="x1" class="inp" type="number" placeholder="المبلغ"><input id="x2" class="inp" placeholder="ملاحظة"><input id="x3" class="inp" type="date" value="${new Date().toISOString().slice(0,10)}">`}else if(cur=='debts'){document.getElementById('aTitle').innerText='إضافة دين';f=`<input id="y1" class="inp" placeholder="الاسم"><input id="y2" class="inp" type="number" placeholder="المبلغ"><select id="y3" class="inp"><option value="لنا">لنا</option><option value="علينا">علينا</option></select>`}else if(cur=='att'){document.getElementById('aTitle').innerText='إضافة حضور';f=`<input id="z1" class="inp" type="date" value="${new Date().toISOString().slice(0,10)}"><div style="display:flex;gap:6px"><input id="z2" class="inp" type="time" value="09:00"><input id="z3" class="inp" type="time" value="17:00"></div><input id="z4" class="inp" placeholder="ملاحظات">`}else{document.getElementById('aTitle').innerText='ملاحظة جديدة';f=`<input id="w1" class="inp" placeholder="العنوان"><textarea id="w2" class="inp" style="height:80px;padding-top:8px" placeholder="التفاصيل"></textarea>`}document.getElementById('aFields').innerHTML=f}
function closeA(){document.getElementById('mAdd').classList.remove('show')}
function saveA(){if(cur=='income'||curCat=='in'){let a=S.get('income',[]);a.push({id:uid(),cat:sel,am:+document.getElementById('x1').value||0,no:document.getElementById('x2').value,dt:document.getElementById('x3').value});S.set('income',a)}else if(cur=='outcome'||curCat=='out'){let a=S.get('outcome',[]);a.push({id:uid(),cat:sel,am:+document.getElementById('x1').value||0,no:document.getElementById('x2').value,dt:document.getElementById('x3').value});S.set('outcome',a)}else if(cur=='debts'){let a=S.get('debts',[]);a.push({id:uid(),p:document.getElementById('y1').value||'شخص',am:+document.getElementById('y2').value||0,ty:document.getElementById('y3').value});S.set('debts',a)}else if(cur=='att'){let it=document.getElementById('z2').value,ot=document.getElementById('z3').value,c=0;try{let x=it.split(':'),y=ot.split(':');c=(+y[0]*60+ +y[1]- +x[0]*60- +x[1])/60;if(c<0)c+=24}catch(e){};let a=S.get('att',[]);a.push({id:uid(),d:document.getElementById('z1').value,i:it,o:ot,s:c.toFixed(2),n:document.getElementById('z4').value});S.set('att',a)}else{let a=S.get('notes',[]);a.push({id:uid(),t:document.getElementById('w1').value||'بدون',c:document.getElementById('w2').value,dt:new Date().toISOString().slice(0,10)});S.set('notes',a)}closeA();render()}
function render(){let inc=S.get('income',[]),out=S.get('outcome',[]),debt=S.get('debts',[]),att=S.get('att',[]),notes=S.get('notes',[]),sI=0,sO=0;inc.forEach(x=>sI+=x.am);out.forEach(x=>sO+=x.am);document.getElementById('topTotal').innerText='EGP '+(sI-sO).toLocaleString();document.getElementById('sInc').innerText=fmt(sI)+'ج';document.getElementById('cInc').innerText=inc.length+' عملية';document.getElementById('sOut').innerText=fmt(sO)+'ج';document.getElementById('cOut').innerText=out.length+' عملية';document.getElementById('lInc').innerHTML=inc.slice().reverse().map(x=>`<div class="card" style="display:flex;justify-content:space-between"><div><b>${x.cat}</b> - ${fmt(x.am)}ج<br><small style="opacity:.5">${x.no} - ${x.dt}</small></div><span onclick="del('income','${x.id}')">🗑️</span></div>`).join('')||'<div style="text-align:center;padding:40px;opacity:.4">لا يوجد دخل - دوس +</div>';document.getElementById('lOut').innerHTML=out.slice().reverse().map(x=>`<div class="card" style="display:flex;justify-content:space-between"><div><b>${x.cat}</b> - ${fmt(x.am)}ج<br><small style="opacity:.5">${x.no} - ${x.dt}</small></div><span onclick="del('outcome','${x.id}')">🗑️</span></div>`).join('')||'<div style="text-align:center;padding:40px;opacity:.4">لا يوجد مصروفات</div>';let l=0,a=0;debt.forEach(d=>{if(d.ty=='لنا')l+=d.am;else a+=d.am});document.getElementById('dLana').innerText=fmt(l);document.getElementById('dAl').innerText=fmt(a);document.getElementById('dNet').innerText=fmt(l-a)+'ج';let f=curD=='net'?debt:debt.filter(d=>d.ty==(curD=='lana'?'لنا':'علينا'));document.getElementById('lDebt').innerHTML=f.map(d=>`<div class="card" style="display:flex;justify-content:space-between"><div><b>${d.p}</b> - ${fmt(d.am)}ج <small style="color:${d.ty=='لنا'?'#4ade80':'#f87171'}">${d.ty}</small></div><span onclick="del('debts','${d.id}')">🗑️</span></div>`).join('')||'<div style="text-align:center;padding:30px;opacity:.4">لا يوجد ديون</div>';document.getElementById('bAtt').innerHTML=att.slice().reverse().map(r=>`<tr><td>${r.d}</td><td>${r.i}</td><td>${r.o}</td><td>${r.s}س</td><td>${r.n||'-'}</td></tr>`).join('')||'<tr><td colspan="5" style="opacity:.4">لا يوجد حضور</td></tr>';document.getElementById('lNotes').innerHTML=notes.slice().reverse().map(n=>`<div class="card" style="border-right:4px solid #15803D"><div style="display:flex;justify-content:space-between"><b>${n.t}</b><small style="opacity:.5">${n.dt}</small></div><div style="font-size:13px;opacity:.8;margin-top:6px">${n.c}</div><div style="text-align:left"><span onclick="del('notes','${n.id}')">🗑️</span></div></div>`).join('')||'<div style="text-align:center;padding:40px;opacity:.4">لا يوجد ملاحظات</div>'}
function del(k,id){if(confirm('مسح؟')){S.set(k,S.get(k,[]).filter(x=>x.id!==id));render()}}
render();renderCats();
</script></body></html>
