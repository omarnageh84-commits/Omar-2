<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMAR</title><style>body{margin:0;background:#000;color:#fff;font-family:Arial;padding-bottom:60px}.h{height:48px;background:#15803D;display:flex;align-items:center;padding:0 12px;font-weight:700}.page{display:none;padding:8px}.page.on{display:block}.card{background:#1A1A1A;border:1px solid #222;border-radius:12px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between}.bottom{position:fixed;bottom:0;left:0;right:0;height:52px;background:#111;border-top:1px solid #222;display:flex}.b{flex:1;text-align:center;color:#777;font-size:9px;padding-top:6px}.b.on{color:#15803D}.plus{width:30px;height:30px;background:#15803D;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:10px 6px}.modal{position:fixed;inset:0;background:#000;display:none;z-index:99;padding:20px}.modal.on{display:block}.inp{width:100%;height:40px;background:#222;border:1px solid #333;color:#fff;margin-top:8px;padding:0 8px;border-radius:8px}.btn{width:100%;height:40px;background:#15803D;border:0;color:#fff;margin-top:8px;border-radius:8px}</style></head><body>
<div class="h">OMAR - <span id="bal">69050</span></div>

<div id="p1" class="page"><div id="l1"></div></div>
<div id="p2" class="page on"><div id="l2"></div></div>
<div id="p3" class="page"><div id="l3"></div></div>
<div id="p4" class="page"><div id="l4"></div></div>
<div id="p5" class="page"><div id="l5"></div></div>
<div id="p6" class="page"><div id="l6"></div></div>

<div class="bottom">
<div class="b on" id="b1" onclick="go(1)">الدخل</div>
<div class="b" id="b2" onclick="go(2)">المصروف</div>
<div class="b" id="b3" onclick="go(3)">الديون</div>
<div class="b" id="b4" onclick="go(4)">الحضور</div>
<div class="b" id="b5" onclick="go(5)">ملاحظات</div>
<div class="b" id="b6" onclick="go(6)">اليومية</div>
<div class="plus" onclick="add()">+</div>
</div>

<div id="m" class="modal">
<div id="mt">اضافة</div>
<div id="mf"></div>
<button class="btn" onclick="save()">حفظ</button>
<button class="btn" style="background:#333" onclick="hide()">الغاء</button>
</div>

<script>
var cur=2;
var editId=null;
function get(k){var v=localStorage.getItem(k);if(!v) return [];try{return JSON.parse(v)}catch(e){return []}}
function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
function go(n){
cur=n;
for(var i=1;i<=6;i++){
var p=document.getElementById('p'+i);
if(p) p.className='page';
var b=document.getElementById('b'+i);
if(b) b.className='b';
}
document.getElementById('p'+n).className='page on';
document.getElementById('b'+n).className='b on';
show();
}
function hide(){document.getElementById('m').className='modal';editId=null}
function add(){editId=null;document.getElementById('m').className='modal on';make(null)}
function make(o){
var f='';
if(cur==1||cur==2){document.getElementById('mt').innerHTML='مصروف - غسيل';f='<input id="f1" class="inp" placeholder="البند غسيل"><input id="f2" class="inp" type="number" placeholder="المبلغ">';if(o){f='<input id="f1" class="inp" value="'+o.c+'"><input id="f2" class="inp" type="number" value="'+o.a+'">';}}
if(cur==3){document.getElementById('mt').innerHTML='دين الصيدليه';f='<input id="f1" class="inp" placeholder="الصيدليه"><input id="f2" class="inp" type="number" placeholder="الاجمالي 1000"><input id="f3" class="inp" type="number" placeholder="المدفوع 300">';if(o){f='<input id="f1" class="inp" value="'+o.p+'"><input id="f2" class="inp" value="'+o.a+'"><input id="f3" class="inp" value="'+o.paid+'">';}}
if(cur==4){document.getElementById('mt').innerHTML='حضور 9=9ص';f='<input id="f1" class="inp" type="date"><input id="f2" class="inp" type="number" placeholder="حضور 9"><input id="f3" class="inp" type="number" placeholder="انصراف 19">';}
if(cur>=5){document.getElementById('mt').innerHTML='ملاحظة';f='<input id="f1" class="inp" placeholder="عنوان">';}
document.getElementById('mf').innerHTML=f;
}
function save(){
if(cur==2){var a=get('out');var c=document.getElementById('f1').value;var v=document.getElementById('f2').value;if(editId){for(var i=0;i<a.length;i++) if(a[i].id==editId){a[i].c=c;a[i].a=v}}else{a.push({id:''+Date.now(),c:c,a:v})}set('out',a)}
if(cur==3){var a=get('deb');var p=document.getElementById('f1').value;var tot=document.getElementById('f2').value;var paid=document.getElementById('f3').value;if(editId){for(var i=0;i<a.length;i++) if(a[i].id==editId){a[i].p=p;a[i].a=Number(tot);a[i].paid=Number(paid)}}else{a.push({id:''+Date.now(),p:p||'الصيدليه',a:Number(tot),paid:Number(paid)})}set('deb',a)}
if(cur==4){var a=get('att');var d=document.getElementById('f1').value;var inN=document.getElementById('f2').value;var outN=document.getElementById('f3').value;var h=Math.abs(Number(outN)-Number(inN));if(editId){for(var i=0;i<a.length;i++) if(a[i].id==editId){a[i].d=d;a[i].inN=inN;a[i].outN=outN;a[i].h=h}}else{a.push({id:''+Date.now(),d:d,inN:inN,outN:outN,h:h})}set('att',a)}
hide();show();
}
function del(k,id){var a=get(k);var b=[];for(var i=0;i<a.length;i++) if(a[i].id!=id) b.push(a[i]);set(k,b);show()}
function ed(k,id){var a=get(k);for(var i=0;i<a.length;i++) if(a[i].id==id){editId=id;document.getElementById('m').className='modal on';make(a[i]);return}}
function show(){
var out=get('out');var deb=get('deb');var att=get('att');
var so=0;for(var i=0;i<out.length;i++) so+=Number(out[i].a||0);
document.getElementById('bal').innerHTML=69050-so;
var h='';for(var i=out.length-1;i>=0;i--) h+='<div class="card"><div>'+out[i].c+' - '+out[i].a+'ج</div><div><span onclick="ed(\'out\',\''+out[i].id+'\')">✏️</span> <span onclick="del(\'out\',\''+out[i].id+'\')">🗑️</span></div></div>';document.getElementById('l2').innerHTML=h||'لا يوجد';
var grouped={};for(var i=0;i<deb.length;i++){var k=deb[i].p;if(!grouped[k]) grouped[k]={a:0,paid:0};grouped[k].a+=Number(deb[i].a);grouped[k].paid+=Number(deb[i].paid);}
h='';for(var k in grouped){var rem=grouped[k].a-grouped[k].paid;var firstId='';for(var j=0;j<deb.length;j++) if(deb[j].p==k){firstId=deb[j].id;break;}h+='<div class="card"><div><b>'+k+'</b> الاجمالي '+grouped[k].a+' المدفوع '+grouped[k].paid+' المتبقي '+rem+'</div><div><span onclick="ed(\'deb\',\''+firstId+'\')">✏️</span> <span onclick="del(\'deb\',\''+firstId+'\')">🗑️</span></div></div>';}document.getElementById('l3').innerHTML=h||'الصيدليه 1000 - 300 = 700';
h='';for(var i=0;i<att.length;i++) h+='<div class="card"><div>'+att[i].d+' حضور '+att[i].inN+' انصراف '+att[i].outN+' صافي '+att[i].h+'س</div><div><span onclick="ed(\'att\',\''+att[i].id+'\')">✏️</span> <span onclick="del(\'att\',\''+att[i].id+'\')">🗑️</span></div></div>';document.getElementById('l4').innerHTML=h||'لا يوجد';
}
show();
</script>
</body>
</html>
