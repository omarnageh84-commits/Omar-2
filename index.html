<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>مشروعي - برو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0}
body{background:#121212;color:#fff;padding-bottom:90px}
.h{background:#0F7A3D;padding:10px 14px 0;position:sticky;top:0;z-index:10}
.topHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.btnSmall{height:26px;padding:0 10px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;cursor:pointer}
.btnSmall.green{background:#fff;color:#0F7A3D;border:0}
.top{display:flex}
.top a{flex:1;text-align:center;padding:10px 2px;color:#ffffff99;border-bottom:3px solid transparent;font-size:12px;cursor:pointer}
.top a.on{border-color:#fff;color:#fff;font-weight:700}
.card{background:#1E1E1E;border:1px solid #2A2A2A;border-radius:16px;padding:14px;margin-bottom:10px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#1E1E1E;border-top:1px solid #2A2A2A;height:72px;display:flex;justify-content:space-around;align-items:center;z-index:9999}
.bottom a{color:#888;font-size:11px;display:flex;flex-direction:column;align-items:center;flex:1;cursor:pointer}
.bottom a.on{color:#0F7A3D}
.plus{width:56px;height:56px;border-radius:50%;background:#3F3B6B;margin-top:-28px;display:grid;place-items:center;font-size:26px;color:#fff;cursor:pointer}
.modal{position:fixed;inset:0;background:#0008;backdrop-filter:blur(6px);z-index:99;display:none;place-items:center;padding:14px}
.modal.show{display:grid}
.box{background:#1E1E1E;border:1px solid #333;border-radius:18px;padding:14px;width:100%;max-width:430px;max-height:92vh;overflow:auto}
.inp{width:100%;height:42px;background:#121212;border:1px solid #333;border-radius:12px;padding:0 12px;color:#fff;margin-top:8px;outline:none}
.label{font-size:11px;opacity:.6;margin-top:10px;display:block}
.chip{display:inline-flex;align-items:center;gap:6px;background:#2A2A2A;border:1px solid #333;border-radius:20px;padding:4px 10px;font-size:11px;margin:4px;cursor:pointer}
.chip.active{background:#0F7A3D;color:#fff;border-color:#0F7A3D}
.table{width:100%;border-collapse:collapse;font-size:11px}
.table th{background:#0F7A3D;color:#fff;padding:6px;font-size:10px}
.table td{border:1px solid #2A2A2A;padding:6px;text-align:center}
.badge{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
</style>
</head>
<body>
<div class="h">
<div class="topHead">
<div style="font-size:11px;opacity:.9">▼ الجنيه المصري</div>
<div style="display:flex;gap:6px;align-items:center">
<button class="btnSmall" onclick="exportExcel()">Excel</button>
<button class="btnSmall green" onclick="syncSheet()">☁️ رفع الشيت</button>
<div style="margin-left:8px;font-weight:800">OMAR 🔒</div>
</div>
</div>
<div class="top">
<a data-t="expenses" class="on" onclick="setTop('expenses')">مصروفاتي</a>
<a data-t="debts" onclick="setTop('debts')">ديوني</a>
<a data-t="attendance" onclick="setTop('attendance')">الحضور</a>
<a data-t="notes" onclick="setTop('notes')">ملاحظاتي</a>
</div>
</div>
<div style="padding:12px">
<div id="summaryCard" class="card" style="display:flex;gap:12px;align-items:center"></div>
<div id="extraControls"></div>
<div id="list"></div>
</div>
<div class="bottom" id="bottomNav"></div>
<div id="modal" class="modal"><div class="box"><h3 id="mTitle">إضافة</h3><div id="mFields"></div><div style="display:flex;gap:8px;margin-top:14px"><button onclick="saveItem()" style="flex:1;height:44px;border-radius:12px;background:#0F7A3D;color:#fff;border:0;font-weight:700">حفظ</button><button onclick="closeM()" style="flex:1;height:44px;border-radius:12px;background:#222;color:#fff;border:1px solid #333">إلغاء</button></div></div></div>

<script>
function fmt(n){return Number(n||0).toLocaleString('en-US');}
const APP={get:function(k,d){try{var v=JSON.parse(localStorage.getItem(k)); return v!==null?v:d;}catch(e){return d}},set:function(k,v){localStorage.setItem(k,JSON.stringify(v));}};
const uid=function(){return Math.random().toString(36).slice(2,6);};
const SUBS={expenses:[{id:'outcome',l:'مصروف',i:'💸'},{id:'income',l:'مدخلات',i:'💰'},{id:'net',l:'الصافي',i:'📊'},{id:'all',l:'الكل',i:'📋'}],debts:[{id:'lena',l:'لنا',i:'⬆️'},{id:'alayna',l:'علينا',i:'⬇️'},{id:'net',l:'الصافي',i:'⚖️'},{id:'all',l:'الكل',i:'📋'}],attendance:[{id:'table',l:'جدول',i:'📊'},{id:'hader',l:'حاضر',i:'✅'},{id:'ghaeb',l:'غائب',i:'❌'},{id:'all',l:'الكل',i:'📅'}],notes:[{id:'pinned',l:'مثبتة',i:'📌'},{id:'general',l:'عامة',i:'📝'},{id:'all',l:'الكل',i:'📋'}]};
let topT=localStorage.getItem('topT')||'expenses', bottomT='all';
function setTop(t){topT=t;bottomT=t==='attendance'?'table':'all';localStorage.setItem('topT',t);render();}
function setBottom(b){bottomT=b;render();}

// default categories
if(!localStorage.getItem('cats_out')) APP.set('cats_out',['أكل','مواصلات','إيجار','مشتريات']);
if(!localStorage.getItem('cats_in')) APP.set('cats_in',['راتب','مبيعات','تحويل']);

function render(){
 document.querySelectorAll('.top a').forEach(function(a){a.classList.toggle('on',a.dataset.t===topT)});
 var subs=SUBS[topT];
 document.getElementById('bottomNav').innerHTML='<a class="'+(bottomT===subs[0].id?'on':'')+'" onclick="setBottom(\''+subs[0].id+'\')"><span>'+subs[0].i+'</span><span>'+subs[0].l+'</span></a><a class="'+(bottomT===subs[1].id?'on':'')+'" onclick="setBottom(\''+subs[1].id+'\')"><span>'+subs[1].i+'</span><span>'+subs[1].l+'</span></a><div class="plus" onclick="openM()">+</div><a class="'+(bottomT===subs[2].id?'on':'')+'" onclick="setBottom(\''+subs[2].id+'\')"><span>'+subs[2].i+'</span><span>'+subs[2].l+'</span></a><a class="'+(bottomT===subs[3].id?'on':'')+'" onclick="setBottom(\''+subs[3].id+'\')"><span>'+subs[3].i+'</span><span>'+subs[3].l+'</span></a>';

 var expenses=APP.get('expenses',[]), debts=APP.get('debts',[]), atts=APP.get('attendance',[]), notes=APP.get('notes',[]);
 var sumOut=0, sumIn=0; expenses.forEach(function(x){if(x.type==='outcome') sumOut+=Number(x.amount||0); else sumIn+=Number(x.amount||0);});
 var net=sumIn-sumOut;
 var catsOut=APP.get('cats_out',[]), catsIn=APP.get('cats_in',[]);
 var summaryHTML='', extraHTML='', html='', data=[];

 if(topT==='expenses'){
   summaryHTML='<div style="width:84px;height:84px;border-radius:50%;border:6px solid '+(net>=0?'#0F7A3D':'#EF4444')+';display:grid;place-items:center;font-weight:800;font-size:13px">'+fmt(net)+'ج</div><div style="flex:1;font-size:12px;line-height:20px"><div>المصاريف: '+fmt(sumOut)+'ج</div><div>المدخلات: '+fmt(sumIn)+'ج</div><div>الصافي: <b>'+fmt(net)+'ج</b></div><div style="opacity:.5;font-size:10px;margin-top:4px">كله مربوط ببعضه</div></div>';
   // تصنيفات قابلة للتعديل
   extraHTML='<div class="card"><div style="display:flex;justify-content:space-between"><b style="font-size:12px">📂 تصنيفات الصرف</b><span style="font-size:10px;cursor:pointer;color:#0F7A3D" onclick="addCat(\'out\')">+ إضافة</span></div><div style="margin-top:8px">'+catsOut.map(function(c,i){return '<span class="chip">'+c+' <span onclick="delCat(\'out\','+i+')" style="color:#f87171">✕</span></span>';}).join('')+'</div><div style="margin-top:10px;display:flex;justify-content:space-between"><b style="font-size:12px">💰 تصنيفات الدخل</b><span style="font-size:10px;cursor:pointer;color:#0F7A3D" onclick="addCat(\'in\')">+ إضافة</span></div><div style="margin-top:8px">'+catsIn.map(function(c,i){return '<span class="chip">'+c+' <span onclick="delCat(\'in\','+i+')" style="color:#f87171">✕</span></span>';}).join('')+'</div></div>';
   data=expenses;
   if(bottomT==='outcome') data=data.filter(function(x){return x.type==='outcome'});
   if(bottomT==='income') data=data.filter(function(x){return x.type==='income'});
   if(bottomT==='net') data=[];
   html=data.map(function(e){return '<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><b>'+fmt(e.amount)+'ج - '+(e.cat||e.desc||'')+'</b><div style="font-size:11px;opacity:.6">'+(e.type==='outcome'?'مصروف':'دخل')+' | '+(e.desc||'')+' - '+(e.date||'')+'</div></div><div style="display:flex;gap:10px"><span onclick="editExp(\''+e.id+'\')" style="cursor:pointer">✏️</span><span onclick="delItem(\'expenses\',\''+e.id+'\')" style="cursor:pointer">🗑️</span></div></div>';}).join('');
 }
 if(topT==='debts'){
   var lena=0, alayna=0; debts.forEach(function(x){if(x.type==='لنا') lena+=Number(x.amount||0); else alayna+=Number(x.amount||0);});
   summaryHTML='<div style="width:84px;height:84px;border-radius:50%;border:6px solid #4DD0E1;display:grid;place-items:center;font-weight:800">'+fmt(lena-alayna)+'ج</div><div style="flex:1;font-size:12px;line-height:20px"><div>لنا: '+fmt(lena)+'ج</div><div>علينا: '+fmt(alayna)+'ج</div><div>الصافي: '+fmt(lena-alayna)+'ج</div><div style="opacity:.5;font-size:10px">مرتبط بالصافي العام: '+fmt(net+(lena-alayna))+'ج</div></div>';
   data=APP.get('debts',[]); if(bottomT==='lena') data=data.filter(function(x){return x.type==='لنا'}); if(bottomT==='alayna') data=data.filter(function(x){return x.type==='علينا'});
   html=data.map(function(d){return '<div class="card" style="display:flex;justify-content:space-between"><div><b>'+d.person+' - '+fmt(d.amount)+'ج</b><div style="font-size:11px;color:'+(d.type==='لنا'?'#4caf50':'#f44336')+'">'+d.type+'</div></div><span onclick="delItem(\'debts\',\''+d.id+'\')" style="cursor:pointer">🗑️</span></div>';}).join('');
 }
 if(topT==='attendance'){
   var h=0,g=0; atts.forEach(function(x){if(x.status==='حاضر') h++; else if(x.status==='غائب') g++;});
   var totalHours=0, totalNet=0; atts.forEach(function(a){totalHours+=Number(a.totalHours||0); totalNet+=Number(a.net||0);});
   summaryHTML='<div style="width:84px;height:84px;border-radius:50%;border:6px solid #0F7A3D;display:grid;place-items:center;text-align:center"><div style="font-size:16px;font-weight:800">'+fmt(totalHours)+'</div><div style="font-size:9px">ساعة</div></div><div style="flex:1;font-size:11px;line-height:18px"><div>إجمالي الساعات: '+fmt(totalHours)+'</div><div>إجمالي الصافي: '+fmt(totalNet)+'ج</div><div>حاضر: '+h+' / غائب: '+g+'</div></div>';
   data=atts.sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
   if(bottomT==='hader') data=data.filter(function(x){return x.status==='حاضر'});
   if(bottomT==='ghaeb') data=data.filter(function(x){return x.status==='غائب'});
   if(bottomT==='table'){
     html='<div class="card" style="overflow:auto"><table class="table"><tr><th>التاريخ</th><th>الساعة</th><th>كم ساعة</th><th>سعر الساعة</th><th>عدد الساعات</th><th>الصافي</th><th>المطلوب يوميا</th><th>النورين الصباحية</th><th>الصافي بعد</th><th>الضريبة</th></tr>'+data.map(function(a){return '<tr><td>'+(a.date||'')+'</td><td style="direction:ltr">'+(a.checkIn||'')+'</td><td>'+(a.totalHours||0)+'</td><td>'+fmt(a.rate||0)+'</td><td>'+(a.totalHours||0)+'</td><td style="color:#4ade80;font-weight:700">'+fmt(a.net||0)+'</td><td>'+(a.required||0)+'</td><td>'+(a.morning||0)+'</td><td>'+fmt(a.finalNet||0)+'</td><td>'+fmt(a.tax||0)+'</td><td><span onclick="delItem(\'attendance\',\''+a.id+'\')" style="cursor:pointer">🗑️</span></td></tr>';}).join('')+'</table></div>';
   } else {
     html=data.map(function(a){return '<div class="card"><div style="display:flex;justify-content:space-between"><b>'+a.date+'</b><span class="badge" style="background:'+(a.status==='حاضر'?'#0F7A3D22':'#EF444422')+'">'+a.status+'</span></div><div style="font-size:11px;margin-top:6px">⏰ '+a.checkIn+' - '+a.checkOut+' | '+a.totalHours+' ساعة | سعر '+fmt(a.rate)+' | صافي '+fmt(a.net)+'ج</div></div>';}).join('');
   }
 }
 if(topT==='notes'){
   summaryHTML='<div style="width:84px;height:84px;border-radius:50%;border:6px solid #3F3B6B;display:grid;place-items:center;font-weight:800">'+notes.length+'</div><div style="flex:1">إجمالي: '+notes.length+'</div>';
   html=notes.map(function(n){return '<div class="card"><b>'+(n.title||'')+'</b><div style="font-size:12px;opacity:.7">'+(n.content||'')+'</div><div style="text-align:left"><span onclick="delItem(\'notes\',\''+n.id+'\')" style="cursor:pointer">🗑️</span></div></div>';}).join('');
 }
 document.getElementById('summaryCard').innerHTML=summaryHTML;
 document.getElementById('extraControls').innerHTML=extraHTML;
 document.getElementById('list').innerHTML=html||'<div style="text-align:center;padding:40px;opacity:.4">لا يوجد بيانات</div>';
}

function addCat(type){
 var name=prompt('اسم التصنيف الجديد:'); if(!name) return;
 if(type==='out'){var a=APP.get('cats_out',[]); a.push(name); APP.set('cats_out',a);} else {var a=APP.get('cats_in',[]); a.push(name); APP.set('cats_in',a);} render();
}
function delCat(type,i){
 if(!confirm('مسح التصنيف؟')) return;
 if(type==='out'){var a=APP.get('cats_out',[]); a.splice(i,1); APP.set('cats_out',a);} else {var a=APP.get('cats_in',[]); a.splice(i,1); APP.set('cats_in',a);} render();
}
let editId=null;
function editExp(id){var e=APP.get('expenses',[]).find(function(x){return x.id===id}); if(!e) return; editId=id; openM(e);}

function openM(pref){
 var today=new Date().toISOString().slice(0,10);
 var f=''; var isEdit=!!pref;
 document.getElementById('mTitle').innerText = isEdit? 'تعديل' : (topT==='attendance'?'حضور احترافي - جدول':'إضافة');
 if(topT==='expenses'){
   var catsOut=APP.get('cats_out',[]), catsIn=APP.get('cats_in',[]);
   var selOut=catsOut.map(function(c){return '<option '+(pref&&pref.cat===c?'selected':'')+'>'+c+'</option>';}).join('');
   var selIn=catsIn.map(function(c){return '<option '+(pref&&pref.cat===c?'selected':'')+'>'+c+'</option>';}).join('');
   f='<label class="label">النوع</label><select id="f_t" class="inp" onchange="renderCatOptions()"><option value="outcome" '+(pref&&pref.type==='outcome'?'selected':'')+'>💸 مصروف</option><option value="income" '+(pref&&pref.type==='income'?'selected':'')+'>💰 مدخلات</option></select><label class="label">التصنيف</label><select id="f_cat" class="inp"></select><div id="catBox"></div><label class="label">المبلغ</label><input id="f_a" class="inp" type="number" placeholder="10000" value="'+(pref?pref.amount:'')+'"><label class="label">الوصف</label><input id="f_d" class="inp" placeholder="تفاصيل" value="'+(pref?pref.desc||'':'')+'"><label class="label">التاريخ</label><input id="f_date" class="inp" type="date" value="'+(pref?pref.date:today)+'">';
 }
 if(topT==='debts'){f='<label class="label">الاسم</label><input id="f_p" class="inp"><label class="label">المبلغ</label><input id="f_a" class="inp" type="number"><select id="f_t" class="inp"><option>لنا</option><option>علينا</option></select><input id="f_note" class="inp" placeholder="ملاحظة">';}
 if(topT==='attendance'){
   f='<label class="label">📅 التاريخ</label><input id="f_date" class="inp" type="date" value="'+(pref?pref.date:today)+'"><div style="display:flex;gap:8px"><div style="flex:1"><label class="label">⏰ دخول (الساعة)</label><input id="f_in" class="inp" type="time" value="'+(pref?pref.checkIn:'09:00')+'"></div><div style="flex:1"><label class="label">🏁 خروج</label><input id="f_out" class="inp" type="time" value="'+(pref?pref.checkOut:'17:00')+'"></div></div><label class="label">💵 سعر الساعة</label><input id="f_rate" class="inp" type="number" placeholder="مثلاً 26" value="'+(pref?pref.rate:26)+'" oninput="calcLive()"><div style="display:flex;gap:8px"><div style="flex:1"><label class="label">📌 المطلوب يوميا (ساعة)</label><input id="f_req" class="inp" type="number" value="'+(pref?pref.required:8)+'"></div><div style="flex:1"><label class="label">🌅 النورين الصباحية</label><input id="f_morn" class="inp" type="number" value="'+(pref?pref.morning:0)+'"></div></div><label class="label">💸 الضريبة / خصم</label><input id="f_tax" class="inp" type="number" value="'+(pref?pref.tax:0)+'" oninput="calcLive()"><label class="label">📌 الحالة</label><select id="f_st" class="inp"><option value="حاضر" '+(pref&&pref.status==='حاضر'?'selected':'')+'>✅ حاضر</option><option value="غائب" '+(pref&&pref.status==='غائب'?'selected':'')+'>❌ غائب</option><option value="متأخر" '+(pref&&pref.status==='متأخر'?'selected':'')+'>⏰ متأخر</option></select><div id="liveCalc" style="background:#0F7A3D11;border:1px solid #0F7A3D33;border-radius:12px;padding:10px;margin-top:12px;font-size:11px">سيتم الحساب تلقائي...</div>';
 }
 if(topT==='notes') f='<input id="f_ti" class="inp" placeholder="عنوان" value="'+(pref?pref.title:'')+'"><textarea id="f_c" class="inp" style="height:80px;padding-top:10px" placeholder="المحتوى">'+(pref?pref.content||'':'')+'</textarea>';
 document.getElementById('mFields').innerHTML=f;
 document.getElementById('modal').classList.add('show');
 if(topT==='expenses'){ renderCatOptions(); if(pref) document.getElementById('f_cat').value=pref.cat; }
 if(topT==='attendance') setTimeout(calcLive,100);
}
function renderCatOptions(){
 var t=document.getElementById('f_t'); if(!t) return;
 var type=t.value;
 var cats=type==='outcome'?APP.get('cats_out',[]):APP.get('cats_in',[]);
 document.getElementById('f_cat').innerHTML=cats.map(function(c){return '<option>'+c+'</option>';}).join('');
}
function calcLive(){
 var cin=document.getElementById('f_in')?document.getElementById('f_in').value:'09:00';
 var cout=document.getElementById('f_out')?document.getElementById('f_out').value:'17:00';
 var rate=Number(document.getElementById('f_rate')?document.getElementById('f_rate').value:0);
 var tax=Number(document.getElementById('f_tax')?document.getElementById('f_tax').value:0);
 var a=cin.split(':').map(Number), b=cout.split(':').map(Number);
 var diff=(b[0]*60+b[1])-(a[0]*60+a[1]); if(diff<0) diff+=1440;
 var hours=diff/60; var net=hours*rate; var finalNet=net-tax;
 var el=document.getElementById('liveCalc');
 if(el) el.innerHTML='⏱ عدد الساعات: <b>'+hours.toFixed(2)+'</b> ساعة<br>💰 الصافي: <b>'+fmt(net)+'ج</b> ( '+hours.toFixed(2)+' × '+fmt(rate)+' )<br>🧾 بعد الضريبة/الخصم: <b style="color:#4ade80">'+fmt(finalNet)+'ج</b>';
}
function closeM(){document.getElementById('modal').classList.remove('show'); editId=null;}
function saveItem(){
 var id=editId||uid();
 if(topT==='expenses'){
   var arr=APP.get('expenses',[]);
   var obj={id:id,amount:Number(document.getElementById('f_a').value)||0,desc:document.getElementById('f_d').value,type:document.getElementById('f_t').value,cat:document.getElementById('f_cat').value,date:document.getElementById('f_date').value};
   if(editId){var idx=arr.findIndex(function(x){return x.id===editId}); if(idx>-1) arr[idx]=obj; else arr.push(obj);} else arr.push(obj);
   APP.set('expenses',arr);
 }
 if(topT==='debts'){var a=APP.get('debts',[]); a.push({id:id,person:document.getElementById('f_p').value,amount:Number(document.getElementById('f_a').value)||0,type:document.getElementById('f_t').value,note:document.getElementById('f_note').value}); APP.set('debts',a);}
 if(topT==='attendance'){
   var cin=document.getElementById('f_in').value, cout=document.getElementById('f_out').value;
   var a1=cin.split(':').map(Number), b1=cout.split(':').map(Number);
   var diff=(b1[0]*60+b1[1])-(a1[0]*60+a1[1]); if(diff<0) diff+=1440;
   var hours=diff/60;
   var rate=Number(document.getElementById('f_rate').value||0);
   var req=Number(document.getElementById('f_req').value||0);
   var morn=Number(document.getElementById('f_morn').value||0);
   var tax=Number(document.getElementById('f_tax').value||0);
   var net=hours*rate; var finalNet=net-tax;
   var arr=APP.get('attendance',[]);
   arr.push({id:id,date:document.getElementById('f_date').value,checkIn:cin,checkOut:cout,totalHours:parseFloat(hours.toFixed(2)),rate:rate,required:req,morning:morn,tax:tax,net:Math.round(net),finalNet:Math.round(finalNet),status:document.getElementById('f_st').value});
   APP.set('attendance',arr);
 }
 if(topT==='notes'){var a=APP.get('notes',[]); a.push({id:id,title:document.getElementById('f_ti').value,content:document.getElementById('f_c').value}); APP.set('notes',a);}
 closeM(); render();
}
function delItem(k,id){if(confirm('مسح؟')){APP.set(k,APP.get(k,[]).filter(function(x){return x.id!==id})); render();}}
function exportExcel(){
 var wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(APP.get('expenses',[])),'مصروفاتي');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(APP.get('attendance',[])),'الحضور');
 XLSX.writeFile(wb,'مشروعي.xlsx');
}
async function syncSheet(){var url=localStorage.getItem('gs_url')||prompt('لينك Google Apps Script:'); if(!url) return; localStorage.setItem('gs_url',url); var payload={expenses:APP.get('expenses',[]),attendance:APP.get('attendance',[])}; try{await fetch(url,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)}); alert('✅ اترفع');}catch(e){alert('❌ فشل');}}
render();
