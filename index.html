<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMAR PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column}
.h{height:56px;background:#15803D;display:flex;justify-content:space-between;align-items:center;padding:0 14px;margin:4px;border-radius:12px}
.page{display:none;flex:1;overflow:auto;padding:10px;background:#0A0A0A}
.page.on{display:block}
.card{background:#1A1A1A;border:1px solid #222;border-radius:12px;padding:12px;margin-bottom:8px}
.top{display:flex;gap:6px;background:#111;padding:5px;border-radius:10px;margin-bottom:10px}
.top button{flex:1;height:32px;border:0;background:transparent;color:#777;border-radius:8px}
.top button.on{background:#15803D;color:#fff}
.bottom{height:72px;background:#151515;border-top:1px solid #222;display:flex;align-items:center}
.b{flex:1;text-align:center;color:#666;font-size:10px}
.b.on{color:#15803D}
.plusW{flex:1;display:flex;justify-content:center}
.plus{width:60px;height:60px;background:#15803D;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin-top:-34px;border:4px solid #000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;z-index:99;flex-direction:column}
.modal.on{display:flex}
.inp{width:100%;height:42px;background:#111;border:1px solid #333;border-radius:10px;color:#fff;padding:0 10px;margin-top:8px}
.btn{width:100%;height:42px;background:#15803D;border:0;border-radius:10px;color:#fff;margin-top:10px;font-weight:700}
.item{padding:14px;border-bottom:1px solid #222}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:#111;color:#888;padding:8px;border:1px solid #222}
td{padding:7px;border:1px solid #222;text-align:center}
.edit{width:60px;background:#000;border:1px solid #15803D;border-radius:6px;color:#fff;text-align:center}
</style>
</head>
<body>
<div class="h"><div>OMAR EGP <span id="balTop">0</span></div><div>EGP ▼</div></div>

<div id="p1" class="page on"><div class="card"><span>الدخل </span><b id="sInc">0ج</b> | الرصيد <b id="sBal">0ج</b></div><div id="l1"></div></div>
<div id="p2" class="page"><div class="card"><span>المصروف </span><b id="sOut">0ج</b></div><div id="l2"></div></div>
<div id="p3" class="page"><div class="top"><button id="d0" class="on" onclick="setD(0)">الكل</button><button id="d1" onclick="setD(1)">لنا</button><button id="d2" onclick="setD(2)">علينا</button></div><div id="l3"></div></div>
<div id="p4" class="page">
<div class="card" style="padding:0;overflow:auto"><table><tr><th>الساعه</th><th>كم يوم</th><th>سعر الساعه</th><th>عدد الساعات</th><th>الصافي</th><th>المطلوب</th><th>يوميا</th><th>ديون صيدليه</th><th>المتبقي</th><th>حفظ</th></tr><tr>
<td><input id="cfgH" class="edit" value="1100"></td><td id="cDays">0</td><td id="cPrice">42</td><td id="cHours">0</td><td id="cNet">0</td><td><input id="cfgReq" class="edit" value="15000"></td><td id="cDaily">0</td><td id="cPharm">0</td><td id="cLeft">0</td><td><button onclick="saveCfg()" style="background:#15803D;border:0;border-radius:6px;color:#fff;padding:4px 8px">💾</button></td>
</tr></table></div>
<div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>يوم</th><th>التاريخ</th><th>حضور</th><th>انصراف</th><th>الصافي</th><th>ملاحظات</th><th>مسح</th></tr></thead><tbody id="attBody"></tbody></table></div>
</div>
<div id="p5" class="page"><div id="l5"></div></div>
<div id="p6" class="page"><div id="l6"></div></div>

<div class="bottom">
<div class="b on" id="b1" onclick="goTab(1)">الدخل</div>
<div class="b" id="b2" onclick="goTab(2)">المصروف</div>
<div class="b" id="b3" onclick="goTab(3)">الديون</div>
<div class="plusW"><div class="plus" onclick="openPlus()">+</div></div>
<div class="b" id="b4" onclick="goTab(4)">الحضور</div>
<div class="b" id="b5" onclick="goTab(5)">ملاحظات</div>
<div class="b" id="b6" onclick="goTab(6)">اليومية</div>
</div>

<div id="catBox" class="modal"><div style="background:#222;padding:12px;display:flex;justify-content:space-between"><b>الأقسام - ضيف غسيل</b><span onclick="hideBox('catBox')">X</span></div><div style="display:flex;gap:6px;padding:10px;background:#111"><input id="newCat" class="inp" style="margin:0" placeholder="بند جديد غسيل"><button onclick="addCat()" style="background:#15803D;border:0;border-radius:8px;color:#fff;padding:0 12px">إضافة</button></div><div id="catList" style="flex:1;overflow:auto;background:#000"></div></div>
<div id="addBox" class="modal"><div style="background:#1E1E1E;margin:auto;width:92%;max-width:360px;border-radius:14px;padding:14px"><h3 id="addTitle">إضافة</h3><div id="addFields"></div><button class="btn" onclick="doSave()">حفظ</button><button class="btn" style="background:#333" onclick="hideBox('addBox')">إلغاء</button></div></div>

<script>
var cur=1,curD=0,curCatName='',editId=null;
function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function fmt(n){return Number(n||0).toLocaleString()}
function uid(){return 'x'+Math.random().toString(36).slice(2,6)}
var inCats, outCats;
try{inCats=JSON.parse(localStorage.getItem('inCats')); if(!inCats) throw 0}catch(e){inCats=["الراتب","مكافأة","غسيل"]}
try{outCats=JSON.parse(localStorage.getItem('outCats')); if(!outCats) throw 0}catch(e){outCats=["اكل صيدليه","اكل البيت","غسيل","البنزين","ديون الصيدلية","مواصلات"]}

function goTab(n){cur=n; for(var i=1;i<=6;i++){document.getElementById('p'+i).classList.remove('on');document.getElementById('b'+i).classList.remove('on')} document.getElementById('p'+n).classList.add('on'); document.getElementById('b'+n).classList.add('on'); renderAll()}
function setD(n){curD=n; document.getElementById('d0').className=n==0?'on':''; document.getElementById('d1').className=n==1?'on':''; document.getElementById('d2').className=n==2?'on':''; renderAll()}
function hideBox(id){document.getElementById(id).classList.remove('on'); editId=null}
function toTime(v){ if(v==''||v==null) return '-'; var num=Number(v); if(isNaN(num)) return v; var h=Math.floor(num); var m=Math.round((num-h)*60); var isPM=h>=12; var hh=h; if(hh==0) hh=12; if(hh>12) hh-=12; var mm=m<10?'0'+m:m; return hh+':'+mm+(isPM?' م':' ص')}
function openPlus(){ editId=null; if(cur==1||cur==2){document.getElementById('catBox').classList.add('on'); showCats(); return} document.getElementById('addBox').classList.add('on'); buildForm(null)}
function showCats(){ var h=''; var list=cur==1?inCats:outCats; for(var i=0;i<list.length;i++){ h+='<div class="item" data-n="'+list[i]+'" onclick="pickCat(this)">'+list[i]+'</div>' } document.getElementById('catList').innerHTML=h}
function addCat(){ var v=document.getElementById('newCat').value.trim(); if(!v) return; if(cur==1){inCats.push(v); save('inCats',inCats)} else {outCats.push(v); save('outCats',outCats)} document.getElementById('newCat').value=''; showCats()}
function pickCat(el){ curCatName=el.getAttribute('data-n'); hideBox('catBox'); document.getElementById('addBox').classList.add('on'); buildForm(null)}
function buildForm(o){
 var f='';
 if(cur==1||cur==2){ document.getElementById('addTitle').innerText='إضافة '+curCatName; f='<input id="f1" class="inp" type="number" placeholder="المبلغ" value="'+(o?o.a:'')+'"><input id="f2" class="inp" placeholder="ملاحظة" value="'+(o?o.n:'')+'">'; }
 else if(cur==3){ document.getElementById('addTitle').innerText='دين - الصيدلية جدول'; f='<input id="f1" class="inp" placeholder="الاسم - الصيدليه / احمد سلف" value="'+(o?o.p:'')+'"><input id="f2" class="inp" type="number" placeholder="الإجمالي 1000" value="'+(o?o.a:'')+'"><input id="f3" class="inp" type="number" placeholder="المدفوع 300" value="'+(o?o.paid||'')+'"><select id="f4" class="inp"><option value="علينا">علينا</option><option value="لنا">لنا</option></select>'; }
 else if(cur==4){ document.getElementById('addTitle').innerText='حضور'; f='<input id="f1" class="inp" type="date" value="'+(o?o.d:new Date().toISOString().slice(0,10))+'"><input id="f2" class="inp" type="number" placeholder="حضور 9 = 9ص - 19 = 7م" value="'+(o?o.inN||'')+'"><input id="f3" class="inp" type="number" placeholder="انصراف 17" value="'+(o?o.outN||'')+'"><input id="f4" class="inp" placeholder="ملاحظات" value="'+(o?o.nt||'')+'">'; }
 else { document.getElementById('addTitle').innerText='إضافة'; f='<input id="f1" class="inp" placeholder="العنوان" value="'+(o?o.t:'')+'"><input id="f2" class="inp" placeholder="تفاصيل" value="'+(o?o.c||'')+'">'; }
 document.getElementById('addFields').innerHTML=f;
 if(o && o.t){ var sel=document.getElementById('f4'); if(sel) sel.value=o.t; }
}
function doSave(){
 if(cur==1){ var arr=load('income'); var obj={id:editId||uid(),c:curCatName,a:Number(document.getElementById('f1').value||0),n:document.getElementById('f2').value}; if(editId){for(var i=0;i<arr.length;i++) if(arr[i].id==editId) arr[i]=obj;} else arr.push(obj); save('income',arr); }
 else if(cur==2){ var arr=load('outcome'); var obj={id:editId||uid(),c:curCatName,a:Number(document.getElementById('f1').value||0),n:document.getElementById('f2').value}; if(editId){for(var i=0;i<arr.length;i++) if(arr[i].id==editId) arr[i]=obj;} else arr.push(obj); save('outcome',arr); }
 else if(cur==3){ var arr=load('debts'); var obj={id:editId||uid(),p:document.getElementById('f1').value,a:Number(document.getElementById('f2').value||0),paid:Number(document.getElementById('f3').value||0),t:document.getElementById('f4').value}; if(editId){for(var i=0;i<arr.length;i++) if(arr[i].id==editId) arr[i]=obj;} else arr.push(obj); save('debts',arr); }
 else if(cur==4){ var arr=load('att'); var inN=document.getElementById('f2').value; var outN=document.getElementById('f3').value; var obj={id:editId||uid(),d:document.getElementById('f1').value,inN:inN,outN:outN,in:toTime(inN),out:toTime(outN),h:Math.abs(Number(outN)-Number(inN)),nt:document.getElementById('f4').value}; if(editId){for(var i=0;i<arr.length;i++) if(arr[i].id==editId) arr[i]=obj;} else arr.push(obj); save('att',arr); }
 else if(cur==5){ var arr=load('notes'); arr.push({id:uid(),t:document.getElementById('f1').value,c:document.getElementById('f2').value}); save('notes',arr); }
 else { var arr=load('tasks'); arr.push({id:uid(),t:document.getElementById('f1').value}); save('tasks',arr); }
 hideBox('addBox'); renderAll();
}
function delItem(k,id){ if(confirm('مسح؟')){ save(k,load(k).filter(function(x){return x.id!=id})); renderAll(); } }
function saveCfg(){ localStorage.setItem('cfgH',document.getElementById('cfgH').value); localStorage.setItem('cfgReq',document.getElementById('cfgReq').value); renderAll(); }
function renderAll(){
 var inc=load('income'), out=load('outcome'), deb=load('debts'), att=load('att');
 var si=0,so=0; for(var i=0;i<inc.length;i++) si+=inc[i].a; for(var i=0;i<out.length;i++) so+=out[i].a;
 document.getElementById('sInc').innerText=fmt(si)+'ج'; document.getElementById('sOut').innerText=fmt(so)+'ج'; document.getElementById('sBal').innerText=fmt(si-so)+'ج'; document.getElementById('balTop').innerText='EGP '+fmt(si-so+69050);
 var h=''; for(var i=inc.length-1;i>=0;i--) h+='<div class="card"><div>'+inc[i].c+' - '+fmt(inc[i].a)+'ج <small>'+inc[i].n+'</small></div><div onclick="delItem(\'income\',\''+inc[i].id+'\')">🗑️</div></div>'; document.getElementById('l1').innerHTML=h||'لا يوجد دخل - دوس + وضيف غسيل';
 h=''; for(var i=out.length-1;i>=0;i--) h+='<div class="card"><div>'+out[i].c+' - '+fmt(out[i].a)+'ج</div><div onclick="delItem(\'outcome\',\''+out[i].id+'\')">🗑️</div></div>'; document.getElementById('l2').innerHTML=h||'لا يوجد مصروف';
 var grouped={}; for(var i=0;i<deb.length;i++){ var key=deb[i].p.trim(); if(!grouped[key]) grouped[key]={p:key,a:0,paid:0,t:deb[i].t}; grouped[key].a+=deb[i].a; grouped[key].paid+=deb[i].paid; }
 var list=[]; for(var k in grouped) list.push(grouped[k]); if(curD==1) list=list.filter(function(x){return x.t=='لنا'}); if(curD==2) list=list.filter(function(x){return x.t=='علينا'});
 h=''; for(var i=0;i<list.length;i++){ var d=list[i]; var rem=d.a-d.paid; var col=d.t=='لنا'?'#15803D':'#f87171'; h+='<div class="card" style="border-right:4px solid '+col+'"><div style="display:flex;justify-content:space-between"><b>'+d.p+'</b><span style="color:'+col+'">'+d.t+' متبقي '+fmt(rem)+'ج</span></div><div style="display:flex;gap:1px;margin-top:8px;background:#222"><div style="flex:1;background:#111;padding:6px;text-align:center">الإجمالي<br><b>'+fmt(d.a)+'ج</b></div><div style="flex:1;background:#111;padding:6px;text-align:center">المدفوع<br><b style="color:#4ade80">'+fmt(d.paid)+'ج</b></div><div style="flex:1;background:#111;padding:6px;text-align:center">المتبقي<br><b>'+fmt(rem)+'ج</b></div></div></div>'; }
 document.getElementById('l3').innerHTML=h||'مثال: الصيدليه 1000 مدفوع 300 متبقي 700';
 var cfgH=Number(localStorage.getItem('cfgH')||1100), cfgReq=Number(localStorage.getItem('cfgReq')||15000);
 var totalH=0; for(var i=0;i<att.length;i++) totalH+=att[i].h; var pharm=0; for(var i=0;i<list.length;i++) if(list[i].p.indexOf('صيد')>-1) pharm+=list[i].a-list[i].paid;
 document.getElementById('cDays').innerText=att.length||26; document.getElementById('cPrice').innerText=42; document.getElementById('cHours').innerText=totalH.toFixed(0); document.getElementById('cNet').innerText=fmt(totalH*42); document.getElementById('cDaily').innerText=(cfgReq/(att.length||26)).toFixed(2); document.getElementById('cPharm').innerText=fmt(pharm); document.getElementById('cLeft').innerText=fmt(totalH*42-cfgReq-pharm);
 var body=''; var now=new Date(); var y=now.getFullYear(), m=now.getMonth(); var days=new Date(y,m+1,0).getDate();
 for(var d=1;d<=days;d++){ var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); var f=null; for(var j=0;j<att.length;j++) if(att[j].d==ds) f=att[j]; if(f) body+='<tr><td>'+d+'</td><td>'+ds+'</td><td>'+f.in+'</td><td>'+f.out+'</td><td>'+f.h+'</td><td>'+(f.nt||'')+'</td><td><span onclick="delItem(\'att\',\''+f.id+'\')">🗑️</span></td></tr>'; else body+='<tr><td>'+d+'</td><td>'+ds+'</td><td>-</td><td>-</td><td>-</td><td>-</td><td></td></tr>'; }
 document.getElementById('attBody').innerHTML=body;
}
renderAll();
</script>
</body>
</html>
