<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#10b981">
<meta name="description" content="يومياتي Pro - نظام إدارة اليومية والحضور والمهام">
<title>يومياتي Pro V6.2</title>

<link rel="manifest" href="manifest.json?v=6.2">
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=6.2">

<style>
  /* تحميل أولي عشان ميبانش أبيض */
  #loader{position:fixed; inset:0; background:#f6f8f7; display:grid; place-items:center; z-index:9999; transition:.3s}
  #loader.hide{opacity:0; pointer-events:none}
  .app{opacity:0; transition:.3s} .app.ready{opacity:1}
</style>
</head>
<body>

<div id="loader">
  <div style="text-align:center">
    <div style="width:48px; height:48px; border:4px solid #d1fae5; border-top-color:#10b981; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 12px"></div>
    <b style="color:#10b981; font-family:'Cairo'">يومياتي Pro V6.2</b>
  </div>
</div>

<div class="app" id="app">
  <header class="top">
    <span id="dateTop">جاري التحميل...</span>
    <b>💼 يومياتي Pro V6.2</b>
  </header>
  <main id="root">
    <div class="card" style="text-align:center; padding:32px">
      <p>جاري تحميل البيانات...</p>
    </div>
  </main>
  <nav class="nav" id="nav">
    <button data-t="dashboard" class="active">🏠<br>الرئيسية</button>
    <button data-t="daily">💰<br>اليومية</button>
    <button data-t="attendance">🕒<br>الحضور</button>
    <button data-t="notes">📝<br>ملاحظات</button>
    <button data-t="tasks">✅<br>مهام</button>
  </nav>
</div>

<script type="module">
// منع كاش GitHub Pages
const v = '6.2';
import(`./js/app.js?v=${v}`).then(m=>{
  document.getElementById('loader').classList.add('hide');
  document.getElementById('app').classList.add('ready');
}).catch(err=>{
  console.error(err);
  document.getElementById('root').innerHTML = `
    <div class="card" style="background:#fee2e2; border:1px solid #fecaca; color:#991b1b">
      <b>⚠️ خطأ في التحميل</b><br>
      <small>${err.message}</small><br><br>
      <button class="btn" onclick="localStorage.clear(); caches.keys().then(k=>k.forEach(n=>caches.delete(n))); location.reload(true);">مسح الكاش وإعادة التحميل</button>
    </div>`;
  document.getElementById('loader').classList.add('hide');
  document.getElementById('app').classList.add('ready');
});

// إلغاء تسجيل Service Worker القديم البايظ لو موجود
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>{ if(r.scope.includes('Omar-2')) r.unregister(); });
  });
}
</script>

<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>
