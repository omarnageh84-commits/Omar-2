<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OMAR PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{display:flex;flex-direction:column;color:#fff}
.h{height:56px;background:#15803D;display:flex;justify-content:space-between;align-items:center;padding:0 14px;flex-shrink:0;border-radius:14px 14px 0 0;margin:4px 4px 0}
.page{flex:1;overflow:auto;background:#0A0A0A;padding:12px;display:none}
.page.show{display:flex;flex-direction:column}
.card{background:#1E1E1E;border:1px solid #222;border-radius:14px;padding:14px;margin-bottom:10px}
.subTabs{display:flex;gap:6px;margin-bottom:12px;background:#111;padding:6px;border-radius:12px}
.subTabs button{flex:1;height:36px;border-radius:8px;border:0;background:transparent;color:#777;font-size:12px;font-weight:700}
.subTabs button.on{background:#15803D;color:#fff}
.bottom{height:78px;background:#151515;border-top:1px solid #222;display:flex;align-items:center;flex-shrink:0}
.bItem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#666;font-size:10px}
.bItem.on{color:#15803D}
.bItem b{font-size:16px}
.plusW{flex:1;display:flex;justify-content:center}
.plus{width:66px;height:66px;border-radius:50%;background:#15803D;display:grid;place-items:center;font-size:34px;color:#fff;margin-top:-42px;border:4px solid #000;box-shadow:0 0 22px rgba(21,128,61,.7)}
.modal{position:fixed;inset:0;background:#000e;display:none;z-index:99;flex-direction:column}
.modal.show{display:flex}
.mTop{height:54px;background:#222;display:flex;justify-content:space-between;align-items:center;padding:0 14px;flex-shrink:0}
.mTabs{display:flex;background:#222}
.mTabs button{flex:1;height:44px;background:transparent;border:0;color:#777;border-bottom:3px solid transparent;font-weight:700}
.mTabs button.on{color:#fff;border-color:#15803D}
.sBar{background:#1A1A1A;padding:10px 14px;display:flex;gap:8px;border-bottom:1px solid #222}
.sBar input{flex:1;background:transparent;border:0;color:#fff;outline:none}
.list{flex:1;overflow:auto;background:#0A0A0A}
.mainC{padding:14px 16px;background:#111;border-bottom:1px solid #222;display:flex;justify-content:space-between;font-weight:800}
.subC{padding:12px 24px 12px 50px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #151515}
.subC.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:#fff}
.table{width:100%;border-collapse:collapse;font-size:11px}
.table th{background:#151515;padding:8px;border:1px solid #222}
.table td{padding:8px;border:1px solid #222;text-align:center}
.inp{width:100%;height:44px;background:#111;border:1px solid #333;border-radius:12px;padding:0 12px;color:#fff;margin-top:8px;outline:none}
.btn{width:100%;height:46px;background:#15803D;border:0;border-radius:12px;color:#fff;font-weight:800;margin-top:12px}
</style>
</head>
<body>
<div class="h">
<div style="font-size:12px">▼ الجنيه المصري</div>
<div><b>🔒 OMAR</b> <span id="totalTop" style="font-size:12px;margin-right:6px">EGP 0</span></div>
</div>

<div id="p-income" class="page show">
<div class="card" style="display:flex;justify-content:space-between"><span>الدخل: <b id="sumInc">0ج</b></span><span id="countInc" style="opacity:.5">0</span></div>
<div id="list-income"></div>
</div>

<div id="p-outcome" class="page">
<div class="card" style="display:flex;justify-content:space-between"><span>المصروف: <b id="sumOut" style="color:#f87171">0ج</b></span><span id="countOut" style="opacity:.5">0</span></div>
<div id="list-outcome"></div>
</div>

<div id="p-debts" class="page">
<div class="subTabs">
<button class="on" id="dTab-net" onclick="setDebtTab('net')">الصافي</button>
<button id="dTab-lana" onclick="setDebtTab('lana')">لنا</button>
<button id="dTab-alayna" onclick="setDebtTab('alayna')">علينا</button>
</div>
<div class="card" style="text-align:center"><div style="font-size:11px;opacity:.6">صافي الديون</div><div id="debtNet" style="font-size:24px;font-weight:800;color:#4ade80">0ج</div><div style="display:flex;justify-content:space-around;margin-top:8px;font-size:12px"><span>لنا <b id="debtLana">0</b></span><span>علينا <b id="debtAlayna" style="color:#f87171">0</b></span></div></div>
<div id="list-debts"></div>
</div>

<div id="p-att" class="page">
<div class="card" style="padding:0;overflow:hidden"><table class="table"><thead><tr><th>يوم</th><th>حضور</th><th>انصراف</th><th>الصافي</th><th>ملاحظات</th></tr></thead><tbody id="att-body"></tbody></table></div>
</div>

<div id="p-notes" class="page">
<div class="subTabs"><button class="on">الكل</button><button>اليوم</button><button>مهم</button></div>
<div id="list-notes"></div>
</div>

<div class="bottom">
<div class="bItem on" id="bt-income" onclick="go('income')"><b>💰</b><span>الدخل</span></div>
<div class="bItem" id="bt-outcome" onclick="go('outcome')"><b>💸</b><span>المصروف</span></div>
<div class="plusW"><div class="plus" onclick="plusAction()">+</div></div>
<div class="bItem" id="bt-att" onclick="go('att')"><b>⏰</b><span>الحضور</span></div>
<div class="bItem" id="bt-notes" onclick="go('notes')"><b>📋</b><span>اليومية</span></div>
</div>

<!-- مودال الأقسام -->
<div id="modalCats" class="modal">
<div class="mTop"><span onclick="closeCats()" style="font-size:22px">←</span><b>الأقسام</b><span>⇄</span></div>
<div class="mTabs">
<button id="cTab-debts" onclick="switchCat('debts')">الديون</button>
<button id="cTab-out" class="on" onclick="switchCat('out')">المصروف</button>
<button id="cTab-in" onclick="switchCat('in')">الدخل</button>
</div>
<div class="sBar"><span>🔍</span><input id="searchCat" placeholder="بحث" oninput="renderCats()"></div>
<div id="catBox" class="list"></div>
</div>

<!-- مودال إضافة -->
<div id="modalAdd" class="modal" style="background:#000d;justify-content:center;align-items:center;padding:14px">
<div style="background:#1E1E1E;border-radius:18px;width:100%;max-width:360px;padding:16px">
<h3 id="addTitle">إضافة</h3>
<div id="addFields"></div>
<div style="display:flex;gap:8px;margin-top:12px"><button onclick="saveAdd()" class="btn" style="flex:1;margin:0">حفظ</button><button onclick="closeAdd()" style="flex:1;height:46px;background:#222;border:1px solid #333;border-radius:12px;color:#fff">إلغاء</button></div>
</div>
</div>

<script>
const APP={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}}
const uid=()=>Math.random().toString(36).slice(2,5)
const fmt=n=>Number(n||0).toLocaleString()
let cur='income', curDebt='net', curCat='out', sel=''

const inCats=[
{n:'امانات',c:'#1a4d1a',i:'●'},{n:'دي دي',c:'#15803D',i:'●'},{n:'جمايل',c:'#1e88e5',i:'●'},{n:'فودافون كاش',c:'#e53935',i:'🧶'},{n:'البيت',c:'#ff9800',i:'RENT'},{n:'انستا',c:'#00bcd4',i:'💳'},{n:'الراتب',c:'#ffeb3b',i:'💵'},{n:'المكافآت',c:'#3f51b5',i:'🏆'},{n:'الهدايا',c:'#4caf50',i:'🎁'},{n:'توصيل',c:'#ff5722',i:'SALE!'},{n:'أخرى',c:'#ff8a65',i:'💖'}
]
const outCats=[
{m:'الاكل',ic:'🥗',co:'#ff7043',subs:[{n:'اكل صيدليه',i:'🍵',co:'#8d6e63'},{n:'اكل البيت',i:'🍱',co:'#5c6bc0'},{n:'اكل خارجي و ترفيه',i:'🧁',co:'#ab47bc'},{n:'منظفات',i:'●',co:'#15803D'},{n:'عزومات',i:'●',co:'#222'}]},
{m:'المواصلات',ic:'🔧',co:'#66bb6a',subs:[{n:'البنزين',i:'⛽',co:'#ffeb3b'},{n:'الصيانة',i:'🔧',co:'#66bb6a'},{n:'الجراج',i:'P',co:'#64b5f6'},{n:'الأجرة',i:'🚕',co:'#ffa726'},{n:'زيت',i:'●',co:'#7c4dff'},{n:'دي دي',i:'●',co:'#6a1b9a'}]}
]

function go(t){cur=t;document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));document.getElementById('p-'+t).classList.add('show');document.querySelectorAll('.bItem').forEach(b=>b.classList.remove('on'));document.getElementById('bt-'+t).classList.add('on');render()}
function setDebtTab(t){curDebt=t;document.querySelectorAll('#p-debts.subTabs button').forEach(b=>b.classList.remove('on'));document.getElementById('dTab-'+t).classList.add('on');render()}
function plusAction(){
 if(cur==='att'||cur==='notes'||cur==='debts'){openForm('','');document.getElementById('modalAdd').classList.add('show');return}
 document.getElementById('modalCats').classList.add('show');switchCat(cur==='income'?'in':'out')
}
function closeCats(){document.getElementById('modalCats').classList.remove('show')}
function switchCat(t){curCat=t;document.querySelectorAll('.mTabs button').forEach(b=>b.classList.remove('on'));document.getElementById('cTab-'+t).classList.add('on');renderCats()}
function renderCats(){
 let q=(document.getElementById('searchCat').value||'').toLowerCase(),h=''
 if(curCat==='in'){
  inCats.forEach(x=>{if(q&&!x.n.toLowerCase().includes(q))return;h+=`<div class="subC" onclick="pick('${x.n}')"><span>${x.n}</span><span class="dot" style="background:${x.c}">${x.i}</span></div>`})
 }else{
  outCats.forEach(g=>{
   if(q&&!g.m.includes(q)&&!g.subs.some(s=>s.n.includes(q)))return;
   h+=`<div class="mainC">${g.m}<span style="background:${g.co};width:36px;height:36px;border-radius:50%;display:grid;place-items:center">${g.ic}</span></div>`
   g.subs.forEach(s=>{if(q&&!s.n.toLowerCase().includes(q))return;h+=`<div class="subC" onclick="pick('${s.n}')"><span>${s.n}</span><span class="dot" style="background:${s.co}">${s.i}</span></div>`})
  })
 }
 document.getElementById('catBox').innerHTML=h
}
function pick(n){sel=n;closeCats();openForm(n);document.getElementById('modalAdd').classList.add('show')}

function openForm(n){
 let f=''
 if(cur==='income'||curCat==='in'){
  document.getElementById('addTitle').innerText='إضافة دخل - '+n
  f=`<div style="font-size:11px;opacity:.6">${n}</div><input id="a1" class="inp" type="number" placeholder="المبلغ"><input id="a2" class="inp" placeholder="ملاحظة"><input id="a3" class="inp" type="date" value="${new Date().toISOString().slice(0,10)}">`
 }else if(cur==='outcome'||curCat==='out'){
  document.getElementById('addTitle').innerText='إضافة مصروف - '+n
  f=`<div style="font-size:11px;opacity:.6">${n}</div><input id="a1" class="inp" type="number" placeholder="المبلغ"><input id="a2" class="inp" placeholder="ملاحظة"><input id="a3" class="inp" type="date" value="${new Date().toISOString().slice(0,10)}">`
 }else if(cur==='debts'){
  document.getElementById('addTitle').innerText='إضافة دين'
  f=`<input id="b1" class="inp" placeholder="اسم الشخص"><input id="b2" class="inp" type="number" placeholder="المبلغ"><select id="b3" class="inp"><option value="لنا">لنا</option><option value="علينا">علينا</option></select>`
 }else if(cur==='att'){
  document.getElementById('addTitle').innerText='إضافة حضور'
  f=`<input id="c1" class="inp" type="date" value="${new Date().toISOString().slice(0,10)}"><div style="display:flex;gap:8px"><input id="c2" class="inp" type="time" value="09:00"><input id="c3" class="inp" type="time" value="17:00"></div><input id="c4" class="inp" placeholder="ملاحظات">`
 }else{
  document.getElementById('addTitle').innerText='ملاحظة جديدة'
  f=`<input id="d1" class="inp" placeholder="العنوان"><textarea id="d2" class="inp" style="height:80px;padding-top:10px" placeholder="التفاصيل"></textarea>`
 }
 document.getElementById('addFields').innerHTML=f
}
function closeAdd(){document.getElementById('modalAdd').classList.remove('show')}
function saveAdd(){
 if(cur==='income'||curCat==='in'){let a=APP.get('income',[]);a.push({id:uid(),cat:sel,am:+document.getElementById('a1').value||0,no:document.getElementById('a2').value,dt:document.getElementById('a3').value});APP.set('income',a)}
 else if(cur==='outcome'||curCat==='out'){let a=APP.get('outcome',[]);a.push({id:uid(),cat:sel,am:+document.getElementById('a1').value||0,no:document.getElementById('a2').value,dt:document.getElementById('a3').value});APP.set('outcome',a)}
 else if(cur==='debts'){let a=APP.get('debts',[]);a.push({id:uid(),p:document.getElementById('b1').value||'شخص',am:+document.getElementById('b2').value||0,ty:document.getElementById('b3').value});APP.set('debts',a)}
 else if(cur==='att'){let inT=document.getElementById('c2').value,outT=document.getElementById('c3').value,calc=0;try{let x=inT.split(':'),y=outT.split(':');calc=(+y[0]*60+ +y[1]- +x[0]*60- +x[1])/60;if(calc<0)calc+=24}catch(e){};let a=APP.get('att',[]);a.push({id:uid(),d:document.getElementById('c1').value,i:inT,o:outT,s:calc.toFixed(2),n:document.getElementById('c4').value});APP.set('att',a)}
 else{let a=APP.get('notes',[]);a.push({id:uid(),t:document.getElementById('d1').value||'بدون',c:document.getElementById('d2').value,dt:new Date().toISOString().slice(0,10)});APP.set('notes',a)}
 closeAdd();render()
}
function render(){
 let inc=APP.get('income',[]),out=APP.get('outcome',[]),debt=APP.get('debts',[]),att=APP.get('att',[]),notes=APP.get('notes',[])
 let sI=0,sO=0;inc.forEach(x=>sI+=x.am);out.forEach(x=>sO+=x.am)
 document.getElementById('totalTop').innerText='EGP '+(sI-sO).toLocaleString()
 document.getElementById('sumInc').innerText=fmt(sI)+'ج';document.getElementById('countInc').innerText=inc.length+' عملية'
 document.getElementById('sumOut').innerText=fmt(sO)+'ج';document.getElementById('countOut').innerText=out.length+' عملية'
 document.getElementById('list-income').innerHTML=inc.slice().reverse().map(x=>`<div class="card" style="display:flex;justify-content:space-between"><div><b>${x.cat}</b> - ${fmt(x.am)}ج<br><small style="opacity:.5">${x.no} - ${x.dt}</small></div><span onclick="del('income','${x.id}')">🗑️</span></div>`).join('')||'<div style="text-align:center;padding:40px;opacity:.4">لا يوجد دخل</div>'
 document.getElementById('list-outcome').innerHTML=out.slice().reverse().map(x=>`<div class="card" style="display:flex;justify-content:space-between"><div><b>${x.cat}</b> - ${fmt(x.am)}ج<br><small style="opacity:.5">${x.no} - ${x.dt}</small></div><span onclick="del('outcome','${x.id}')">🗑️</span></div>`).join('')||'<div style="text-align:center;padding:40px;opacity:.4">لا يوجد مصروفات<br>ابدأ بالإدخال</div>'
 let l=0,a=0;debt.forEach(d=>{if(d.ty==='لنا')l+=d.am;else a+=d.am})
 document.getElementById('debtLana').innerText=fmt(l);document.getElementById('debtAlayna').innerText=fmt(a);document.getElementById('debtNet').innerText=fmt(l-a)+'ج'
 let f=curDebt==='net'?debt:debt.filter(d=>d.ty===(curDebt==='lana'?'لنا':'علينا'))
 document.getElementById('list-debts').innerHTML=f.map(d=>`<div class="card" style="display:flex;justify-content:space-between"><div><b>${d.p}</b> - ${fmt(d.am)}ج <small style="color:${d.ty==='لنا'?'#4ade80':'#f87171'}">${d.ty}</small></div><span onclick="del('debts','${d.id}')">🗑️</span></div>`).join('')||'<div style="text-align:center;padding:30px;opacity:.4">لا يوجد ديون</div>'
 document.getElementById('att-body').innerHTML=att.slice().reverse().map(r=>`<tr><td>${r.d}</td><td>${r.i}</td><td>${r.o}</td><td>${r.s}س</td><td>${r.n||'-'}</td></tr>`).join('')||'<tr><td colspan="5" style="opacity:.4">لا يوجد حضور</td></tr>'
 document.getElementById('list-notes').innerHTML=notes.slice().reverse().map(n=>`<div class="card" style="border-right:4px solid #15803D"><div style="display:flex;justify-content:space-between"><b>${n.t}</b><small style="opacity:.5">${n.dt}</small></div><div style="font-size:13px;opacity:.8;margin-top:6px">${n.c}</div><div style="text-align:left"><span onclick="del('notes','${n.id}')">🗑️</span></div></div>`).join('')||'<div style="text-align:center;padding:40px;opacity:.4">لا يوجد ملاحظات</div>'
}
function del(k,id){if(confirm('مسح؟')){APP.set(k,APP.get(k,[]).filter(x=>x.id!==id));render()}}
render();renderCats()
</script>
</body>
</html>
