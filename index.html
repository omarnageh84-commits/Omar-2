<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OMAR - Lana Exact</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
body{background:#0E0E0E;color:#fff}
.h{height:52px;background:#121212;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #1E1E1E;position:sticky;top:0;z-index:10}
.inpAmount{width:100%;background:transparent;border:0;border-bottom:2px solid #0F7A3D;color:#fff;font-size:26px;font-weight:800;padding:14px 0;outline:none;text-align:right}
.row{padding:18px 14px;border-bottom:1px solid #1E1E1E;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.row:active{background:#1A1A1A}
.overlay{position:fixed;inset:0;background:#0009;z-index:400;display:none}
.overlay.show{display:block}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#1C1C1E;border-radius:22px 22px 0 0;z-index:500;display:none;flex-direction:column;max-height:90vh}
.sheet.show{display:flex;animation:up .25s}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheetHead{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2A2A2A}
.typeItem{padding:18px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;cursor:pointer;font-size:15px}
.typeItem:active{background:#222}
.catsPage{position:fixed;inset:0;background:#0E0E0E;z-index:600;display:none;flex-direction:column}
.catsPage.show{display:flex}
.tabs{display:flex;background:#2C2C2E;height:44px}
.tabs div{flex:1;display:grid;place-items:center;font-size:14px;color:#999;cursor:pointer;border-bottom:3px solid transparent}
.tabs div.on{color:#fff;border-color:#0F7A3D;background:#3A3A3C}
.searchRow{padding:12px 16px;display:flex;justify-content:flex-end;align-items:center;gap:10px;border-bottom:1px solid #1E1E1E;color:#999;font-size:14px}
.catItem{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1E1E1E;cursor:pointer}
.catItem:active{background:#1A1A1A}
.circle{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:16px}
.plus{position:fixed;bottom:20px;left:20px;width:56px;height:56px;border-radius:50%;background:#15803D;display:grid;place-items:center;font-size:28px;color:#fff;cursor:pointer;z-index:700}
</style>
</head>
<body>
<div class="h"><span>⚙️</span><b>إضافة معاملة</b><span onclick="history.back()">←</span></div>
<div style="padding:0 14px">
<div style="display:flex;gap:10px;align-items:center;margin-top:10px"><div style="border:1px solid #333;border-radius:8px;padding:6px 12px">د.م</div><input class="inpAmount" id="amount" placeholder="المبلغ"></div>
<div class="row" onclick="openType()"><div style="display:flex;gap:12px;align-items:center"><div style="width:36px;height:36px;border-radius:10px;background:#0F2E3A;display:grid;place-items:center">👥</div><span id="typeText">لنا</span></div><span>›</span></div>
<div class="row"><div style="display:flex;gap:12px;align-items:center"><div style="width:36px;height:36px;border-radius:10px;background:#1A3A2A;display:grid;place-items:center">💼</div><div>آل عمر</div><small style="opacity:.5">6,280 ج.م</small></div></div><span>›</span></div>
<div class="row" onclick="openCats()"><div style="display:flex;gap:12px;align-items:center"><div style="width:36px;height:36px;border-radius:10px;background:#3A2E0A;display:grid;place-items:center">⭐</div><span>المجموعة</span></div><div style="display:flex;gap:8px;opacity:.5"><span id="catText">اختر التصنيف</span><span>›</span></div></div>
</div>

<div id="overlay" class="overlay" onclick="closeAll()"></div>

<!-- شيت اختر النوع زي الصورة 1 بالظبط -->
<div id="typeSheet" class="sheet">
<div class="sheetHead"><span onclick="closeAll()" style="font-size:22px;cursor:pointer">✕</span><b>اختر النوع</b></div>
<div class="typeItem" onclick="selectType('لنا')"><span></span><div style="display:flex;gap:12px;align-items:center"><span>لنا (دخل) 💰</span><span style="font-size:18px">💰</span></div></div>
<div class="typeItem" onclick="selectType('علينا')"><span></span><div style="display:flex;gap:12px;align-items:center"><span>علينا (مصروف) 💸</span><span style="font-size:18px">💸</span></div></div>
</div>

<!-- صفحة الأقسام زي الصور 2 و 3 و 4 بالظبط -->
<div id="catsPage" class="catsPage">
<div style="height:52px;background:#3A3A3C;display:flex;align-items:center;justify-content:space-between;padding:0 14px"><span onclick="closeCats()" style="font-size:22px">←</span><div style="display:flex;gap:12px;align-items:center"><b>الأقسام</b><span>🔄</span></div></div>
<div class="tabs"><div id="tabDeyon" onclick="setTab('deyon')">الديون</div><div id="tabMasrof" onclick="setTab('masrof')">المصروف</div><div id="tabDakhl" class="on" onclick="setTab('dakhl')">الدخل</div></div>
<div class="searchRow"><span>🔍</span><span>بحث</span></div>
<div id="catsList" style="flex:1;overflow:auto"></div>
<div class="plus" onclick="addCat()">+</div>
</div>

<script>
let currentTab='dakhl'
let dakhlCats=[
{name:'امانات',color:'#1E3A0F',icon:'●'},
{name:'دي دي',color:'#15803D',icon:'●'},
{name:'جمايل',color:'#2563EB',icon:'●'},
{name:'فودافون كاش',color:'#EC4899',icon:'👕'},
{name:'البيت',color:'',icon:'🏠 RENT'},
{name:'انستا',color:'',icon:'💳'},
{name:'الراتب',color:'',icon:'🧾💰'},
{name:'المكافآت',color:'',icon:'🏆'},
{name:'الهدايا',color:'',icon:'🎁'},
{name:'توصيل',color:'',icon:'SALE!'},
{name:'أخرى',color:'',icon:'❤️'}
]
let masrofCats=[
{name:'الاكل',icon:'🥗'},
{name:'اكل صيدليه',icon:'☕'},
{name:'اكل البيت',icon:'🍽️'},
{name:'اكل خارجي و ترفيه',icon:'🍦'},
{name:'منظفات',color:'#15803D',icon:'●'},
{name:'عزومات',color:'#111',icon:'●'},
{name:'المواصلات',color:'#22C55E',icon:'🔧'},
{name:'البنزين',color:'#EAB308',icon:'⛽'},
{name:'الصيانة',color:'#22C55E',icon:'🔧'},
{name:'الجراج',icon:'🅿️'},
{name:'الأجرة',icon:'🚕'},
{name:'زيت',color:'#7C3AED',icon:'●'},
{name:'دي دي',color:'#581C87',icon:'●'}
]
let deyonCats=[
{title:'لنا',desc:'لإقراض جهة ما دينًا جديدًا أو تسديد دين أو أقساط عليك',icon:'💰⬆️'},
{title:'علينا',desc:'لاستلام دين جديد أو تحصيل دين أو أقساط من جهة ما',icon:'🤲💰'}
]

function openType(){document.getElementById('overlay').classList.add('show'); document.getElementById('typeSheet').classList.add('show')}
function closeAll(){document.getElementById('overlay').classList.remove('show'); document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'))}
function selectType(t){
  document.getElementById('typeText').innerText=t
  closeAll()
  if(t==='علينا'){ setTab('masrof'); openCats() } else { setTab('dakhl'); openCats() }
}
function openCats(){document.getElementById('catsPage').classList.add('show'); renderCats()}
function closeCats(){document.getElementById('catsPage').classList.remove('show')}
function setTab(tab){
  currentTab=tab
  document.getElementById('tabDakhl').className=tab==='dakhl'?'on':''
  document.getElementById('tabMasrof').className=tab==='masrof'?'on':''
  document.getElementById('tabDeyon').className=tab==='deyon'?'on':''
  renderCats()
}
function renderCats(){
  let html=''
  if(currentTab==='dakhl'){
    html=dakhlCats.map(c=>'<div class="catItem" onclick="pickCat(\''+c.name+'\')"><span></span><div style="display:flex;gap:12px;align-items:center"><span>'+c.name+'</span><div class="circle" style="background:'+(c.color||'#222')+'">'+c.icon+'</div></div></div>').join('')
  }
  if(currentTab==='masrof'){
    html=masrofCats.map(c=>'<div class="catItem" onclick="pickCat(\''+c.name+'\')"><span></span><div style="display:flex;gap:12px;align-items:center"><span>'+c.name+'</span><div class="circle" style="background:'+(c.color||'#222')+'">'+c.icon+'</div></div></div>').join('')
  }
  if(currentTab==='deyon'){
    html=deyonCats.map(c=>'<div class="catItem" style="align-items:flex-start"><span></span><div style="text-align:right"><div style="display:flex;gap:10px;align-items:center;justify-content:flex-end"><b>'+c.title+'</b><div class="circle" style="background:#222">'+c.icon+'</div></div><div style="font-size:11px;opacity:.6;margin-top:4px">'+c.desc+'</div></div></div>').join('')
  }
  document.getElementById('catsList').innerHTML=html
}
function pickCat(name){document.getElementById('catText').innerText=name; closeCats()}
function addCat(){let n=prompt('اسم التصنيف الجديد:'); if(!n) return; if(currentTab==='dakhl') dakhlCats.push({name:n,color:'#333',icon:'●'}); if(currentTab==='masrof') masrofCats.push({name:n,icon:'●'}); renderCats()}
renderCats()
</script>
</body>
</html>
