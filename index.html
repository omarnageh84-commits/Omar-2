<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="screen-orientation" content="portrait">
<title>OMAR</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#0A0A0A;color:#fff;display:flex;flex-direction:column}
/* منع اللف */
@supports (orientation: portrait) { body { orientation: portrait; } }

.h{height:56px;background:#121212;display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-bottom:1px solid #1E1E1E;flex-shrink:0}
.topTabs{height:48px;background:#121212;display:flex;border-bottom:1px solid #1E1E1E;flex-shrink:0}
.topTabs button{flex:1;background:transparent;border:0;color:#777;font-size:14px;font-weight:600;cursor:pointer;position:relative}
.topTabs button.on{color:#fff}
.topTabs button.on::after{content:'';position:absolute;bottom:0;left:25%;right:25%;height:2px;background:#fff}
.content{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:.4}
.bottom{height:72px;background:#121212;border-top:1px solid #1E1E1E;display:flex;justify-content:space-around;align-items:center;flex-shrink:0}
.bItem{color:#777;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;cursor:pointer}
.bItem.on{color:#fff}
.plus{width:62px;height:62px;border-radius:50%;background:#15803D;display:grid;place-items:center;font-size:28px;color:#fff;margin-top:-30px;box-shadow:0 0 20px #15803D88;cursor:pointer;flex:none}
.page{display:none;flex:1;overflow:auto;padding:12px}
.page.show{display:block}
.card{background:#171717;border:1px solid #1E1E1E;border-radius:16px;padding:14px;margin-bottom:10px}
.inp{width:100%;height:46px;background:#1A1A1A;border:1px solid #2A2A2A;border-radius:12px;padding:0 12px;color:#fff;outline:none;margin-top:8px}
.btn{width:100%;height:50px;background:#15803D;border:0;border-radius:14px;color:#fff;font-weight:800;margin-top:12px;cursor:pointer}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#1C1C1E;border-radius:20px 20px 0 0;z-index:100;display:none;flex-direction:column;max-height:80vh}
.sheet.show{display:flex}
.overlay{position:fixed;inset:0;background:#0008;z-index:90;display:none}
.overlay.show{display:block}
</style>
</head>
<body>
<div class="h">
<div style="display:flex;gap:8px;align-items:center"><b style="color:#0F7A3D;font-size:18px">OMAR</b><span id="totalTop" style="opacity:.7;font-size:14px">6,280 EGP</span></div>
<div style="font-size:18px">⚙️</div>
</div>

<div class="topTabs">
<button onclick="setTop('deyon')" id="tDeyon">ديون</button>
<button onclick="setTop('masrof')" id="tMasrof" class="on">مصروفات</button>
<button onclick="setTop('entry')" id="tEntry">إدخال</button>
</div>

<div id="page-entry" class="page">
<div style="padding-top:10px">
<div style="display:flex;gap:8px;align-items:center"><div style="border:1px solid #2A2A2A;border-radius:10px;padding:6px 12px;font-size:11px;background:#171717">د.م</div><input id="amount" type="number" placeholder="0" style="flex:1;background:transparent;border:0;color:#fff;font-size:32px;font-weight:800;text-align:right;outline:none"></div>
<div style="height:2px;background:#15803D;margin:8px 0 12px"></div>

<div class="card" style="display:flex;justify-content:space-between;cursor:pointer" onclick="openSheet('typeSheet')"><span id="txtType">لنا (دخل)</span><span>👥</span></div>
<div class="card" style="display:flex;justify-content:space-between;cursor:pointer" onclick="openSheet('walletSheet')"><div><div id="txtWallet">آل عمر</div><div style="font-size:11px;opacity:.5" id="txtWalletBal">6,280 ج.م</div></div><span>💼</span></div>
<div class="card"><input id="note" placeholder="الملاحظات - اكتب وصف المعاملة" style="width:100%;background:transparent;border:0;color:#fff;outline:none"></div>
<div class="card" style="display:flex;justify-content:space-between;cursor:pointer" onclick="openSheet('catSheet')"><span>المجموعة</span><span id="txtCat">المواصلات ‹</span></div>
<div class="card" style="display:flex;justify-content:space-between;cursor:pointer" onclick="openSheet('contactSheet')"><span>جهة الاتصال</span><span id="txtContact">ياسمين ‹</span></div>
<button class="btn" onclick="saveTrans()">حفظ المعاملة</button>
</div>
</div>

<div id="page-masrof" class="page show">
<div class="content">
<div style="font-size:14px">لا يوجد مصروفات</div>
<div style="font-size:14px;margin-top:6px">ابدأ بالإدخال</div>
</div>
<div id="masrofList"></div>
</div>

<div id="page-deyon" class="page">
<div id="deyonList"></div>
</div>

<div id="page-hodor" class="page"><div class="content"><div>الحضور والانصراف</div><div style="margin-top:6px">قريبا</div></div></div>
<div id="page-more" class="page"><div class="content"><div>أكثر - الملاحظات واليومية</div></div></div>

<div class="bottom">
<div class="bItem" onclick="setBottom('more')" id="bMore"><span>☰</span><span>أكثر</span></div>
<div class="bItem" onclick="setBottom('hodor')" id="bHodor"><span>⏰</span><span>الحضور</span></div>
<div class="plus" onclick="setTop('entry')">+</div>
<div class="bItem on" onclick="setBottom('masrof')" id="bMasrof"><span>💸</span><span>مصروفات</span></div>
<div class="bItem" onclick="setBottom('deyon')" id="bDeyon"><span>📕</span><span>ديون</span></div>
</div>

<div id="overlay" class="overlay" onclick="closeAll()"></div>
<div id="typeSheet" class="sheet"><div style="padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #222"><b>اختر النوع</b><span onclick="closeAll()">✕</span></div><div style="padding:12px;flex:1;overflow:auto"><div class="card" onclick="setType('لنا')">لنا (دخل) 💰</div><div class="card" onclick="setType('علينا')">علينا (مصروف) 💸</div></div></div>
<div id="walletSheet" class="sheet"><div style="padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #222"><b>اختر المحفظة</b><span onclick="closeAll()">✕</span></div><div id="walletList" style="padding:12px;flex:1;overflow:auto"></div><button class="btn" style="margin:12px;background:#EF4444" onclick="addWallet()">+ إضافة محفظة</button></div>
<div id="catSheet" class="sheet"><div style="padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #222"><b>المجموعة</b><span onclick="closeAll()">✕</span></div><div id="catList" style="padding:12px;flex:1;overflow:auto"></div></div>
<div id="contactSheet" class="sheet"><div style="padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #222"><b>جهة الاتصال</b><span onclick="closeAll()">✕</span></div><div id="contactList" style="padding:12px;flex:1;overflow:auto"></div></div>

<script>
// منع اللف
if (screen.orientation && screen.orientation.lock) {
  try { screen.orientation.lock('portrait'); } catch(e){}
}
window.addEventListener("orientationchange", function(){ if(window.orientation==90 || window.orientation==-90){ document.body.style.transform="rotate(0deg)"; }});

var S={get:function(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set:function(k,v){localStorage.setItem(k,JSON.stringify(v))}}
if(!localStorage.getItem('wallets')) S.set('wallets',[{id:'w1',name:'آل عمر',bal:6280},{id:'w2',name:'انستا',bal:0}])
if(!localStorage.getItem('cats')) S.set('cats',['المواصلات','الراتب','الاكل','البنزين'])
if(!localStorage.getItem('contacts')) S.set('contacts',['ياسمين','حسين'])
if(!localStorage.getItem('trans')) S.set('trans',[])
var cur={type:'لنا',wallet:S.get('wallets',[])[0],cat:'المواصلات',contact:'ياسمين'}

function setTop(t){
 document.querySelectorAll('.page').forEach(function(p){p.classList.remove('show')})
 document.getElementById('page-'+(t==='entry'?'entry':t==='masrof'?'masrof':t==='deyon'?'deyon':'entry')).classList.add('show')
 document.querySelectorAll('.topTabs button').forEach(function(b){b.classList.remove('on')})
 document.getElementById(t==='entry'?'tEntry':t==='masrof'?'tMasrof':'tDeyon').classList.add('on')
 if(t==='masrof') renderMasrof()
}
function setBottom(b){
 if(b==='more'){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('show')});document.getElementById('page-more').classList.add('show')}
 if(b==='hodor'){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('show')});document.getElementById('page-hodor').classList.add('show')}
 if(b==='masrof') setTop('masrof')
 if(b==='deyon') setTop('deyon')
 document.querySelectorAll('.bItem').forEach(function(x){x.classList.remove('on')})
 document.getElementById(b==='more'?'bMore':b==='hodor'?'bHodor':b==='masrof'?'bMasrof':'bDeyon').classList.add('on')
}
function openSheet(id){document.getElementById('overlay').classList.add('show');document.getElementById(id).classList.add('show'); if(id==='walletSheet') renderWallets(); if(id==='catSheet') renderCats(); if(id==='contactSheet') renderContacts()}
function closeAll(){document.getElementById('overlay').classList.remove('show');document.querySelectorAll('.sheet').forEach(function(s){s.classList.remove('show')})}
function setType(t){cur.type=t;document.getElementById('txtType').innerText=t==='لنا'?'لنا (دخل)':'علينا (مصروف)';closeAll()}
function renderWallets(){var ws=S.get('wallets',[]);document.getElementById('walletList').innerHTML=ws.map(function(w){return '<div class="card" onclick="pickWallet(\''+w.id+'\')"><b>'+w.name+'</b><br><small style="opacity:.5">'+w.bal.toLocaleString()+' ج.م</small></div>'}).join('')}
function pickWallet(id){var ws=S.get('wallets',[]);cur.wallet=ws.find(function(w){return w.id===id});document.getElementById('txtWallet').innerText=cur.wallet.name;document.getElementById('txtWalletBal').innerText=cur.wallet.bal.toLocaleString()+' ج.م';closeAll()}
function addWallet(){var n=prompt('اسم المحفظة:');if(!n) return;var ws=S.get('wallets',[]);ws.push({id:'w'+Date.now(),name:n,bal:0});S.set('wallets',ws);renderWallets()}
function renderCats(){var cs=S.get('cats',[]);document.getElementById('catList').innerHTML=cs.map(function(c){return '<div class="card" onclick="pickCat(\''+c+'\')">'+c+'</div>'}).join('')}
function pickCat(c){cur.cat=c;document.getElementById('txtCat').innerText=c+' ‹';closeAll()}
function renderContacts(){var cs=S.get('contacts',[]);document.getElementById('contactList').innerHTML=cs.map(function(c){return '<div class="card" onclick="pickContact(\''+c+'\')">'+c+'</div>'}).join('')}
function pickContact(c){cur.contact=c;document.getElementById('txtContact').innerText=c+' ‹';closeAll()}
function saveTrans(){
 var amt=Number(document.getElementById('amount').value||0)
 if(!amt) return alert('اكتب المبلغ')
 var trans=S.get('trans',[])
 trans.push({id:Date.now(),amount:amt,type:cur.type,wallet:cur.wallet.name,cat:cur.cat,contact:cur.contact,note:document.getElementById('note').value})
 S.set('trans',trans)
 var ws=S.get('wallets',[]);var ww=ws.find(function(w){return w.id===cur.wallet.id});if(ww){if(cur.type==='لنا') ww.bal+=amt; else ww.bal-=amt; S.set('wallets',ws)}
 document.getElementById('amount').value=''
 alert('✅ تم الحفظ')
 setTop('masrof')
}
function renderMasrof(){
 var trans=S.get('trans',[]).filter(function(t){return t.type==='علينا'})
 if(trans.length===0){document.getElementById('masrofList').innerHTML=''; document.querySelector('#page-masrof.content').style.display='flex'; return}
 document.querySelector('#page-masrof.content').style.display='none'
 document.getElementById('masrofList').innerHTML=trans.slice().reverse().map(function(t){return '<div class="card"><b>'+t.cat+' - '+t.amount.toLocaleString()+' ج.م</b><div style="font-size:11px;opacity:.5">'+t.wallet+' | '+t.contact+'</div></div>'}).join('')
 var ws=S.get('wallets',[]);var tot=0;ws.forEach(function(w){tot+=w.bal});document.getElementById('totalTop').innerText=tot.toLocaleString()+' EGP'
}
renderMasrof()
</script>
</body>
</html>
