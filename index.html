<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OMAR - SAVE FIX 2</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
body{background:#0E0E0E;color:#fff;padding-bottom:80px}
.h{background:#0F7A3D;padding:12px;position:sticky;top:0;z-index:10}
.card{background:#1A1A1A;border:1px solid #23232F;border-radius:16px;padding:12px;margin:10px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#151515;border-top:1px solid #222;height:70px;display:flex;justify-content:space-around;align-items:center;z-index:99}
.plus{width:56px;height:56px;border-radius:50%;background:#0F7A3D;margin-top:-32px;display:grid;place-items:center;font-size:26px;color:#fff;cursor:pointer}
.modal{position:fixed;inset:0;background:#0E0E0E;z-index:200;display:none;flex-direction:column}
.modal.show{display:flex}
.topBar{height:52px;background:#121212;display:flex;justify-content:space-between;padding:0 14px;border-bottom:1px solid #222;align-items:center}
.inpAmount{width:100%;background:transparent;border:0;border-bottom:2px solid #0F7A3D;color:#fff;font-size:26px;font-weight:800;padding:10px 0;outline:none}
.row{padding:16px 0;border-bottom:1px solid #1E1E1E;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.btnGreen{height:52px;background:#0F7A3D;border:0;border-radius:14px;color:#fff;font-weight:800;width:calc(100% - 24px);margin:12px auto;display:block}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#1E1E1E;border-radius:22px 22px 0 0;z-index:500;display:none;flex-direction:column;max-height:85vh}
.sheet.show{display:flex}
.sheetHead{padding:16px;display:flex;justify-content:space-between;border-bottom:1px solid #2A2A2A}
.addBtn{color:#22C55E;cursor:pointer;font-weight:700}
.item{padding:14px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #222;align-items:center}
.searchBox{margin:14px;background:#0E0E0E;border:1px solid #2A2A2A;border-radius:14px;padding:0 14px;height:44px;display:flex}
.searchBox input{flex:1;background:transparent;border:0;color:#fff;outline:none;text-align:right}
.overlay{position:fixed;inset:0;background:#0008;z-index:400;display:none}
.overlay.show{display:block}
.editBox{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#2A2A2A;border-radius:18px;padding:18px;width:92%;max-width:360px;z-index:900;display:none}
.editBox.show{display:block}
.editBox input{width:100%;height:48px;background:#0E0E0E;border:1px solid #444;border-radius:12px;color:#fff;padding:0 14px;margin-top:12px;outline:none}
.editActions{display:flex;gap:10px;margin-top:14px}
.editActions button{flex:1;height:44px;border-radius:12px;border:0;font-weight:800}
.btnSave{background:#15803D;color:#fff}
.btnCancel{background:#3A3A3A;color:#fff}
</style>
</head>
<body>
<div class="h"><b id="totalTop">EGP 6,280 - OMAR</b></div>
<div id="main" style="padding:12px"></div>
<div class="bottom"><div class="plus" onclick="openAdd()">+</div></div>

<div id="addModal" class="modal">
<div class="topBar"><span onclick="closeAdd()">←</span><b>إضافة معاملة</b><span>⚙️</span></div>
<div style="padding:16px;flex:1;overflow:auto">
<input id="f_amount" class="inpAmount" type="number" placeholder="المبلغ - د.م">
<div class="row" onclick="openSheet('walletSheet')"><span>المحفظة</span><span id="f_wallet">آل عمر - 6,280 م.ج ›</span></div>
<div class="row" onclick="openSheet('groupSheet')"><span>المجموعة</span><span id="f_group">اختر ›</span></div>
<div class="row" onclick="openSheet('contactSheet')"><span>جهة الاتصال</span><span id="f_contact">اختر ›</span></div>
</div>
<button class="btnGreen" onclick="saveTrans()">إضافة معاملة</button>
</div>

<div id="overlay" class="overlay" onclick="closeAll()"></div>

<div id="walletSheet" class="sheet">
<div class="sheetHead"><b>اختر المحفظة</b><span onclick="closeAll()">✕</span></div>
<div id="walletList" style="flex:1;overflow:auto"></div>
<button style="margin:12px;height:52px;background:#EF4444;border:0;border-radius:14px;color:#fff;font-weight:800;width:calc(100% - 24px)" onclick="openEditBox('wallet','')">+ إضافة محفظة</button>
</div>

<div id="groupSheet" class="sheet"><div class="sheetHead"><b>المجموعة</b><span class="addBtn" onclick="openEditBox('group','')">+ إضافة</span></div><div class="searchBox"><input id="searchGroup" placeholder="بحث..." oninput="renderGroups()"></div><div id="groupList" style="flex:1;overflow:auto"></div></div>
<div id="contactSheet" class="sheet"><div class="sheetHead"><b>جهة الاتصال</b><span class="addBtn" onclick="openEditBox('contact','')">+ إضافة</span></div><div class="searchBox"><input id="searchContact" placeholder="بحث..." oninput="renderContacts()"></div><div id="contactList" style="flex:1;overflow:auto"></div></div>

<div id="editBox" class="editBox">
<b id="editTitle">إضافة محفظة</b>
<input id="editInput" placeholder="اكتب الاسم مثل انستا">
<div class="editActions">
<button class="btnCancel" onclick="closeEditBox()">إلغاء</button>
<button class="btnSave" onclick="doSave()">حفظ</button>
</div>
</div>

<script>
var store = {
  get:function(k,d){ try{var v=localStorage.getItem(k); return v?JSON.parse(v):d}catch(e){return d} },
  set:function(k,v){ localStorage.setItem(k,JSON.stringify(v)) }
}
if(!localStorage.getItem('wallets')) store.set('wallets', [{id:'w1',name:'آل عمر',bal:6280},{id:'w2',name:'ديدي',bal:0}])
if(!localStorage.getItem('groups')) store.set('groups', ['المواصلات','ترفيهي','أكل'])
if(!localStorage.getItem('contacts')) store.set('contacts', ['ياسمين','حسين'])
if(!localStorage.getItem('trans')) store.set('trans', [])

var sel = {wallet: store.get('wallets',[])[0], group:'', contact:''}
var edit = {type:'', old:''}

function openSheet(id){ document.getElementById('overlay').classList.add('show'); document.getElementById(id).classList.add('show'); if(id==='walletSheet') renderWallets(); if(id==='groupSheet') renderGroups(); if(id==='contactSheet') renderContacts(); }
function closeAll(){ document.getElementById('overlay').classList.remove('show'); document.querySelectorAll('.sheet').forEach(function(s){s.classList.remove('show')}) }
function openAdd(){ document.getElementById('addModal').classList.add('show') }
function closeAdd(){ document.getElementById('addModal').classList.remove('show') }

function renderWallets(){
  var ws = store.get('wallets',[])
  var html = ''
  for(var i=0;i<ws.length;i++){
    var w = ws[i]
    html += '<div class="item"><div onclick="selectWallet(\''+w.id+'\')" style="flex:1;cursor:pointer"><b>'+w.name+'</b><br><small style="opacity:.5">'+w.bal.toLocaleString()+' ج.م</small></div><div style="display:flex;gap:8px"><button onclick="openEditBox(\'wallet\',\''+w.name.replace(/'/g,"\\'")+'\')" style="width:32px;height:32px;border-radius:8px;border:0;background:#222">✏️</button><button onclick="deleteWallet(\''+w.id+'\')" style="width:32px;height:32px;border-radius:8px;border:0;background:#222">🗑️</button></div></div>'
  }
  document.getElementById('walletList').innerHTML = html
  document.getElementById('f_wallet').innerText = sel.wallet.name + ' - ' + sel.wallet.bal.toLocaleString() + ' م.ج'
}
function selectWallet(id){ var ws=store.get('wallets',[]); for(var i=0;i<ws.length;i++){ if(ws[i].id===id) sel.wallet=ws[i] } document.getElementById('f_wallet').innerText = sel.wallet.name; closeAll(); renderMain(); }
function deleteWallet(id){ if(!confirm('مسح؟')) return; var ws=store.get('wallets',[]); ws=ws.filter(function(w){return w.id!==id}); if(ws.length===0){alert('لازم محفظة واحدة'); return;} store.set('wallets',ws); sel.wallet=ws[0]; renderWallets(); renderMain(); }

function renderGroups(){
  var q = (document.getElementById('searchGroup').value||'').toLowerCase()
  var list = store.get('groups',[]).filter(function(g){return g.toLowerCase().indexOf(q)>-1})
  var html=''
  for(var i=0;i<list.length;i++){ var g=list[i]; html+='<div class="item"><span onclick="selectGroup(\''+g.replace(/'/g,"\\'")+'\')" style="flex:1;cursor:pointer">'+g+'</span><div style="display:flex;gap:8px"><button onclick="openEditBox(\'group\',\''+g.replace(/'/g,"\\'")+'\')" style="width:32px;height:32px;border:0;background:#222;border-radius:8px">✏️</button><button onclick="deleteGroup(\''+g.replace(/'/g,"\\'")+'\')" style="width:32px;height:32px;border:0;background:#222;border-radius:8px">🗑️</button></div></div>' }
  document.getElementById('groupList').innerHTML=html
}
function selectGroup(g){ sel.group=g; document.getElementById('f_group').innerText=g; closeAll(); }
function deleteGroup(g){ if(!confirm('مسح '+g+'؟')) return; var a=store.get('groups',[]).filter(function(x){return x!==g}); store.set('groups',a); renderGroups(); }

function renderContacts(){
  var q = (document.getElementById('searchContact').value||'').toLowerCase()
  var list = store.get('contacts',[]).filter(function(c){return c.toLowerCase().indexOf(q)>-1})
  var html=''
  for(var i=0;i<list.length;i++){ var c=list[i]; html+='<div class="item"><span onclick="selectContact(\''+c.replace(/'/g,"\\'")+'\')" style="flex:1;cursor:pointer">'+c+'</span><div style="display:flex;gap:8px"><button onclick="openEditBox(\'contact\',\''+c.replace(/'/g,"\\'")+'\')" style="width:32px;height:32px;border:0;background:#222;border-radius:8px">✏️</button><button onclick="deleteContact(\''+c.replace(/'/g,"\\'")+'\')" style="width:32px;height:32px;border:0;background:#222;border-radius:8px">🗑️</button></div></div>' }
  document.getElementById('contactList').innerHTML=html
}
function selectContact(c){ sel.contact=c; document.getElementById('f_contact').innerText=c; closeAll(); }
function deleteContact(c){ if(!confirm('مسح '+c+'؟')) return; var a=store.get('contacts',[]).filter(function(x){return x!==c}); store.set('contacts',a); renderContacts(); }

function openEditBox(type,oldVal){
  edit.type=type; edit.old=oldVal||''
  document.getElementById('editTitle').innerText = oldVal? 'تعديل: '+oldVal : (type==='wallet'?'إضافة محفظة':type==='group'?'إضافة مجموعة':'إضافة جهة اتصال')
  document.getElementById('editInput').value = oldVal||''
  document.getElementById('editBox').classList.add('show')
  setTimeout(function(){document.getElementById('editInput').focus()},100)
}
function closeEditBox(){ document.getElementById('editBox').classList.remove('show') }

function doSave(){
  var v = document.getElementById('editInput').value.trim()
  if(!v){ alert('اكتب الاسم الأول'); return; }

  if(edit.type==='wallet'){
    var ws = store.get('wallets',[])
    if(edit.old){
      for(var i=0;i<ws.length;i++){ if(ws[i].name===edit.old) ws[i].name=v }
    } else {
      ws.push({id:'w'+Date.now(), name:v, bal:0})
    }
    store.set('wallets', ws)
    sel.wallet = ws[ws.length-1]
    if(edit.old) { for(var j=0;j<ws.length;j++){ if(ws[j].name===v) sel.wallet=ws[j] } }
    renderWallets()
    renderMain()
  }
  if(edit.type==='group'){
    var gs = store.get('groups',[])
    if(edit.old){ var idx=gs.indexOf(edit.old); if(idx>-1) gs[idx]=v } else { if(gs.indexOf(v)===-1) gs.push(v) }
    store.set('groups', gs)
    renderGroups()
  }
  if(edit.type==='contact'){
    var cs = store.get('contacts',[])
    if(edit.old){ var idx2=cs.indexOf(edit.old); if(idx2>-1) cs[idx2]=v } else { if(cs.indexOf(v)===-1) cs.push(v) }
    store.set('contacts', cs)
    renderContacts()
  }
  closeEditBox()
  alert('✅ تم الحفظ: '+v)
}

function saveTrans(){
  var amt = Number(document.getElementById('f_amount').value||0)
  if(!amt) return alert('اكتب المبلغ')
  if(!sel.group) return alert('اختر المجموعة')
  var trans = store.get('trans',[])
  trans.push({id:Date.now(), amount:amt, group:sel.group, contact:sel.contact, wallet:sel.wallet.name})
  store.set('trans', trans)
  closeAdd()
  renderMain()
}
function renderMain(){
  var ws = store.get('wallets',[])
  var total = 0; for(var i=0;i<ws.length;i++) total+=Number(ws[i].bal)
  document.getElementById('totalTop').innerText = 'EGP '+total.toLocaleString()
  var trans = store.get('trans',[])
  var html = trans.length? '' : '<div style="text-align:center;padding:60px;opacity:.4">لا يوجد معاملات</div>'
  for(var k=trans.length-1;k>=0;k--){ var t=trans[k]; html+='<div class="card"><b>'+t.group+' - '+t.amount.toLocaleString()+' ج.م</b><div style="font-size:11px;opacity:.5">'+t.wallet+' | '+t.contact+'</div></div>' }
  document.getElementById('main').innerHTML = html
}
renderMain()
renderWallets()
</script>
</body>
</html>
