<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMAR SMART</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#000;color:#fff;padding-bottom:60px}.h{height:48px;background:#15803D;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:700}.dash{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.dcard{background:#1A1A1A;border:1px solid #222;border-radius:16px;padding:10px;min-height:90px}.dcard small{color:#888;font-size:11px;background:#252525;padding:2px 8px;border-radius:12px}.dcard b{font-size:18px;display:block;margin-top:8px}.page{display:none;padding:8px}.page.on{display:block}.card{background:#1A1A1A;border:1px solid #222;border-radius:12px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}.bottom{position:fixed;bottom:0;left:0;right:0;height:52px;background:#111;border-top:1px solid #222;display:flex;align-items:center;z-index:9}.b{flex:1;text-align:center;color:#666;font-size:9px;line-height:11px}.b.on{color:#15803D}.b span{font-size:16px;display:block}.plus{width:32px;height:32px;background:#15803D;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;margin:0 4px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:99}.modal.on{display:flex}.box{background:#1E1E1E;margin:auto;width:92%;max-width:340px;border-radius:12px;padding:12px}.inp{width:100%;height:38px;background:#111;border:1px solid #333;border-radius:8px;color:#fff;margin-top:6px;padding:0 8px}.btn{width:100%;height:38px;background:#15803D;border:0;border-radius:8px;color:#fff;margin-top:8px}</style></head><body>
<div class="h"><div>OMAR - <span id="topBal">69050</span>ج</div><div>EGP</div></div>

<div class="dash">
<div class="dcard"><div style="display:flex;justify-content:space-between"><small>الرصيد المتبقي</small><span>💳</span></div><b id="d1">22,750 ج.م</b><small id="d1s" style="background:transparent;padding:0">23,500 دخل - 750 صرف</small><div style="height:4px;background:#222;border-radius:4px;margin-top:8px"><div style="width:80%;height:4px;background:#15803D;border-radius:4px"></div></div></div>
<div class="dcard"><div style="display:flex;justify-content:space-between"><small>إجمالي مصروف الشهر</small><span>📉</span></div><b id="d2">750 ج.م</b><small style="background:transparent;padding:0">الشهر الحالي</small><div style="height:4px;background:#222;border-radius:4px;margin-top:8px"><div style="width:30%;height:4px;background:#15803D;border-radius:4px"></div></div></div>
<div class="dcard"><div style="display:flex;justify-content:space-between"><small>ديون متبقية (علينا)</small><span>🤝</span></div><b id="d3">1,850 ج.م</b><small id="d3s" style="background:transparent;padding:0">الصيدلية: 1400ج</small><div style="height:4px;background:#222;border-radius:4px;margin-top:8px"><div style="width:60%;height:4px;background:#15803D;border-radius:4px"></div></div></div>
<div class="dcard"><div style="display:flex;justify-content:space-between"><small>ساعات عمل الشهر</small><span>⏰</span></div><b id="d4">82.5 س</b><small style="background:transparent;padding:0">10 يوم - 3,712.5ج</small></div>
</div>

<div id="p1" class="page"><div id="l1"></div></div>
<div id="p2" class="page on"><div id="l2"></div></div>
<div id="p3" class="page"><div id="l3"></div></div>
<div id="p4" class="page"><div id="att"></div></div>
<div id="p5" class="page"><div id="l5"></div></div>
<div id="p6" class="page"><div id="l6"></div></div>

<div class="bottom">
<div class="b" id="b1" onclick="go(1)"><span>💰</span>الدخل</div>
<div class="b on" id="b2" onclick="go(2)"><span>💸</span>المصروف</div>
<div class="b" id="b3" onclick="go(3)"><span>📒</span>الديون</div>
<div class="b" id="b4" onclick="go(4)"><span>⏰</span>الحضور</div>
<div class="b" id="b5" onclick="go(5)"><span>📝</span>ملاحظات</div>
<div class="b" id="b6" onclick="go(6)"><span>📋</span>اليومية</div>
<div class="plus" onclick="openPlus()">+</div>
</div>

<div id="catBox" class="modal"><div class="box"><div style="display:flex;justify-content:space-between"><b>بند جديد - غسيل</b><span onclick="hide('catBox')">X</span></div><input id="newCat" class="inp" placeholder="مثلا غسيل"><div id="catList" style="max-height:200px;overflow:auto;margin-top:8px"></div><button class="btn" onclick="addCat()">إضافة بند</button></div></div>
<div id="addBox" class="modal"><div class="box"><div id="addT">إضافة</div><div id="addF"></div><button class="btn" onclick="doSave()">حفظ</button><button class="btn" style="background:#333" onclick="hide('addBox')">إلغاء</button></div></div>

<script>
var cur=2,cats=["غسيل","طعام وشراب","مواصلات","ديون الصيدلية"],curCat='',editId=null;
function L(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}
function S(k,v){localStorage.setItem(k,JSON.stringify(v))}
function fmt(n){return Number(n||0).toLocaleString()}
function uid(){return 'x'+Math.random().toString(36).slice(2,5)}
function go(n){cur=n;for(var i=1;i<=6;i++){var p=document.getElementById('p'+i);if(p) p.classList.remove('on');var b=document.getElementById('b'+i);if(b) b.classList.remove('on');}document.getElementById('p'+n).classList.add('on');document.getElementById('b'+n).classList.add('on');render()}
function hide(id){document.getElementById(id).classList.remove('on');editId=null}
function openPlus(){editId=null;if(cur==1||cur==2){document.getElementById('catBox').classList.add('on');showCats();return}document.getElementById('addBox').classList.add('on');build(null)}
function showCats(){var h='';for(var i=0;i<cats.length;i++) h+='<div style="padding:10px;border-bottom:1px solid #222" onclick="pick('+i+')">'+cats[i]+'</div>';document.getElementById('catList').innerHTML=h}
function addCat(){var v=document.getElementById('newCat').value.trim();if(!v) return;cats.push(v);S('cats',cats);document.getElementById('newCat').value='';showCats()}
function pick(i){curCat=cats[i];hide('catBox');document.getElementById('addBox').classList.add('on');build(null)}
function build(o){
var f='';if(cur==1||cur==2){document.getElementById('addT').innerText=curCat;f='<input id="f1" class="inp" type="number" placeholder="المبلغ" value="'+(o?o.a:'')+'"><input id="f2" class="inp" placeholder="ملاحظة" value="'+(o?o.n:'')+'">';}
if(cur==3){document.getElementById('addT').innerText='دين';f='<input id="f1" class="inp" placeholder="الاسم - الصيدليه" value="'+(o?o.p:'')+'"><input id="f2" class="inp" type="number" placeholder="الإجمالي 1000" value="'+(o?o.a:'')+'"><input id="f3" class="inp" type="number" placeholder="المدفوع 300" value="'+(o?o.paid||'')+'"><select id="f4" class="inp"><option value="علينا">علينا</option><option value="لنا">لنا</option></select>';}
if(cur==4){document.getElementById('addT').innerText='حضور 9=9ص 19=7م';f='<input id="f1" class="inp" type="date" value="'+(o?o.d:new Date().toISOString().slice(0,10))+'"><input id="f2" class="inp" type="number" placeholder="حضور 9" value="'+(o?o.inN||'')+'"><input id="f3" class="inp" type="number" placeholder="انصراف 17" value="'+(o?o.outN||'')+'">';}
if(cur>=5){document.getElementById('addT').innerText='إضافة';f='<input id="f1" class="inp" placeholder="العنوان" value="'+(o?o.t:'')+'"><input id="f2" class="inp" placeholder="تفاصيل" value="'+(o?o.c||'')+'">';}
document.getElementById('addF').innerHTML=f;
}
function doSave(){
if(cur==1){var a=L('inc');var o={id:editId||uid(),c:curCat,a:Number(document.getElementById('f1').value||0),n:document.getElementById('f2').value};if(editId){for(var i=0;i<a.length;i++) if(a[i].id==editId) a[i]=o;}else a.push(o);S('inc',a);}
if(cur==2){var a=L('out');var o={id:editId||uid(),c:curCat,a:Number(document.getElementById('f1').value||0),n:document.getElementById('f2').value};if(editId){for(var i=0;i<a.length;i++) if(a[i].id==editId) a[i]=o;}else a.push(o);S('out',a);}
if(cur==3){var a=L('deb');var o={id:editId||uid(),p:document.getElementById('f1').value||'الصيدليه',a:Number(document.getElementById('f2').value||0),paid:Number(document.getElementById('f3').value||0),t:document.getElementById('f4').value};if(editId){for(var i=0;i<a.length;i++) if(a[i].id==editId) a[i]=o;}else a.push(o);S('deb',a);}
if(cur==4){var a=L('att');var o={id:editId||uid(),d:document.getElementById('f1').value,inN:document.getElementById('f2').value,outN:document.getElementById('f3').value,h:Math.abs(Number(document.getElementById('f3').value)-Number(document.getElementById('f2').value))};if(editId){for(var i=0;i<a.length;i++) if(a[i].id==editId) a[i]=o;}else a.push(o);S('att',a);}
if(cur==5){var a=L('notes');var o={id:editId||uid(),t:document.getElementById('f1').value,c:document.getElementById('f2').value};if(editId){for(var i=0;i<a.length;i++) if(a[i].id==editId) a[i]=o;}else a.push(o);S('notes',a);}
if(cur==6){var a=L('tasks');var o={id:editId||uid(),t:document.getElementById('f1').value,c:document.getElementById('f2').value};if(editId){for(var i=0;i<a.length;i++) if(a[i].id==editId) a[i]=o;}else a.push(o);S('tasks',a);}
hide('addBox');render();
}
function del(k,id){if(confirm('مسح؟')){S(k,L(k).filter(function(x){return x.id!=id}));render()}}
function edit(k,id){var arr=L(k);for(var i=0;i<arr.length;i++) if(arr[i].id==id){editId=id;if(k=='out'||k=='inc'){curCat=arr[i].c}document.getElementById('addBox').classList.add('on');cur=k=='inc'?1:k=='out'?2:k=='deb'?3:k=='att'?4:k=='notes'?5:6;build(arr[i]);return}}
function render(){
var inc=L('inc'),out=L('out'),deb=L('deb'),att=L('att'),notes=L('notes'),tasks=L('tasks');
var si=0,so=0;for(var i=0;i<inc.length;i++) si+=inc[i].a;for(var i=0;i<out.length;i++) so+=out[i].a;
document.getElementById('topBal').innerText=fmt(69050+si-so);
document.getElementById('d1').innerText=fmt(69050+si-so)+' ج.م';document.getElementById('d1s').innerText=fmt(69050+si)+' دخل - '+fmt(so)+' صرف';
document.getElementById('d2').innerText=fmt(so)+' ج.م';
var grouped={};for(var i=0;i<deb.length;i++){var k=deb[i].p;if(!grouped[k]) grouped[k]={a:0,paid:0};grouped[k].a+=deb[i].a;grouped[k].paid+=deb[i].paid;}var pharm=0,remAll=0;for(var k in grouped){pharm+=grouped[k].a-grouped[k].paid;remAll+=grouped[k].a-grouped[k].paid;}
document.getElementById('d3').innerText=fmt(remAll)+' ج.م';document.getElementById('d3s').innerText='الصيدلية: '+fmt(pharm)+'ج';
var th=0;for(var i=0;i<att.length;i++) th+=att[i].h;document.getElementById('d4').innerText=th.toFixed(1)+' س';
var h='';for(var i=out.length-1;i>=0;i--) h+='<div class="card"><div><b>'+out[i].c+'</b> '+fmt(out[i].a)+'ج<br><small>'+out[i].n+'</small></div><div><span onclick="edit(\'out\',\''+out[i].id+'\')">✏️</span> <span onclick="del(\'out\',\''+out[i].id+'\')">🗑️</span></div></div>';document.getElementById('l2').innerHTML=h||'لا يوجد - دوس +';
h='';for(var k in grouped){var d=grouped[k];var rem=d.a-d.paid;h+='<div class="card"><div><b>'+k+'</b><br>الإجمالي '+fmt(d.a)+' - المدفوع '+fmt(d.paid)+' - المتبقي '+fmt(rem)+'</div><div><span onclick="edit(\'deb\',\''+L('deb').find(function(x){return x.p==k}).id+'\')">✏️</span> <span onclick="del(\'deb\',\''+L('deb').find(function(x){return x.p==k}).id+'\')">🗑️</span></div></div>';}document.getElementById('l3').innerHTML=h||'الصيدليه 1000 - 300 = 700';
h='';for(var i=0;i<att.length;i++) h+='<div class="card"><div>'+att[i].d+' - حضور '+att[i].inN+' ('+(att[i].inN>=12?att[i].inN-12:att[i].inN)+' '+(att[i].inN>=12?'م':'ص')+') - انصراف '+att[i].outN+' - '+att[i].h+'س</div><div><span onclick="edit(\'att\',\''+att[i].id+'\')">✏️</span> <span onclick="del(\'att\',\''+att[i].id+'\')">🗑️</span></div></div>';document.getElementById('att').innerHTML=h||'لا يوجد حضور';
h='';for(var i=0;i<notes.length;i++) h+='<div class="card"><div>'+notes[i].t+'</div><div><span onclick="edit(\'notes\',\''+notes[i].id+'\')">✏️</span> <span onclick="del(\'notes\',\''+notes[i].id+'\')">🗑️</span></div></div>';document.getElementById('l5').innerHTML=h||'لا يوجد';
h='';for(var i=0;i<tasks.length;i++) h+='<div class="card"><div>'+tasks[i].t+'</div><div><span onclick="edit(\'tasks\',\''+tasks[i].id+'\')">✏️</span> <span onclick="del(\'tasks\',\''+tasks[i].id+'\')">🗑️</span></div></div>';document.getElementById('l6').innerHTML=h||'لا يوجد';
}
try{cats=JSON.parse(localStorage.getItem('cats'))||cats}catch(e){}
render();
</script>
</body>
</html>
