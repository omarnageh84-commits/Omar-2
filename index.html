<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMAR</title><style>*{font-family:sans-serif;box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column}.h{height:54px;background:#15803D;display:flex;justify-content:space-between;align-items:center;padding:0 14px;margin:4px;border-radius:14px 14px 0 0}.page{flex:1;background:#0A0A0A;display:none;flex-direction:column;overflow:auto;padding:12px}.page.show{display:flex}.card{background:#1E1E1E;border:1px solid #222;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between}.bottom{height:72px;background:#151515;border-top:1px solid #222;display:flex;align-items:center}.bItem{flex:1;display:flex;flex-direction:column;align-items:center;font-size:9px;color:#666}.bItem.on{color:#15803D}.plusW{flex:1;display:flex;justify-content:center}.plus{width:60px;height:60px;background:#15803D;border-radius:50%;display:grid;place-items:center;font-size:32px;margin-top:-35px;border:4px solid #000}.modal{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;z-index:999;flex-direction:column}.modal.show{display:flex}.mBox{background:#1E1E1E;margin:auto;width:92%;max-width:360px;border-radius:14px;padding:14px}.inp{width:100%;height:44px;background:#111;border:1px solid #333;border-radius:10px;padding:0 10px;color:#fff;margin-top:8px}.btn{width:100%;height:42px;background:#15803D;border:0;border-radius:10px;color:#fff;margin-top:10px}.catItem{padding:12px;border-bottom:1px solid #222;display:flex;justify-content:space-between}</style></head><body>
<div class="h"><div>OMAR EGP 50000 🔒</div><div>الجنيه المصري ▼</div></div>
<div id="p1" class="page show"><div id="l1"></div></div><div id="p2" class="page"><div id="l2"></div></div><div id="p3" class="page"><div id="l3"></div></div><div id="p4" class="page"><div id="l4"></div></div><div id="p5" class="page"><div id="l5"></div></div><div id="p6" class="page"><div id="l6"></div></div>
<div class="bottom"><div class="bItem on" id="b1" onclick="go(1)">الدخل</div><div class="bItem" id="b2" onclick="go(2)">المصروف</div><div class="bItem" id="b3" onclick="go(3)">الديون</div><div class="plusW"><div class="plus" onclick="plusAct()">+</div></div><div class="bItem" id="b4" onclick="go(4)">الحضور</div><div class="bItem" id="b5" onclick="go(5)">ملاحظات</div><div class="bItem" id="b6" onclick="go(6)">اليومية</div></div>
<div id="mCats" class="modal"><div style="background:#222;padding:12px;display:flex;justify-content:space-between"><b>الأقسام - ضيف غسيل</b><span onclick="hide('mCats')">X</span></div><div style="display:flex;gap:6px;padding:10px;background:#111"><input id="newCat" class="inp" style="margin:0" placeholder="بند جديد مثلا غسيل"><button onclick="addNewCat()" style="background:#15803D;border:0;border-radius:8px;color:#fff;padding:0 12px">إضافة</button></div><div id="catList" style="flex:1;overflow:auto;background:#0A0A0A"></div></div>
<div id="mAdd" class="modal"><div class="mBox"><h3 id="aT">إضافة</h3><div id="aF"></div><button class="btn" onclick="save()">حفظ</button><button class="btn" style="background:#333" onclick="hide('mAdd')">إلغاء</button></div></div>
<script>
var cur=1,sel='',eid=null;
function G(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}
function S(k,v){localStorage.setItem(k,JSON.stringify(v))}
function uid(){return 'id'+Math.random().toString(36).slice(2,6)}
var inCats=JSON.parse(localStorage.getItem('inCats')||'["الراتب","مكافأة","هدايا","غسيل"]');
var outCats=JSON.parse(localStorage.getItem('outCats')||'[["الاكل","اكل صيدليه","غسيل"],["المواصلات","البنزين"],["الصيدلية","ديون الصيدلية"]]');
function go(n){cur=n;var ps=document.querySelectorAll('.page');for(var i=0;i<ps.length;i++)ps[i].classList.remove('show');document.getElementById('p'+n).classList.add('show');var bs=document.querySelectorAll('.bItem');for(var j=0;j<bs.length;j++)bs[j].classList.remove('on');document.getElementById('b'+n).classList.add('on');render()}
function hide(id){document.getElementById(id).classList.remove('show')}
function plusAct(){if(cur==1||cur==2){document.getElementById('mCats').classList.add('show');showCats();return}openAdd(null);document.getElementById('mAdd').classList.add('show')}
function showCats(){var h='';if(cur==1){for(var i=0;i<inCats.length;i++)h+='<div class="catItem" onclick="pick(\''+inCats[i]+'\')"><span>'+inCats[i]+'</span></div>'}else{for(var g=0;g<outCats.length;g++)for(var k=1;k<outCats[g].length;k++)h+='<div class="catItem" onclick="pick(\''+outCats[g][k]+'\')"><span>'+outCats[g][k]+'</span></div>'}document.getElementById('catList').innerHTML=h}
function addNewCat(){var v=document.getElementById('newCat').value.trim();if(!v)return;if(cur==1){inCats.push(v);S('inCats',inCats)}else{outCats[0].push(v);S('outCats',outCats)}document.getElementById('newCat').value='';showCats()}
function pick(c){sel=c;hide('mCats');openAdd(null);document.getElementById('mAdd').classList.add('show')}
function openAdd(o){var f='';if(cur==1||cur==2){f='<input id="i1" class="inp" type="number" placeholder="المبلغ" value="'+(o?o.a:'')+'"><input id="i2" class="inp" placeholder="ملاحظة" value="'+(o?o.n:'')+'">'}else if(cur==3){f='<input id="i1" class="inp" placeholder="الاسم - الصيدلية" value="'+(o?o.p:'')+'"><input id="i2" class="inp" type="number" placeholder="اجمالي 5000" value="'+(o?o.a:'')+'"><input id="i3" class="inp" type="number" placeholder="مدفوع 2500" value="'+(o?o.paid||'')+'">'}else{f='<input id="i1" class="inp" placeholder="العنوان" value="'+(o?o.t||o?o.p:'')+'"><input id="i2" class="inp" placeholder="ملاحظة" value="'+(o?o.n||'')+'">'}document.getElementById('aF').innerHTML=f}
function save(){var a;if(cur==1){a=G('income');var o={id:eid||uid(),c:sel,a:+(document.getElementById('i1').value||0),n:document.getElementById('i2').value};if(eid){for(var i=0;i<a.length;i++)if(a[i].id==eid)a[i]=o}else a.push(o);S('income',a)}else if(cur==2){a=G('outcome');var o={id:eid||uid(),c:sel,a:+(document.getElementById('i1').value||0),n:document.getElementById('i2').value};if(eid){for(var i=0;i<a.length;i++)if(a[i].id==eid)a[i]=o}else a.push(o);S('outcome',a)}else if(cur==3){a=G('debts');var o={id:eid||uid(),p:document.getElementById('i1').value,a:+(document.getElementById('i2').value||0),paid:+(document.getElementById('i3').value||0)};if(eid){for(var i=0;i<a.length;i++)if(a[i].id==eid)a[i]=o}else a.push(o);S('debts',a)}else if(cur==4){a=G('att');var o={id:eid||uid(),t:document.getElementById('i1').value||'حضور'};a.push(o);S('att',a)}else if(cur==5){a=G('notes');var o={id:eid||uid(),t:document.getElementById('i1').value};a.push(o);S('notes',a)}else{a=G('tasks');var o={id:eid||uid(),t:document.getElementById('i1').value};a.push(o);S('tasks',a)}hide('mAdd');render()}
function del(k,id){if(confirm('مسح؟')){S(k,G(k).filter(function(x){return x.id!=id}));render()}}
function render(){var inc=G('income'),out=G('outcome'),de=G('debts');var h='';for(var i=inc.length-1;i>=0;i--)h+='<div class="card"><div>'+inc[i].c+' '+inc[i].a+'ج</div><div onclick="del(\'income\',\''+inc[i].id+'\')">🗑️</div></div>';document.getElementById('l1').innerHTML=h||'لا يوجد دخل - دوس + وضيف غسيل';h='';for(var i=out.length-1;i>=0;i--)h+='<div class="card"><div>'+out[i].c+' '+out[i].a+'ج</div><div onclick="del(\'outcome\',\''+out[i].id+'\')">🗑️</div></div>';document.getElementById('l2').innerHTML=h||'لا يوجد';h='';for(var i=0;i<de.length;i++){var rem=de[i].a-(de[i].paid||0);h+='<div class="card"><div>'+de[i].p+' اجمالي '+de[i].a+' مدفوع '+(de[i].paid||0)+' متبقي '+rem+'</div><div onclick="del(\'debts\',\''+de[i].id+'\')">🗑️</div></div>'}document.getElementById('l3').innerHTML=h||'مثال: الصيدلية 5000 رديت 2500 = متبقي 2500';document.getElementById('l4').innerHTML='الحضور شغال';document.getElementById('l5').innerHTML='ملاحظات';document.getElementById('l6').innerHTML='يومية';}
render();
</script></body></html>
