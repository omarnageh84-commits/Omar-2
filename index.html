<!-- نفس الكود اللي فات بس هنزود دالتين جداد -->

<script>
// ... نفس المتغيرات catsIncome, catsExp ...

function addCat(type){
 let name=prompt('اسم الفئة الجديدة:'); if(!name) return;
 if(type==='income') catsIncome.push(name); else catsExp.push(name);
 saveAll(); if(type==='income') renderIncome(); else renderExp();
}
function manageCats(type){
 let list = type==='income'? catsIncome : catsExp;
 let html = list.map((c,i)=>`
  <div class="card">
    <span>${c}</span>
    <div>
      <button class="btn-small" onclick="editCat('${type}',${i})">✏️</button>
      <button class="btn-small" style="background:#fee2e2;color:#b91c1c" onclick="deleteCat('${type}',${i})">🗑️</button>
    </div>
  </div>`).join('');
 let target = type==='income'? 'daily-income' : 'daily-exp';
 document.getElementById(target).innerHTML += `<div style="margin-top:12px;border-top:1px dashed #e2e8f0;padding-top:10px"><b>إدارة الفئات:</b>${html}<button class="btn" style="width:100%;margin-top:8px;background:#334155" onclick="${type==='income'?'renderIncome()':'renderExp()'}">رجوع</button></div>`;
}
function editCat(type,i){
 let oldName = type==='income'? catsIncome[i] : catsExp[i];
 let newName = prompt('عدل اسم الفئة:', oldName); if(!newName) return;
 if(type==='income') catsIncome[i]=newName; else catsExp[i]=newName;
 saveAll(); if(type==='income') renderIncome(); else renderExp();
}
function deleteCat(type,i){
 if(!confirm('تمسح الفئة دي؟')) return;
 if(type==='income') catsIncome.splice(i,1); else catsExp.splice(i,1);
 saveAll(); if(type==='income') renderIncome(); else renderExp();
}

// وعدل renderIncome و renderExp يبقوا كده:
function renderIncome(){
 let opts=catsIncome.map(c=>`<option>${c}</option>`).join('');
 document.getElementById('daily-income').innerHTML=`
 <div class="input-row">
   <input id="in-a" type="number" placeholder="المبلغ">
   <select id="in-c">${opts}</select>
   <button class="btn-small" onclick="addCat('income')">+ إضافة</button>
   <button class="btn-small" onclick="manageCats('income')">⚙️ إدارة</button>
   <button class="btn" onclick="addIncome()">حفظ</button>
 </div>
 <b>الإجمالي: ${incomes.reduce((s,x)=>s+ +x.amount,0)} ج.م</b>
 ${incomes.map((x,i)=>`<div class="card"><span>${x.cat} - ${x.date}</span><b style="color:#10b981">${x.amount} ج.م <span onclick="delI(${i})">❌</span></b></div>`).join('')}`;
}
function renderExp(){
 let opts=catsExp.map(c=>`<option>${c}</option>`).join('');
 document.getElementById('daily-exp').innerHTML=`
 <div class="input-row">
   <input id="ex-a" type="number" placeholder="المبلغ">
   <select id="ex-c">${opts}</select>
   <button class="btn-small" onclick="addCat('exp')">+ إضافة</button>
   <button class="btn-small" onclick="manageCats('exp')">⚙️ إدارة</button>
   <button class="btn" style="background:#ef4444" onclick="addExp()">حفظ</button>
 </div>
 <b>الإجمالي: ${expenses.reduce((s,x)=>s+ +x.amount,0)} ج.م</b>
 ${expenses.map((x,i)=>`<div class="card"><span>${x.cat}</span><b style="color:#ef4444">${x.amount} ج.م <span onclick="delE(${i})">❌</span></b></div>`).join('')}`;
}
</script>
