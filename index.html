<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>يومياتي Pro - Single File</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--green:#10b981;--bg:#f4f6f8;--card:#fff;--r:20px}
*{font-family:'Cairo',sans-serif;box-sizing:border-box}body{margin:0;background:var(--bg)}
.app{max-width:500px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:90px}
.top{background:var(--green);color:#fff;padding:16px;border-radius:0 0 22px 22px;font-weight:800;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.06);margin:12px;padding:14px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:#f1f5f9;padding:6px;border-radius:14px}
.seg button{border:0;padding:10px;border-radius:10px;font-weight:700;cursor:pointer}.seg button.active{background:var(--green);color:#fff}
.tbl{overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#fefce8;padding:8px}td{padding:8px;text-align:center;border-top:1px solid #f1f1f1}
.inp{display:flex;gap:6px;margin:8px 0}.inp input,.inp select,.inp textarea{flex:1;padding:12px;border:1px solid #e5e7eb;border-radius:12px}
.btn{background:var(--green);color:#fff;border:0;padding:12px;border-radius:12px;font-weight:800;width:100%;cursor:pointer}
.att{grid-template-columns:26px 1fr 1fr 44px;display:grid;gap:5px;align-items:center;background:#fff;border:1px solid #eee;border-radius:12px;padding:6px;margin:5px 0}
.nav{position:fixed;bottom:0;max-width:500px;width:100%;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.nav button{border:0;background:0;padding:14px 2px;font-size:11px}.nav button.active{color:var(--green);font-weight:800;border-top:3px solid var(--green)}
</style>
</head>
<body>
<div class="app">
<div class="top"><span id="date"></span><span>💼 يومياتي Pro</span></div>
<div id="root"></div>
<div class="nav">
<button data-t="home" class="active">الرئيسية</button><button data-t="daily">اليومية</button><button data-t="att">الحضور</button><button data-t="notes">ملاحظات</button><button data-t="tasks">مهام</button>
</div>
</div>
<script>
const S=(k,v)=>localStorage.setItem(k,JSON.stringify(v)), L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
const calc=(a,b)=>{if(!a||!b)return 0;let[h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);let x=(h2*60+m2)-(h1*60+m1);if(x<0)x+=1440;return +(x/60).toFixed(2)};
document.getElementById('date').innerText=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
let cur='home', dTab='income';
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{cur=b.dataset.t; document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active'); R();});
function R(){if(cur==='home'){let t=L('att',[]).reduce((s,r)=>s+(r.h||0),0); root.innerHTML=`<div class="card" style="background:linear-gradient(135deg,#10b981,#059669);color:#fff"><h3>أهلا يا عمر</h3>${t.toFixed(1)} ساعة</div>`} if(cur==='daily') RD(); if(cur==='att') RA(); if(cur==='notes') RN(); if(cur==='tasks') RT();}

function RD(){
let rate=L('rate',40.74), pharm=L('pharm',0), data=L('daily_v3',[]), hours=L('att',[]).reduce((s,r)=>s+(r.h||0),0);
let inc=data.filter(x=>x.t==='دخل').reduce((s,x)=>s+x.a,0), exp=data.filter(x=>x.t==='مصروف').reduce((s,x)=>s+x.a,0), debt=data.filter(x=>x.t==='دين').reduce((s,x)=>s+x.a,0);
root.innerHTML=`<div class="card"><div class="tbl"><table><tr><th>المتبقي</th><th>ديون للصيدلية</th><th>مطلوب يوميا</th><th>المطلوب</th><th>الصافي</th><th>عدد الساعات</th><th>سعر الساعة</th><th>كم يوم</th><th>الساعة</th></tr><tr><td>${(inc-exp-pharm).toFixed(0)}</td><td>${pharm}</td><td>13.64</td><td>000</td><td>${(inc-exp).toFixed(0)}</td><td>${hours.toFixed(1)}</td><td>${rate}</td><td>${data.length}</td><td>00</td></tr></table></div>
<div class="inp"><input id="r" value="${rate}" type="number"><input id="ph" value="${pharm}" type="number" placeholder="ديون"><button class="btn" style="width:80px" onclick="S('rate',+r.value);S('pharm',+ph.value);RD()">حفظ</button></div></div>
<div class="card"><div class="seg"><button class="${dTab==='income'?'active':''}" onclick="dTab='income';RD()">دخل</button><button class="${dTab==='expense'?'active':''}" onclick="dTab='expense';RD()">مصروف</button><button class="${dTab==='debt'?'active':''}" onclick="dTab='debt';RD()">ديون</button></div>
<div class="inp"><input id="dd" placeholder="الوصف"><input id="da" type="number" placeholder="المبلغ"></div><button class="btn" onclick="AD()">إضافة ${dTab}</button>
<div>${data.filter(x=>(dTab==='income'&&x.t==='دخل')||(dTab==='expense'&&x.t==='مصروف')||(dTab==='debt'&&x.t==='دين')).map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee"><span>${x.d}</span><b>${x.a}</b></div>`).join('')}</div></div>`;}
function AD(){let d=dd.value,a=+da.value;if(!d||!a)return;let t=dTab==='income'?'دخل':dTab==='expense'?'مصروف':'دين', all=L('daily_v3',[]); all.unshift({d,a,t,date:new Date().toISOString()}); S('daily_v3',all); RD();}

function RA(){
let m=L('att',Array.from({length:31},(_,i)=>({day:i+1,in:'',out:'',h:0}))); if(m.length<31)m=Array.from({length:31},(_,i)=>m.find(x=>x.day===i+1)||{day:i+1,in:'',out:'',h:0});
root.innerHTML=`<div class="card"><b>الحضور - 31 يوم - ${m.reduce((s,r)=>s+(r.h||0),0).toFixed(1)} س</b></div><div class="card">${m.map(r=>`<div class="att"><b>${r.day}</b><div style="display:flex;gap:3px"><input type="time" value="${r.in}" onchange="UA(${r.day},'in',this.value)"><button onclick="NA(${r.day},'in')" style="font-size:9px;border:1px dashed blue;border-radius:6px;background:#eef2ff">الآن</button></div><div style="display:flex;gap:3px"><input type="time" value="${r.out}" onchange="UA(${r.day},'out',this.value)"><button onclick="NA(${r.day},'out')" style="font-size:9px;border:1px dashed blue;border-radius:6px;background:#eef2ff">الآن</button></div><b style="color:#10b981">${r.h||'--'}</b></div>`).join('')}</div>`;}
function UA(d,t,v){let l=L('att',[]),r=l.find(x=>x.day===d)||{day:d,in:'',out:'',h:0}; r[t]=v; if(r.in&&r.out)r.h=calc(r.in,r.out); let i=l.findIndex(x=>x.day===d); if(i>-1)l[i]=r;else l.push(r); S('att',l); RA();}
function NA(d,t){UA(d,t,new Date().toTimeString().slice(0,5));}

function RN(){let n=L('notes_notion',[]); root.innerHTML=`<div class="card"><input id="nt" placeholder="عنوان"><textarea id="nb" placeholder="تفاصيل..." style="width:100%;min-height:70px;border:1px solid #eee;border-radius:12px;padding:10px;margin-top:6px"></textarea><button class="btn" style="background:#7c3aed;margin-top:6px" onclick="AN()">حفظ ملاحظة</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px">${n.map((x,i)=>`<div style="background:#fef9c3;border-radius:14px;padding:10px;border:1px solid #eee"><b>${x.title}</b><div style="font-size:12px">${x.body}</div><button onclick="DN(${i})" style="border:0;background:#fee2e2;border-radius:6px;margin-top:6px">حذف</button></div>`).join('')}</div>`;}
function AN(){let t=nt.value,b=nb.value; if(!t)return; let n=L('notes_notion',[]); n.unshift({title:t,body:b,date:new Date().toISOString()}); S('notes_notion',n); RN();}
function DN(i){let n=L('notes_notion',[]); n.splice(i,1); S('notes_notion',n); RN();}

function RT(){let t=L('tasks_notion',[]); root.innerHTML=`<div class="card"><div style="display:flex;gap:6px"><input id="tt" placeholder="مهمة..." style="flex:1;padding:10px;border:1px solid #eee;border-radius:10px"><button class="btn" style="width:70px" onclick="AT()">+</button></div></div><div class="card">${t.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:10px;border:1px solid #eee;border-radius:12px;margin:5px 0"><label><input type="checkbox" ${x.done?'checked':''} onchange="TT(${i})"> ${x.text}</label><button onclick="DT(${i})" style="border:0;background:#fee2e2;border-radius:6px">x</button></div>`).join('')}</div>`;}
function AT(){let v=tt.value; if(!v)return; let t=L('tasks_notion',[]); t.unshift({text:v,done:false}); S('tasks_notion',t); RT();}
function TT(i){let t=L('tasks_notion',[]); t[i].done=!t[i].done; S('tasks_notion',t); RT();}
function DT(i){let t=L('tasks_notion',[]); t.splice(i,1); S('tasks_notion',t); RT();}

R();
</script>
</body>
</html>
