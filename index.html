<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OMAR - مصروفات PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A0A;color:#fff;min-height:100vh}
.top{height:56px;background:#121212;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #1E1E1E;position:sticky;top:0;z-index:30}
.tabs{height:50px;background:#121212;display:flex;border-bottom:1px solid #1E1E1E;position:sticky;top:56px;z-index:29}
.tabs button{flex:1;background:transparent;border:0;color:#777;font-weight:700;font-size:15px;position:relative;cursor:pointer}
.tabs button.on{color:#fff}
.tabs button.on::after{content:'';position:absolute;bottom:0;left:15%;right:15%;height:3px;background:#0F7A3D;border-radius:10px}
.page{padding:0 16px;padding-bottom:100px;display:none}
.page.show{display:block}
.amountBox{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:20px}
.badgeDM{border:1px solid #2A2A2A;border-radius:12px;padding:8px 14px;font-size:12px;background:#171717}
.amountInp{flex:1;background:transparent;border:0;color:#fff;font-size:38px;font-weight:800;text-align:right;outline:none;direction:ltr}
.line{height:2px;background:#0F7A3D;margin-top:8px;width:100%}
.row{padding:20px 0;border-bottom:1px solid #1A1A1A;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.row:active{background:#111}
.icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:18px}
.icon.blue{background:#0F2A4A}
.icon.brown{background:#2A2210}
.icon.yellow{background:#3A2E0A}
.icon.folder{background:#2A2210}
.rowLeft{opacity:.4;font-size:12px}
.btnSave{width:100%;height:54px;background:#0F7A3D;border:0;border-radius:16px;color:#fff;font-weight:800;font-size:16px;margin-top:24px;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;right:0;height:72px;background:#121212;border-top:1px solid #1E1E1E;display:flex;justify-content:space-around;align-items:center;z-index:40}
.bNav{color:#777;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex:1}
.bNav.on{color:#fff}
.plus{width:58px;height:58px;border-radius:50%;background:#0F7A3D;margin-top:-36px;display:grid;place-items:center;font-size:28px;color:#fff;box-shadow:0 6px 20px #0F7A3D55;cursor:pointer}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#1C1C1E;border-radius:20px 20px 0 0;z-index:100;display:none;flex-direction:column;max-height:80vh}
.sheet.show{display:flex}
.sheetHead{padding:16px;display:flex;justify-content:space-between;border-bottom:1px solid #222}
.item{padding:16px;display:flex;justify-content:space-between;border-bottom:1px solid #1E1E1E;cursor:pointer}
.overlay{position:fixed;inset:0;background:#0008;z-index:90;display:none}
.overlay.show{display:block}
.card{background:#171717;border:1px solid #1E1E1E;border-radius:16px;padding:14px;margin-top:12px}
</style>
</head>
<body>
<div class="top">
<span>⚙️</span>
<div style="display:flex;gap:8px;align-items:center"><span id="totalTop" style="opacity:.7">6,280 EGP</span><b style="color:#0F7A3D;font-size:18px">OMAR</b></div>
</div>
<div class="tabs">
<button onclick="go('debt')">ديون</button>
<button onclick="go('masrof')">مصروفات</button>
<button class="on" id="tabEntry" onclick="go('entry')">إدخال</button>
</div>

<!-- إدخال - نفس الصورة -->
<div id="page-entry" class="page show">
<div class="amountBox">
<div class="badgeDM">د.م</div>
<input id="amount" class="amountInp" type="number" value="5000" placeholder="0">
</div>
<div class="line"></div>

<div class="row" onclick="openType()">
<span class="rowLeft">‹</span>
<div style="display:flex;gap:12px;align-items:center"><span id="txtType">لنا (دخل)</span><div class="icon blue">👥</div></div>
</div>

<div class="row" onclick="openWallet()">
<span class="rowLeft">‹</span>
<div style="display:flex;gap:12px;align-items:center">
<div style="text-align:left"><div id="txtWallet">آل عمر</div><div style="font-size:11px;opacity:.5" id="txtWalletBal">6,280 ج.م</div></div>
<div class="icon brown">💼</div>
</div>
</div>

<div class="row" style="cursor:default">
<input id="note" style="flex:1;background:transparent;border:0;color:#777;text-align:right;outline:none;font-size:14px" placeholder="الملاحظات - اكتب وصف المعاملة">
</div>

<div class="row" onclick="openCats()">
<span class="rowLeft" id="txtCatLeft">المواصلات ‹</span>
<div style="display:flex;gap:12px;align-items:center"><span>المجموعة</span><div class="icon yellow">⭐</div></div>
</div>

<div class="row" onclick="openContact()">
<span class="rowLeft" id="txtContactLeft">ياسمين ‹</span>
<div style="display:flex;gap:12px;align-items:center"><span>جهة الاتصال</span><div class="icon folder">📁</div></div>
</div>

<button class="btnSave" onclick="saveEntry()">حفظ المعاملة</button>
</div>

<!-- مصروفات - للعرض -->
<div id="page-masrof" class="page">
<div id="masrofWrap"></div>
</div>

<!-- ديون - للعرض -->
<div id="page-debt" class="page">
<div style="display:flex;gap:10px;margin-top:12px">
<div class="card" style="flex:1;text-align:center"><div style="font-size:11px;opacity:.5">لنا</div><b id="debtLana" style="color:#22C55E">0</b></div>
<div class="card" style="flex:1;text-align:center"><div style="font-size:11px;opacity:.5">علينا</div><b id="debtAlena" style="color:#EF4444">0</b></div>
</div>
<div id="debtWrap"></div>
</div>

<div class="bottom">
<div class="bNav" onclick="go('debt')"><span>📕</span><span>ديون</span></div>
<div class="bNav" onclick="go('masrof')"><span>💸</span><span>مصروفات</span></div>
<div class="plus" onclick="go('entry')">+</div>
<div class="bNav" onclick="alert('الحضور قريبا')"><span>⏰</span><span>الحضور</span></div>
<div class="bNav"><span>☰</span><span>أكثر</span></div>
</div>

<div id="overlay" class="overlay" onclick="closeAll()"></div>
<div id="typeSheet" class="sheet"><div class="sheetHead"><b>اختر النوع</b><span onclick="closeAll()">✕</span></div><div class="item" onclick="setType('لنا')"><span>لنا (دخل) 💰</span></div><div class="item" onclick="setType('علينا')"><span>علينا (مصروف) 💸</span></div></div>
<div id="walletSheet" class="sheet"><div class="sheetHead"><b>اختر المحفظة</b><span onclick="closeAll()">✕</span></div><div id="walletList" style="flex:1;overflow:auto"></div><button class="btnSave" style="margin:12px;background:#EF4444" onclick="addWallet()">+ إضافة محفظة</button></div>
<div id="catsSheet" class="sheet"><div class="sheetHead"><b>المجموعة</b><span onclick="closeAll()">✕</span></div><div id="catsList" style="flex:1;overflow:auto"></div><button class="btnSave" style="margin:12px" onclick="addCat()">+ إضافة تصنيف</button></div>
<div id="contactSheet" class="sheet"><div class="sheetHead"><b>جهة الاتصال</b><span onclick="closeAll()">✕</span></div><div id="contactList" style="flex:1;overflow:auto"></div><button class="btnSave" style="margin:12px" onclick="addContact()">+ إضافة جهة</button></div>

<script>
var S={get:function(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set:function(k,v){localStorage.setItem(k,JSON.stringify(v))}}
if(!localStorage.getItem('wallets')) S.set('wallets',[{id:'w1',name:'آل عمر',bal:6280},{id:'w2',name:'انستا',bal:0}])
if(!localStorage.getItem('cats')) S.set('cats',['المواصلات','الراتب','امانات','الاكل','المواصلات','البنزين'])
if(!localStorage.getItem('contacts')) S.set('contacts',['ياسمين','حسين','إسلام وليد'])
if(!localStorage.getItem('trans')) S.set('trans',[])
if(!localStorage.getItem('last')) S.set('last',{type:'لنا',walletId:'w1',cat:'المواصلات',contact:'ياسمين'})

var cur={type:'لنا',wallet:null,cat:'المواصلات',contact:'ياسمين'}
function loadLast(){
 var last=S.get('last',{type:'لنا',walletId:'w1',cat:'المواصلات',contact:'ياسمين'})
 cur.type=last.type; cur.cat=last.cat; cur.contact=last.contact
 var ws=S.get('wallets',[]); cur.wallet=ws.find(function(w){return w.id===last.walletId})||ws[0]
 document.getElementById('txtType').innerText=cur.type==='لنا'?'لنا (دخل)':'علينا (مصروف)'
 document.getElementById('txtWallet').innerText=cur.wallet.name
 document.getElementById('txtWalletBal').innerText=cur.wallet.bal.toLocaleString()+' ج.م'
 document.getElementById('txtCatLeft').innerText=cur.cat+' ‹'
 document.getElementById('txtContactLeft').innerText=cur.contact+' ‹'
 renderTop()
}
function renderTop(){var ws=S.get('wallets',[]);var tot=0;ws.forEach(function(w){tot+=w.bal});document.getElementById('totalTop').innerText=tot.toLocaleString()+' EGP'}

function go(p){
 document.querySelectorAll('.page').forEach(function(x){x.classList.remove('show')})
 document.getElementById('page-'+p).classList.add('show')
 document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')})
 if(p==='entry') document.getElementById('tabEntry').classList.add('on')
 if(p==='masrof'){renderMasrof()}
 if(p==='debt'){renderDebt()}
}
function openType(){document.getElementById('overlay').classList.add('show');document.getElementById('typeSheet').classList.add('show')}
function setType(t){cur.type=t;document.getElementById('txtType').innerText=t==='لنا'?'لنا (دخل)':'علينا (مصروف)';closeAll()}
function openWallet(){renderWallets();document.getElementById('overlay').classList.add('show');document.getElementById('walletSheet').classList.add('show')}
function renderWallets(){var ws=S.get('wallets',[]);document.getElementById('walletList').innerHTML=ws.map(function(w){return '<div class="item" onclick="pickWallet(\''+w.id+'\')"><div><b>'+w.name+'</b><br><small style="opacity:.5">'+w.bal.toLocaleString()+' ج.م</small></div><span>›</span></div>'}).join('')}
function pickWallet(id){var ws=S.get('wallets',[]);cur.wallet=ws.find(function(w){return w.id===id});document.getElementById('txtWallet').innerText=cur.wallet.name;document.getElementById('txtWalletBal').innerText=cur.wallet.bal.toLocaleString()+' ج.م';closeAll()}
function addWallet(){var n=prompt('اسم المحفظة:');if(!n) return;var ws=S.get('wallets',[]);ws.push({id:'w'+Date.now(),name:n,bal:0});S.set('wallets',ws);renderWallets()}
function openCats(){renderCats();document.getElementById('overlay').classList.add('show');document.getElementById('catsSheet').classList.add('show')}
function renderCats(){var cs=S.get('cats',[]);document.getElementById('catsList').innerHTML=cs.map(function(c){return '<div class="item" onclick="pickCat(\''+c+'\')"><span>'+c+'</span><span>›</span></div>'}).join('')}
function pickCat(c){cur.cat=c;document.getElementById('txtCatLeft').innerText=c+' ‹';closeAll()}
function addCat(){var n=prompt('اسم التصنيف:');if(!n) return;var cs=S.get('cats',[]);if(cs.indexOf(n)===-1) cs.push(n);S.set('cats',cs);renderCats()}
function openContact(){renderContacts();document.getElementById('overlay').classList.add('show');document.getElementById('contactSheet').classList.add('show')}
function renderContacts(){var cs=S.get('contacts',[]);document.getElementById('contactList').innerHTML=cs.map(function(c){return '<div class="item" onclick="pickContact(\''+c+'\')"><span>'+c+'</span><span>›</span></div>'}).join('')}
function pickContact(c){cur.contact=c;document.getElementById('txtContactLeft').innerText=c+' ‹';closeAll()}
function addContact(){var n=prompt('اسم جهة الاتصال:');if(!n) return;var cs=S.get('contacts',[]);if(cs.indexOf(n)===-1) cs.push(n);S.set('contacts',cs);renderContacts()}
function closeAll(){document.getElementById('overlay').classList.remove('show');document.querySelectorAll('.sheet').forEach(function(s){s.classList.remove('show')})}

function saveEntry(){
 var amt=Number(document.getElementById('amount').value||0)
 if(!amt) return alert('اكتب المبلغ')
 var trans=S.get('trans',[])
 trans.push({id:Date.now(),amount:amt,type:cur.type,wallet:cur.wallet.name,walletId:cur.wallet.id,cat:cur.cat,contact:cur.contact,note:document.getElementById('note').value,date:new Date().toLocaleDateString('ar-EG')})
 S.set('trans',trans)
 var ws=S.get('wallets',[]);var ww=ws.find(function(w){return w.id===cur.wallet.id});if(ww){if(cur.type==='لنا') ww.bal+=amt; else ww.bal-=amt; S.set('wallets',ws)}
 S.set('last',{type:cur.type,walletId:cur.wallet.id,cat:cur.cat,contact:cur.contact})
 document.getElementById('amount').value=''
 alert('✅ تم الحفظ - هيفضل ثابت على: '+cur.cat+' / '+cur.contact)
 renderTop()
 go('masrof')
}

function renderMasrof(){
 var trans=S.get('trans',[]).filter(function(t){return t.type==='علينا'})
 if(trans.length===0){document.getElementById('masrofWrap').innerHTML='<div style="text-align:center;padding:60px;opacity:.4">لا يوجد مصروفات<br>ابدأ بالإدخال</div>';return}
 var html=trans.slice().reverse().map(function(t){return '<div class="card" style="display:flex;justify-content:space-between"><div><b>'+t.cat+' - '+t.amount.toLocaleString()+' ج.م</b><div style="font-size:11px;opacity:.5">'+t.wallet+' | '+t.contact+' | '+t.note+'</div></div><span style="color:#EF4444">-'+t.amount.toLocaleString()+'</span></div>'}).join('')
 document.getElementById('masrofWrap').innerHTML=html
}
function renderDebt(){
 var trans=S.get('trans',[])
 var lana=0,alena=0
 trans.forEach(function(t){if(t.type==='لنا') lana+=t.amount; else alena+=t.amount})
 document.getElementById('debtLana').innerText=lana.toLocaleString()+' ج.م'
 document.getElementById('debtAlena').innerText=alena.toLocaleString()+' ج.م'
 var html=trans.slice().reverse().map(function(t){return '<div class="card" style="display:flex;justify-content:space-between"><div><b>'+t.contact+' - '+t.cat+'</b><div style="font-size:11px;opacity:.5">'+t.wallet+'</div></div><b style="color:'+(t.type==='لنا'?'#22C55E':'#EF4444')+'">'+t.amount.toLocaleString()+'</b></div>'}).join('')
 document.getElementById('debtWrap').innerHTML=html||'<div style="text-align:center;padding:40px;opacity:.4">لا يوجد ديون</div>'
}
loadLast()
</script>
</body>
</html>
