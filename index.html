<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>OMAR PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo';box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#080808}
body{display:flex;flex-direction:column;color:#fff}
.topBar{height:52px;background:#0F0F0F;display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid #1A1A1A;flex-shrink:0}
.topTabs{height:46px;background:#0F0F0F;display:flex;flex-shrink:0;border-bottom:1px solid #1A1A1A}
.topTabs button{flex:1;background:transparent;border:0;color:#555;font-size:14px;font-weight:600;position:relative;cursor:pointer;transition:.2s}
.topTabs button.on{color:#fff;font-weight:700}
.topTabs button.on::after{content:'';position:absolute;bottom:0;left:30%;right:30%;height:2px;background:#fff;border-radius:10px;box-shadow:0 0 10px #fff}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:.35}
.center .icon{width:64px;height:64px;border:1px dashed #333;border-radius:50%;display:grid;place-items:center;font-size:24px;margin-bottom:12px}
.bottom{height:72px;background:#111111;border-top:1px solid #1E1E1E;display:flex;justify-content:space-around;align-items:center;flex-shrink:0;padding-bottom:6px}
.bItem{color:#555;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;cursor:pointer;transition:.2s}
.bItem.on{color:#fff}
.bItem.on span:first-child{filter:brightness(1.5)}
.plusWrap{flex:none;position:relative;width:70px;display:grid;place-items:center}
.plus{width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#15803D,#0F5A2A);display:grid;place-items:center;font-size:28px;color:#fff;box-shadow:0 8px 24px rgba(21,128,61,.5), inset 0 1px 1px rgba(255,255,255,.2);margin-top:-32px;cursor:pointer;transition:.2s}
.plus:active{transform:scale(.92)}
.page{flex:1;display:none;overflow:auto;background:radial-gradient(600px at 50% -10%,#111 0%,#080808 70%)}
.page.show{display:flex;flex-direction:column}
.list{padding:12px;flex:1}
.card{background:linear-gradient(180deg,#1A1A1A 0%,#171717 100%);border:1px solid #222;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div class="topBar">
<div style="display:flex;align-items:center;gap:6px"><b style="color:#0F7A3D;letter-spacing:1px;font-size:18px">OMAR</b><span style="font-size:13px;opacity:.6">6,280 EGP</span></div>
<div style="width:32px;height:32px;border-radius:50%;background:#1A1A1A;display:grid;place-items:center;font-size:14px">⚙️</div>
</div>

<div class="topTabs">
<button onclick="goTop('deyon')" id="tDeyon">ديون</button>
<button onclick="goTop('masrof')" id="tMasrof" class="on">مصروفات</button>
<button onclick="goTop('entry')" id="tEntry">إدخال</button>
</div>

<!-- صفحات فوق -->
<div id="p-entry" class="page">
<div style="padding:16px">
<div style="display:flex;gap:8px;align-items:center"><div style="border:1px solid #222;border-radius:12px;padding:8px 14px;font-size:12px;background:#141414">د.م</div><input id="amount" type="number" placeholder="0" style="flex:1;background:transparent;border:0;color:#fff;font-size:34px;font-weight:800;text-align:right;outline:none"></div>
<div style="height:2px;background:linear-gradient(90deg,#15803D,transparent);margin:10px 0 16px"></div>
<div class="card" style="display:flex;justify-content:space-between"><span>لنا (دخل)</span><span>👥</span></div>
<div class="card" style="display:flex;justify-content:space-between"><div><div>آل عمر</div><div style="font-size:11px;opacity:.5">6,280 ج.م</div></div><span>💼</span></div>
<div class="card">الملاحظات - اكتب وصف المعاملة</div>
<div class="card" style="display:flex;justify-content:space-between"><span>المجموعة</span><span>المواصلات ‹</span></div>
<div class="card" style="display:flex;justify-content:space-between"><span>جهة الاتصال</span><span>ياسمين ‹</span></div>
<button style="width:100%;height:52px;background:#15803D;border:0;border-radius:14px;color:#fff;font-weight:800;margin-top:10px">حفظ المعاملة</button>
</div>
</div>

<div id="p-masrof" class="page show">
<div class="center" id="emptyMasrof">
<div class="icon">💸</div>
<div style="font-size:15px;color:#fff">لا يوجد مصروفات</div>
<div style="font-size:13px">ابدأ بالإدخال</div>
</div>
<div class="list" id="listMasrof"></div>
</div>

<div id="p-deyon" class="page">
<div class="list" id="listDeyon"><div class="center"><div class="icon">📕</div><div>لا يوجد ديون</div></div></div>
</div>

<!-- تحت -->
<div class="bottom">
<div class="bItem" onclick="goBottom('more')" id="bMore"><span style="font-size:18px">☰</span><span>أكثر</span></div>
<div class="bItem" onclick="goBottom('hodor')" id="bHodor"><span style="font-size:18px">⏰</span><span>الحضور</span></div>
<div class="plusWrap"><div class="plus" onclick="goTop('entry')">+</div></div>
<div class="bItem on" onclick="goBottom('masrof')" id="bMasrof"><span style="font-size:18px">💸</span><span>مصروفات</span></div>
<div class="bItem" onclick="goBottom('deyon')" id="bDeyon"><span style="font-size:18px">📕</span><span>ديون</span></div>
</div>

<script>
// منع اللف
if(screen.orientation && screen.orientation.lock){try{screen.orientation.lock('portrait')}catch(e){}}
function goTop(t){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'))
 document.getElementById('p-'+t).classList.add('show')
 document.querySelectorAll('.topTabs button').forEach(b=>b.classList.remove('on'))
 document.getElementById('t'+(t==='masrof'?'Masrof':t==='deyon'?'Deyon':'Entry')).classList.add('on')
 if(t==='masrof'){document.getElementById('bMasrof').classList.add('on'); document.getElementById('bDeyon').classList.remove('on')}
}
function goBottom(b){
 if(b==='masrof') goTop('masrof')
 if(b==='deyon') goTop('deyon')
 if(b==='more') alert('أكثر: هيبقى فيه الدخل / الملاحظات / اليومية')
 if(b==='hodor') alert('الحضور والانصراف')
 document.querySelectorAll('.bItem').forEach(x=>x.classList.remove('on'))
 document.getElementById('b'+(b==='masrof'?'Masrof':b==='deyon'?'Deyon':b==='more'?'More':'Hodor')).classList.add('on')
}
</script>
</body>
</html>
