<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>يومياتي</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header><h1>يومياتي 💼</h1><span id="date"></span></header>
  <main>
    <section id="tab-home" class="tab active"></section>
    <section id="tab-daily" class="tab">
      <div class="pills">
        <button onclick="setDaily('income')" id="p-income" class="pill active">الدخل</button>
        <button onclick="setDaily('exp')" id="p-exp" class="pill">المصاريف</button>
        <button onclick="setDaily('debt')" id="p-debt" class="pill">الديون</button>
      </div>
      <div id="daily-income"></div>
      <div id="daily-exp" class="hidden"></div>
      <div id="daily-debt" class="hidden"></div>
    </section>
    <section id="tab-att" class="tab"></section>
    <section id="tab-notes" class="tab"></section>
    <section id="tab-tasks" class="tab"></section>
  </main>
  <nav>
    <button onclick="openTab('home')" class="nav-btn active">🏠<br>الرئيسية</button>
    <button onclick="openTab('daily')" class="nav-btn">💰<br>اليومية</button>
    <button onclick="openTab('att')" class="nav-btn">⏰<br>الحضور</button>
    <button onclick="openTab('notes')" class="nav-btn">📝<br>ملاحظات</button>
    <button onclick="openTab('tasks')" class="nav-btn">✅<br>مهام</button>
  </nav>
</div>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/daily.js"></script>
<script src="js/attendance.js"></script>
<script src="js/notes.js"></script>
<script src="js/tasks.js"></script>
</body>
</html>
