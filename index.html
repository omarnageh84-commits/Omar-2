<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>نظام عمر الشامل - Masareef Style 🚀</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#F0FDFA; --bg-soft:#CCFBF1; --card:#FFFFFF; --card-border:#5EEAD4; --text:#134E4A; --text-soft:#0D9488; --hero:#0F766E; --accent:#14B8A6; --nav-bg: rgba(255,255,255,0.92); }
[data-theme="dark"]{ --bg:#020617; --bg-soft:#1E293B; --card:#0F172A; --card-border:#1E293B; --text:#F1F5F9; --text-soft:#94A3B8; --hero:#0F766E; --nav-bg: rgba(15,23,42,0.92); }
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal','IBM Plex Sans Arabic',sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}
body{display:flex;justify-content:center;align-items:center}
.phone-shell{width:100%;max-width:430px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;border-left:1px solid var(--card-border);border-right:1px solid var(--card-border)}
.header{height:52px;background:var(--card);border-bottom:1.5px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;z-index:20}
.content{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;padding:8px;display:none;background:var(--bg)}
.view.active{display:flex}
.nav{height:70px;background:var(--nav-bg);backdrop-filter:blur(20px);border-top:1.5px solid var(--card-border);display:flex;align-items:center;padding:6px;gap:6px;flex-shrink:0;z-index:30}
.nav button{flex:1;height:100%;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;color:var(--text-soft);font-size:10px;font-weight:800;cursor:pointer}
.nav button.active{background:var(--hero);color:#fff}
.card{background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;padding:10px;margin-bottom:7px}
.btn{background:var(--hero);color:#fff;border:none;border-radius:10px;padding:10px;font-weight:900;cursor:pointer;font-size:11px}
#toastBox{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--card);border:1.5px solid var(--card-border);border-radius:10px;padding:8px 14px;font-size:11px;font-weight:800;box-shadow:0 10px 25px rgba(0,0,0,.15);pointer-events:auto}
</style>
</head>
<body data-theme="teal">
<div class="phone-shell">
  <div class="header">
    <div style="display:flex;gap:6px;align-items:center">
      <b style="font-size:12px">عمر ناو 🚀</b>
      <!-- علامة المزامنة المباشرة جنب الاسم - اضغط عليها للمزامنة اليدوية -->
      <div id="syncBadge" onclick="manualSync()" title="اضغط للمزامنة الفورية" style="display:flex;align-items:center;gap:3px;background:var(--bg-soft);padding:3px 7px;border-radius:99px;border:1.5px solid var(--card-border);cursor:pointer;font-size:7.5px;font-weight:900">
        <span id="syncDot">🟢</span>
        <span id="syncText">متزامن</span>
      </div>
    </div>
    <button onclick="toggleTheme()" style="border:1.5px solid var(--card-border);background:var(--bg-soft);border-radius:8px;padding:5px 10px;font-size:10px;cursor:pointer;font-weight:800">🎨 الثيم</button>
  </div>

  <div class="content">
    <!-- تبويب 1: اليومية -->
    <div id="view-daily" class="view active">
      <div class="card" style="display:flex;justify-content:space-between;align-items:center">
        <b>📊 ملخص اليومية</b>
        <span id="dailyDate" style="font-size:8px;background:var(--hero);color:#fff;padding:2px 6px;border-radius:10px"></span>
      </div>
      <div style="display:flex;gap:5px;margin-bottom:6px">
        <div class="card" style="flex:1;text-align:center;margin:0"><small style="font-size:7px;color:var(--text-soft)">دخل</small><b id="dInc" style="color:#16a34a;font-size:11px">0</b></div>
        <div class="card" style="flex:1;text-align:center;margin:0"><small style="font-size:7px;color:var(--text-soft)">مصروف</small><b id="dExp" style="color:#ef4444;font-size:11px">0</b></div>
        <div class="card" style="flex:1;text-align:center;margin:0"><small style="font-size:7px;color:var(--text-soft)">الصافي</small><b id="dNet" style="font-size:11px">0</b></div>
      </div>
      <div class="card">
        <b style="font-size:10px;display:block;margin-bottom:6px">تسجيل حركة سريعة</b>
        <div style="display:flex;gap:5px;margin-bottom:6px">
          <select id="txType" style="flex:1;padding:7px;border-radius:8px;border:1.5px solid var(--card-border);background:var(--bg-soft);color:var(--text);font-weight:800;font-size:10px"><option value="expense">مصروف</option><option value="income">دخل</option></select>
          <input id="txAmount" type="number" placeholder="القيمة" style="flex:1;padding:7px;border-radius:8px;border:1.5px solid var(--card-border);background:var(--bg-soft);color:var(--text);font-weight:800;font-size:10px">
        </div>
        <input id="txItem" placeholder="اسم البند (مثال: أكل، فاتورة...)" style="width:100%;padding:7px;border-radius:8px;border:1.5px solid var(--card-border);background:var(--bg-soft);color:var(--text);font-weight:800;font-size:10px;margin-bottom:6px">
        <button class="btn" style="width:100%;padding:8px" onclick="addTx()">+ إضافة حركة</button>
      </div>
      <div class="card" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
        <b style="font-size:10px;margin-bottom:4px">سجل الحركات</b>
        <div id="txList" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px"></div>
      </div>
    </div>

    <!-- تبويب 2: الحضور -->
    <div id="view-att" class="view">
      <div class="card">
        <b style="font-size:11px;display:block;margin-bottom:6px">⏱️ حساب الحضور والرواتب</b>
        <div style="display:flex;gap:6px;margin-bottom:6px">
          <div style="flex:1"><small style="font-size:7.5px;color:var(--text-soft)">إجمالي الراتب</small><input id="attV1" value="12,000" oninput="calcAttendance()" style="width:100%;padding:6px;border:1px solid var(--card-border);border-radius:6px;background:var(--bg-soft);color:var(--text);font-weight:900;font-size:10px"></div>
          <div style="flex:1"><small style="font-size:7.5px;color:var(--text-soft)">عدد الأيام</small><input id="attV2" value="26" oninput="calcAttendance()" style="width:100%;padding:6px;border:1px solid var(--card-border);border-radius:6px;background:var(--bg-soft);color:var(--text);font-weight:900;font-size:10px"></div>
        </div>
        <div style="font-size:10px">سعر الساعة: <b id="attPrice" style="color:var(--hero)">0</b> ج</div>
      </div>
      <div class="card" style="flex:1;overflow-y:auto">
        <b style="font-size:10px;display:block;margin-bottom:6px">أيام الشهر</b>
        <div id="attList" style="display:flex;flex-direction:column;gap:4px"></div>
      </div>
    </div>

    <!-- تبويب 3: المهام -->
    <div id="view-tasks" class="view">
      <div class="card" style="display:flex;gap:6px">
        <input id="taskInput" placeholder="أضف مهمة جديدة..." style="flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--card-border);background:var(--bg-soft);color:var(--text);font-weight:800;font-size:10px">
        <button class="btn" onclick="addTask()">إضافة</button>
      </div>
      <div id="taskList" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px"></div>
    </div>
  </div>

  <nav class="nav">
    <button class="active" onclick="switchView('daily',this)"><span style="font-size:17px">📊</span><span>اليومية</span></button>
    <button onclick="switchView('att',this)"><span style="font-size:17px">⏱️</span><span>الحضور</span></button>
    <button onclick="switchView('tasks',this)"><span style="font-size:17px">✓</span><span>المهام</span></button>
  </nav>
</div>

<div id="toastBox"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz3TyAm_BWEzlgEcqjqYA6SaBMjoLzN3j51Ewb9vp6UZNL8yJespFDUKQxWA5IOvrvW/exec';

let db = {
  daily: JSON.parse(localStorage.getItem('omar_tx_v3') || '[]'),
  tasks: JSON.parse(localStorage.getItem('omar_tasks_v1') || '[]'),
  attendance: JSON.parse(localStorage.getItem('att_fixed_final') || '{}'),
  theme: localStorage.getItem('omar_theme') || 'teal'
};

function showToast(msg){
  let box = document.getElementById('toastBox');
  let el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

function updateBadge(state, text){
  let dot = document.getElementById('syncDot');
  let txt = document.getElementById('syncText');
  if(!dot || !txt) return;
  if(state === 'syncing'){
    dot.textContent = '⏳';
    txt.textContent = text || 'بيرفع...';
  } else if(state === 'online'){
    dot.textContent = '🟢';
    txt.textContent = text || 'متزامن';
  } else {
    dot.textContent = '⚠️';
    txt.textContent = text || 'أوفلاين';
  }
}

function switchView(name, btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

function toggleTheme(){
  let next = document.body.dataset.theme === 'teal' ? 'dark' : 'teal';
  document.body.dataset.theme = next;
  db.theme = next;
  localStorage.setItem('omar_theme', next);
}

let syncTimer = null;
function saveAndSync(){
  localStorage.setItem('omar_tx_v3', JSON.stringify(db.daily));
  localStorage.setItem('omar_tasks_v1', JSON.stringify(db.tasks));
  localStorage.setItem('att_fixed_final', JSON.stringify(db.attendance));
  
  if(syncTimer) clearTimeout(syncTimer);
  updateBadge('syncing', 'حفظ محلي...');
  
  syncTimer = setTimeout(async ()=>{
    updateBadge('syncing', 'بيرفع...');
    try{
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify({ fileName: "all_project_data.json", content: db })
      });
      updateBadge('online', 'متزامن');
    }catch(e){
      updateBadge('offline', 'أوفلاين');
    }
  }, 1000);
}

async function manualSync(){
  showToast('🔄 جاري المزامنة اليدوية...');
  updateBadge('syncing', 'بيحدث...');
  try{
    let res = await fetch(SCRIPT_URL + '?fileName=all_project_data.json&t=' + Date.now());
    let json = await res.json();
    let data = json.data?.content || json.content || json.data || json;
    if(data && typeof data === 'object'){
      if(data.daily) db.daily = data.daily;
      if(data.tasks) db.tasks = data.tasks;
      if(data.attendance) db.attendance = data.attendance;
      saveAndSync();
      renderAll();
      showToast('تمت المزامنة بنجاح ✅');
      updateBadge('online', 'متزامن');
    }
  }catch(e){
    showToast('فشلت المزامنة، تأكد من الإنترنت ⚠️');
    updateBadge('offline', 'أوفلاين');
  }
}

async function loadFromDrive(){
  try{
    let res = await fetch(SCRIPT_URL + '?fileName=all_project_data.json&t=' + Date.now());
    let json = await res.json();
    let data = json.data?.content || json.content || json.data || json;
    if(data && typeof data === 'object'){
      if(data.daily && data.daily.length) db.daily = data.daily;
      if(data.tasks && data.tasks.length) db.tasks = data.tasks;
      if(data.attendance && Object.keys(data.attendance).length) db.attendance = data.attendance;
      saveAndSync();
      renderAll();
      updateBadge('online', 'متزامن');
    }
  }catch(e){
    updateBadge('offline', 'أوفلاين');
  }
}

function addTx(){
  let type = document.getElementById('txType').value;
  let amount = Number(document.getElementById('txAmount').value);
  let item = document.getElementById('txItem').value.trim();
  if(!amount || !item){ showToast('اكتب البند والقيمة'); return; }
  db.daily.unshift({id: Date.now(), type, amount, item, date: new Date().toISOString().slice(0,10)});
  document.getElementById('txAmount').value = '';
  document.getElementById('txItem').value = '';
  saveAndSync();
  renderDaily();
  showToast('تمت الإضافة بنجاح ✅');
}

function renderDaily(){
  let inc = db.daily.filter(x=>x.type==='income').reduce((a,b)=>a+b.amount,0);
  let exp = db.daily.filter(x=>x.type==='expense').reduce((a,b)=>a+b.amount,0);
  document.getElementById('dInc').textContent = inc.toLocaleString();
  document.getElementById('dExp').textContent = exp.toLocaleString();
  document.getElementById('dNet').textContent = (inc - exp).toLocaleString();
  document.getElementById('dailyDate').textContent = new Date().toLocaleDateString('ar-EG');
  
  let html = db.daily.map(t=>`<div class="card" style="padding:7px 10px;margin:0;display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:10px">${t.item}</b><small style="display:block;font-size:7px;color:var(--text-soft)">${t.date}</small></div><b style="color:${t.type==='income'?'#16a34a':'#ef4444'};font-size:10.5px">${t.amount.toLocaleString()} ج</b></div>`).join('');
  document.getElementById('txList').innerHTML = html || '<div style="text-align:center;color:var(--text-soft);padding:20px;font-size:10px">مفيش حركات مسجلة</div>';
}

function calcAttendance(){
  let v1 = Number(document.getElementById('attV1').value.replace(/,/g,'')) || 0;
  let v2 = Number(document.getElementById('attV2').value) || 26;
  let price = v2 ? (v1 / v2 / 12).toFixed(2) : 0;
  document.getElementById('attPrice').textContent = price;
  
  let daysHtml = '';
  for(let i=1; i<=30; i++){
    daysHtml += `<div class="card" style="padding:6px 10px;margin:0;display:flex;justify-content:space-between;align-items:center"><span style="font-size:9px">يوم ${i}</span><span style="font-size:9px;color:var(--hero)">حضور نظامي</span></div>`;
  }
  document.getElementById('attList').innerHTML = daysHtml;
}

function addTask(){
  let txt = document.getElementById('taskInput').value.trim();
  if(!txt) return;
  db.tasks.unshift({id: Date.now(), text: txt, done: false});
  document.getElementById('taskInput.value') = '';
  saveAndSync();
  renderTasks();
}

function renderTasks(){
  let html = db.tasks.map(t=>`<div class="card" style="padding:8px 10px;margin:0;display:flex;align-items:center;gap:8px"><input type="checkbox" ${t.done?'checked':''} onchange="db.tasks.find(x=>x.id===${t.id}).done=this.checked;saveAndSync();renderTasks()"><b style="font-size:10px;${t.done?'text-decoration:line-through;opacity:.5':''}">${t.text}</b></div>`).join('');
  document.getElementById('taskList').innerHTML = html || '<div style="text-align:center;color:var(--text-soft);padding:20px;font-size:10px">مفيش مهام حالياً</div>';
}

function renderAll(){
  renderDaily();
  calcAttendance();
  renderTasks();
}

document.body.dataset.theme = db.theme;
renderAll();
loadFromDrive();
</script>
</body>
</html>
